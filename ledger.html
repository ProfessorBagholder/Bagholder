<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bagholder</title>
<style>
:root {
  --bg: #07080a;
  --bg-elev: #0e1014;
  --bg-panel: #12151b;
  --bg-panel-2: #171b22;
  --bg-hover: #1c212a;
  --line: #262c36;
  --line-strong: #343b47;
  --text: #e6e8ec;
  --text-dim: #9aa3af;
  --text-mute: #6b7380;
  --pos: #3ecf8e;
  --pos-dim: rgba(62, 207, 142, 0.14);
  --neg: #ef6b73;
  --neg-dim: rgba(239, 107, 115, 0.14);
  --accent: #d4a017;
  --accent-2: #e8c547;
  --accent-dim: rgba(212, 160, 23, 0.12);
  --info: #6cb6ff;
  --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
  --radius: 8px;
}

* { box-sizing: border-box; }
html, body, #root { height: 100%; }
html { color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.45;
  letter-spacing: 0.01em;
}

button, input, select, textarea {
  font-family: inherit;
  color: inherit;
}
button { cursor: pointer; }
button:disabled { opacity: 0.45; cursor: not-allowed; }

.app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #10131a 0%, #0c0e13 100%);
  position: sticky;
  top: 0;
  z-index: 20;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.brand img {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid #2a3a28;
  box-shadow: 0 0 0 1px rgba(62, 207, 142, 0.35), 0 0 10px rgba(62, 207, 142, 0.18);
}
.brand h1 {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent-2);
  line-height: 1;
}
.header-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.watch-status {
  font-size: 10px;
  color: var(--text-mute);
  max-width: 220px;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.menu-wrap { position: relative; }
.menu-btn {
  width: 36px;
  height: 32px;
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 0;
  position: relative;
  color: var(--text);
}
.menu-btn:hover { background: var(--bg-hover); border-color: #4a5362; }
.menu-btn.on { border-color: var(--accent); background: var(--accent-dim); color: var(--accent-2); }
.menu-btn i {
  display: block;
  width: 15px;
  height: 1.5px;
  background: currentColor;
  border-radius: 1px;
}
.menu-btn svg { display: block; }
.menu-btn .dot {
  position: absolute;
  top: 3px;
  right: 3px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 1px #0c0e13;
}
.menu {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  min-width: 176px;
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 4px;
  z-index: 40;
}
.menu.open { display: block; }
.menu button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--text);
  padding: 8px 10px;
  border-radius: 5px;
  font-size: 13px;
}
.menu button:hover { background: var(--bg-hover); }
.menu button.danger { color: var(--neg); }
.menu button.danger:hover { background: var(--neg-dim); }

.menu .sep {
  height: 1px;
  background: var(--line);
  margin: 4px 6px;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal {
  width: min(440px, calc(100vw - 32px));
  background: #10131a;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  z-index: 61;
}
.modal-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: start;
  gap: 8px;
}
.modal-head h2 { margin: 0; font-size: 16px; letter-spacing: 0.04em; }
.modal-body { padding: 14px 16px 18px; }
.modal-body p { color: var(--text-dim); margin: 0 0 12px; }
.modal-body .quiet { color: var(--text-mute); font-size: 11px; margin: 0 0 4px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.modal .edit { margin: 0; }
.modal .edit label { margin-top: 8px; }
.modal .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal select, .modal input[type='date'], .modal input[type='number'] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 8px;
  font-size: 13px;
}
.empty .cta { margin: 14px 0 18px; }
.empty .quiet { color: var(--text-mute); font-size: 12px; margin: 8px 0 0; }
.drop-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(7, 8, 10, 0.78);
  border: 2px dashed var(--accent);
  align-items: center;
  justify-content: center;
  color: var(--accent-2);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  pointer-events: none;
}
.drop-overlay.on { display: flex; }

.btn {
  background: var(--bg-panel-2);
  border: 1px solid var(--line-strong);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); border-color: #4a5362; }
.btn.primary {
  background: var(--accent);
  color: #1a1404;
  border-color: #c49212;
  font-weight: 600;
}
.btn.primary:hover { background: var(--accent-2); }
.btn.danger { color: var(--neg); border-color: #5a3034; }
.btn.danger:hover { background: var(--neg-dim); }
.btn.ghost { background: transparent; }

/* Layout */
.main {
  flex: 1;
  padding: 14px 18px 28px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

.filter-panel {
  display: none;
  position: absolute;
  right: 0;
  top: calc(100% + 6px);
  width: 220px;
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 10px;
  z-index: 40;
}
.filter-panel.open { display: block; }
.filter-panel .field { margin-bottom: 8px; }
.filter-panel .field:last-of-type { margin-bottom: 10px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label, .kpi .label, .section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-mute);
  font-weight: 600;
}
.field input, .field select {
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  padding: 5px 8px;
  font-size: 12px;
  font-family: var(--mono);
  width: 100%;
  min-width: 0;
}
.filter-panel .reset {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--text-dim);
  padding: 6px 2px 2px;
  font-size: 12px;
}
.filter-panel .reset:hover { color: var(--text); }

/* KPIs */
.kpis {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}

.kpi.annual {
  display: flex;
  flex-direction: column;
}
.kpi.annual .value {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  margin-top: 0;
  letter-spacing: -0.04em;
}
.kpi.annual .sub {
  margin-top: 0;
}
.compare {
  margin-bottom: 0;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.compare table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
.compare th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mute);
  font-weight: 600;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  background: #161a21;
}
.compare td {
  padding: 7px 10px;
  border-bottom: 1px solid rgba(38, 44, 54, 0.65);
  font-family: var(--mono);
  font-size: 13px;
}
.compare tbody tr:last-child td { border-bottom: 0; }
.compare th.num, .compare td.num { text-align: right; width: 22%; }
.compare td.year {
  font-family: var(--sans);
  font-weight: 600;
  color: var(--text-dim);
}
.kpi {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px 11px;
  min-height: 72px;
}
.kpi .value {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 500;
  margin-top: 6px;
  letter-spacing: -0.02em;
}
.kpi .sub {
  font-size: 11px;
  color: var(--text-mute);
  margin-top: 2px;
}
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.flat { color: var(--text-dim); }

.grid-2 {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 12px 8px;
  min-height: 260px;
}
.panel.tight { min-height: 0; }
.section-title {
  margin: 0 0 8px;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.section-title em { font-style: normal; color: var(--text-dim); letter-spacing: 0; text-transform: none; font-weight: 400; }

.chart-wrap { height: 220px; width: 100%; position: relative; overflow: visible; }
.chart-tip {
  position: absolute;
  pointer-events: none;
  z-index: 3;
  background: #10131a;
  border: 1px solid var(--line-strong);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 8px;
  border-radius: 5px;
  box-shadow: var(--shadow);
  white-space: nowrap;
  transform: translate(-50%, calc(-100% - 8px));
}
.chart-tip.below { transform: translate(-50%, 12px); }
svg.chart .month-hit:hover,
svg.chart .equity-hit:hover { fill: rgba(230, 232, 236, 0.06); }
svg.chart .month-lbl,
svg.chart .chart-axis-lbl { pointer-events: none; }

.breakdowns {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 14px;
}
.b-scroll { max-height: 420px; overflow: auto; }
.b-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.b-table th.sort { cursor: pointer; user-select: none; }
.b-table th.sort:hover, .b-table th.sort.on { color: var(--text); }
.b-table th.sort .dir { margin-left: 4px; color: var(--accent-2); font-size: 9px; letter-spacing: 0; }
.b-table th {
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mute);
  font-weight: 600;
  padding: 4px 6px 8px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  background: var(--bg-panel);
  z-index: 1;
}
.b-table td {
  padding: 6px;
  border-bottom: 1px solid rgba(38, 44, 54, 0.7);
  font-family: var(--mono);
  font-size: 12px;
}
.b-table td.name { font-family: var(--sans); }
.bar-cell { width: 90px; }
.mini-bar {
  height: 4px;
  background: var(--bg-hover);
  border-radius: 2px;
  overflow: hidden;
}
.mini-bar > span { display: block; height: 100%; }
.mini-bar > span.pos { background: var(--pos); }
.mini-bar > span.neg { background: var(--neg); }

/* Blotter */
.blotter-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.blotter-head input {
  margin-left: auto;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  padding: 5px 8px;
  font-size: 12px;
  min-width: 220px;
  font-family: var(--mono);
}
.symbol-pick {
  position: relative;
  margin-left: auto;
}
.blotter-head .symbol-pick input {
  margin-left: 0;
  min-width: 180px;
  width: 180px;
}
.symbol-pick-list {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  min-width: 180px;
  max-height: 240px;
  overflow: auto;
  background: var(--bg-panel);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  z-index: 30;
  padding: 4px;
}
.symbol-pick-list button {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  color: var(--text);
  padding: 7px 10px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 12px;
}
.symbol-pick-list button:hover,
.symbol-pick-list button.on { background: var(--bg-hover); }
.table-wrap {
  overflow: auto;
  max-height: 480px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-panel);
}
table.blotter {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}
table.blotter th {
  position: sticky;
  top: 0;
  background: #161a21;
  text-align: left;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mute);
  font-weight: 600;
  padding: 8px 8px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.blotter th.sort {
  cursor: pointer;
  user-select: none;
}
table.blotter th.sort:hover { color: var(--text); }
table.blotter th.sort.on { color: var(--text); }
table.blotter th.sort .dir { margin-left: 4px; color: var(--accent-2); font-size: 9px; letter-spacing: 0; }
table.blotter td {
  padding: 7px 8px;
  border-bottom: 1px solid rgba(38, 44, 54, 0.65);
  white-space: nowrap;
  font-family: var(--mono);
  font-size: 12px;
}
table.blotter td.sans { font-family: var(--sans); color: var(--text-dim); max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
table.blotter tbody tr { cursor: pointer; }
table.blotter tbody tr:hover { background: var(--bg-hover); }
table.blotter tbody tr.selected { background: var(--accent-dim); }
.tag-chip {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--bg-hover);
  border: 1px solid var(--line);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  font-family: var(--sans);
}
.grade {
  display: inline-flex;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  font-family: var(--mono);
}
.grade.A { background: var(--pos-dim); color: var(--pos); }
.grade.B { background: rgba(108,182,255,0.15); color: var(--info); }
.grade.C { background: var(--accent-dim); color: var(--accent-2); }
.grade.F { background: var(--neg-dim); color: var(--neg); }

/* Empty */
.empty {
  max-width: 640px;
  margin: 48px auto;
  padding: 28px 30px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.empty h2 {
  margin: 0 0 8px;
  font-size: 18px;
  letter-spacing: 0.04em;
}
.empty-load { display:flex; flex-direction:column; align-items:flex-start; gap:12px; }
.spin { width:22px; height:22px; border:2px solid var(--line-strong); border-top-color: var(--accent); border-radius:50%; animation: bagspin .7s linear infinite; }
@keyframes bagspin { to { transform: rotate(360deg); } }
#importElapsed, #importStep { color: var(--text-dim); font-size:13px; margin:0; }
.empty p { color: var(--text-dim); margin: 0 0 12px; }
.empty ol { color: var(--text); padding-left: 18px; }
.empty li { margin: 6px 0; }
.empty code {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg);
  padding: 1px 5px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.warn {
  margin-top: 16px;
  padding: 10px 12px;
  border-left: 3px solid var(--accent);
  background: var(--accent-dim);
  color: var(--accent-2);
  font-size: 12px;
}
.warn.fifo-warn { margin: 0 0 14px; }

/* Import review */
.review {
  margin-bottom: 14px;
  padding: 12px 14px;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  align-items: start;
}
.review h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-mute); }
.review ul { margin: 0; padding-left: 16px; }
.review .meta { color: var(--text-dim); font-family: var(--mono); font-size: 12px; }

/* Drawer */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 40;
}
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: min(420px, 100vw);
  background: #10131a;
  border-left: 1px solid var(--line-strong);
  z-index: 50;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
.drawer-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: start;
  gap: 8px;
}
.drawer-head h2 { margin: 0; font-size: 16px; letter-spacing: 0.04em; }
.drawer-head .sym-sub { color: var(--text-dim); font-size: 12px; }
.drawer-body { padding: 14px 16px 24px; overflow: auto; flex: 1; }
.dl {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
  margin-bottom: 16px;
}
.dl div { background: var(--bg-panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.dl dt { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-mute); }
.dl dd { margin: 4px 0 0; font-family: var(--mono); font-size: 14px; }
.edit label {
  display: block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-mute);
  margin: 10px 0 4px;
}
.edit textarea, .edit input[type='text'] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  padding: 8px;
  font-size: 13px;
  resize: vertical;
  min-height: 90px;
}
.edit input[type='text'] { min-height: 0; }
.grades { display: flex; gap: 6px; }
.grades button {
  flex: 1;
  padding: 8px 0;
  border-radius: 6px;
  border: 1px solid var(--line-strong);
  background: var(--bg-panel);
  font-weight: 700;
  font-family: var(--mono);
}
.grades button.on.A, .grades button.A:hover { background: var(--pos-dim); color: var(--pos); border-color: var(--pos); }
.grades button.on.B, .grades button.B:hover { background: rgba(108,182,255,0.15); color: var(--info); border-color: var(--info); }
.grades button.on.C, .grades button.C:hover { background: var(--accent-dim); color: var(--accent-2); border-color: var(--accent); }
.grades button.on.F, .grades button.F:hover { background: var(--neg-dim); color: var(--neg); border-color: var(--neg); }



@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, 1fr); }
  .grid-2, .breakdowns { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
}

.tabs { display: flex; gap: 6px; margin: 0 0 10px; }
.tab {
  background: var(--bg-panel-2);
  border: 1px solid var(--line-strong);
  color: var(--text-dim);
  padding: 6px 12px;
  border-radius: 6px;
  font-size: 12px;
}
.tab.on, .tab:hover { color: var(--text); border-color: var(--accent); background: var(--accent-dim); }
svg.chart { width: 100%; height: 220px; display: block; }

</style>
</head>
<body>
<div id="app"></div>
<script>
/* Ledger engine: CSV parse (statement/canonical/legacy) + FIFO + metrics */

function normalizeHeader(h) {
  return String(h || "")
    .replace(/^\uFEFF/, "")
    .trim()
    .replace(/^["']+|["']+$/g, "")
    .trim()
    .toLowerCase()
    .replace(/[\s\-]+/g, "_");
}

function parseCsvRows(text) {
  text = String(text || "").replace(/^\uFEFF/, "");
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field);
      field = "";
    } else if (c === "\n") {
      row.push(field);
      field = "";
      rows.push(row);
      row = [];
    } else if (c === "\r") {
      if (text[i + 1] === "\n") continue;
      row.push(field);
      field = "";
      rows.push(row);
      row = [];
    } else {
      field += c;
    }
  }
  if (field.length || row.length) {
    row.push(field);
    rows.push(row);
  }
  if (rows.length && rows[rows.length - 1].every((v) => String(v).trim() === "")) {
    rows.pop();
  }
  return rows;
}

function parseNumber(raw) {
  if (raw == null) return 0;
  let s = String(raw).trim();
  if (!s || s === "-" || s === "—" || s.toLowerCase() === "n/a") return 0;
  const paren = /^\(.*\)$/.test(s);
  s = s.replace(/[()]/g, "");
  s = s.replace(/[$£€CADUSDcadusd,\s]/g, "");
  if (!s) return 0;
  const n = Number(s);
  if (!Number.isFinite(n)) return 0;
  return paren ? -Math.abs(n) : n;
}

const MONTHS = {
  jan: "01", feb: "02", mar: "03", apr: "04", may: "05", jun: "06",
  jul: "07", aug: "08", sep: "09", oct: "10", nov: "11", dec: "12",
};

function parseDate(raw) {
  if (raw == null) return "";
  const s = String(raw).trim();
  if (!s) return "";
  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s].*)?$/);
  if (iso) return iso[1] + "-" + iso[2] + "-" + iso[3];
  const ymdSlash = s.match(/^(\d{4})[\/.](\d{1,2})[\/.](\d{1,2})(?:\s.*)?$/);
  if (ymdSlash) {
    return ymdSlash[1] + "-" + ymdSlash[2].padStart(2, "0") + "-" + ymdSlash[3].padStart(2, "0");
  }
  const mon = s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[- ](\d{4})$/);
  if (mon) {
    const mm = MONTHS[mon[2].toLowerCase()];
    if (mm) return mon[3] + "-" + mm + "-" + mon[1].padStart(2, "0");
  }
  const monFirst = s.match(/^([A-Za-z]{3})[- ](\d{1,2}),?[- ](\d{4})$/);
  if (monFirst) {
    const mm = MONTHS[monFirst[1].toLowerCase()];
    if (mm) return monFirst[3] + "-" + mm + "-" + monFirst[2].padStart(2, "0");
  }
  const dmy = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})(?:\s.*)?$/);
  if (dmy) {
    const a = Number(dmy[1]);
    const b = Number(dmy[2]);
    const y = dmy[3];
    if (a > 12 && b <= 12) return y + "-" + String(b).padStart(2, "0") + "-" + String(a).padStart(2, "0");
    return y + "-" + String(a).padStart(2, "0") + "-" + String(b).padStart(2, "0");
  }
  if (/^\d{4,6}(\.\d+)?$/.test(s)) {
    const serial = Number(s);
    if (serial > 20000 && serial < 80000) {
      const epoch = Date.UTC(1899, 11, 30);
      const d = new Date(epoch + Math.round(serial) * 86400000);
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, "0");
      const day = String(d.getUTCDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }
  }
  return "";
}

function isFooterLine(text) {
  return /^\s*as of\s+\d{4}-\d{2}-\d{2}/i.test(text);
}

function detectFormat(headers) {
  const norms = new Set(headers.map(normalizeHeader));
  const canonHints = ["transaction_date", "activity_type", "activity_sub_type", "net_cash_amount", "unit_price"];
  const legacyHints = ["date", "action", "symbol", "quantity", "price", "amount"];
  const canonHits = canonHints.filter((h) => norms.has(h)).length;
  const legacyHits = legacyHints.filter((h) => norms.has(h)).length;
  if (canonHits >= 3) return "canonical";
  if (norms.has("transaction_date") || norms.has("activity_type")) return "canonical";
  if (norms.has("date") && norms.has("transaction") && norms.has("description") && norms.has("amount")) {
    return "statement";
  }
  if (legacyHits >= 5 && (norms.has("action") || norms.has("date"))) return "legacy";
  if (norms.has("action") && norms.has("date")) return "legacy";
  return "unknown";
}

function categorize(activityType, activitySubType) {
  const t = String(activityType).trim().toLowerCase().replace(/[\s_\-]/g, "");
  const s = String(activitySubType).trim().toLowerCase().replace(/[\s_\-]/g, "");
  const blob = t + " " + s;
  if (t === "fxexchange" || t === "fx" || s === "fxexchange" || blob.includes("fxexchange")) return "fx";
  if (t.includes("expir") || t.includes("exercise") || t.includes("assign") || s.includes("expir") || s.includes("exercise") || s.includes("assign")) {
    return "option_event";
  }
  if (t === "trade" || s === "buy" || s === "sell") return "trade";
  if (t.includes("dividend") || s.includes("dividend")) return "dividend";
  if (t.includes("deposit") || s.includes("deposit")) return "deposit";
  if (t.includes("withdraw") || s.includes("withdraw")) return "withdrawal";
  if (t.includes("interest") || s.includes("interest")) return "interest";
  if (t === "fee" || t.includes("fee") || s === "fee" || s.includes("fee")) return "fee";
  if (t.includes("transfer") || s.includes("transfer")) return "transfer";
  return "other";
}

function extractInstrument(description) {
  const text = String(description || "").trim();
  if (!text) return { symbol: "", name: "" };
  const colon = text.indexOf(":");
  if (colon < 0) {
    const dash = text.match(/^([A-Za-z][A-Za-z0-9.\-]{0,20})\s+-\s+(.+)$/);
    if (dash) return { symbol: dash[1].toUpperCase(), name: dash[2].trim() };
    return { symbol: "", name: "" };
  }
  const left = text.slice(0, colon).trim();
  const dash = left.match(/^([A-Za-z][A-Za-z0-9.\-]{0,20})\s+-\s+(.+)$/);
  if (dash) return { symbol: dash[1].toUpperCase(), name: dash[2].trim() };
  if (/\s/.test(left)) {
    const sym = left.replace(/\s+/g, " ").toUpperCase();
    return { symbol: sym, name: sym };
  }
  if (/^[A-Za-z][A-Za-z0-9.\-]{0,20}$/.test(left)) {
    const sym = left.toUpperCase();
    return { symbol: sym, name: sym };
  }
  return { symbol: "", name: "" };
}

function parseStatementDescription(description) {
  const desc = description || "";
  let quantity = 0;
  let unitPrice = 0;
  let executedAt = "";
  let fillParsed = false;
  let contractSigned = 0;
  const { symbol, name } = extractInstrument(desc);
  let sharesSigned = 0;
  const sharesMatch = desc.match(/(-?[\d,]+(?:\.\d+)?)\s+shares?\b/i);
  const contractMatch = desc.match(/(-?[\d,]+(?:\.\d+)?)\s+contracts?\b/i);
  const priceMatch = desc.match(/\bat\s+\$?([\d,]+(?:\.\d+)?)\s+per\s+share\b/i);
  if (sharesMatch) {
    sharesSigned = parseNumber(sharesMatch[1]);
    quantity = Math.abs(sharesSigned);
    fillParsed = quantity > 0;
  } else if (contractMatch) {
    contractSigned = parseNumber(contractMatch[1]);
    quantity = Math.abs(contractSigned);
    fillParsed = quantity > 0;
  }
  if (priceMatch) {
    unitPrice = parseNumber(priceMatch[1]);
  }
  const execMatch = desc.match(/\(\s*executed at\s+(\d{4}-\d{2}-\d{2})\s*\)/i);
  if (execMatch) executedAt = parseDate(execMatch[1]);
  return { symbol, name, quantity, unitPrice, executedAt, fillParsed, contractSigned, sharesSigned };
}

function mapStatementType(code, description) {
  const raw = String(code || "").trim();
  const c = raw.toUpperCase().replace(/[\s_\-]/g, "");
  const blob = (c + " " + description).toLowerCase();
  if (c.includes("EXPIR") || c === "ASSIGN" || c === "ASSIGNMENT" || c === "EXERCISE") {
    return { activityType: raw, activitySubType: raw.toUpperCase(), category: "option_event" };
  }
  if (c === "LOAN" || c === "RECALL") {
    return { activityType: raw || c, activitySubType: c, category: "other" };
  }
  if (c === "STKDIS" || c === "STKDIV" || c === "SPIN" || c === "SPINOFF") {
    return { activityType: raw || "STKDIS", activitySubType: "STKDIS", category: "trade" };
  }
  if (c === "ROC" || c === "RETURNOFCAPITAL") {
    return { activityType: raw || "ROC", activitySubType: "ROC", category: "other" };
  }
  if (c === "DIV" || c === "DIVIDEND" || c.includes("DIVIDEND")) {
    return { activityType: "Dividend", activitySubType: raw || "DIV", category: "dividend" };
  }
  if (c === "CONT" || c === "CONTRIBUTION" || c.includes("CONTRIB")) {
    return { activityType: "Deposit", activitySubType: raw || "CONT", category: "deposit" };
  }
  if (c === "WD" || c === "WITHDRAWAL" || c.includes("WITHDRAW")) {
    return { activityType: "Withdrawal", activitySubType: raw || "WD", category: "withdrawal" };
  }
  if (c === "INTCHARGED" || c === "INTPAID" || c === "INTEREST" || c.startsWith("INT")) {
    return { activityType: "Interest", activitySubType: raw || "INTEREST", category: "interest" };
  }
  if (c === "TRFOUT" || c === "TRFIN" || c === "TRANSFER" || c.startsWith("TRF") || c.includes("TRANSFER")) {
    return { activityType: "Transfer", activitySubType: raw || "TRANSFER", category: "transfer" };
  }
  if (c === "FXCONVERSION" || c === "FX" || c === "CONVERT" || c.includes("FX") || c.includes("CONVERT")) {
    return { activityType: "FxExchange", activitySubType: raw || "FX", category: "fx" };
  }
  if (c === "FEE" || c === "FCHRG" || c === "COMM" || c.includes("FEE") || c.includes("FCHRG")) {
    return { activityType: "Fee", activitySubType: raw || "FEE", category: "fee" };
  }
  if (c === "BUY" || c === "SELL") return { activityType: "Trade", activitySubType: c, category: "trade" };
  if (c.includes("SELL")) return { activityType: raw || "Trade", activitySubType: "SELL", category: "trade" };
  if (c.includes("BUY")) return { activityType: raw || "Trade", activitySubType: "BUY", category: "trade" };
  if (/\breturn of capital\b|\broc\b/.test(blob)) {
    return { activityType: raw || "ROC", activitySubType: "ROC", category: "other" };
  }
  if (/\b(bought|sold|buy|sell)\b/.test(blob) && !/\bfx\b/.test(blob) && !/conversion|convert/.test(blob)) {
    const sub = /\bsell|sold\b/.test(blob) ? "SELL" : "BUY";
    return { activityType: "Trade", activitySubType: sub, category: "trade" };
  }
  if (/dividend|distribution/.test(blob)) return { activityType: "Dividend", activitySubType: raw || "DIV", category: "dividend" };
  if (/interest/.test(blob)) return { activityType: "Interest", activitySubType: raw || "INTEREST", category: "interest" };
  if (/transfer|trfout|trfin/.test(blob)) return { activityType: "Transfer", activitySubType: raw || "TRANSFER", category: "transfer" };
  if (/\bfx\b|conversion|convert/.test(blob)) return { activityType: "FxExchange", activitySubType: raw || "FX", category: "fx" };
  if (/\bfee\b|commission|fchrg/.test(blob)) return { activityType: "Fee", activitySubType: raw || "FEE", category: "fee" };
  if (/deposit/.test(blob)) return { activityType: "Deposit", activitySubType: raw || "DEPOSIT", category: "deposit" };
  if (/withdraw/.test(blob)) return { activityType: "Withdrawal", activitySubType: raw || "WITHDRAWAL", category: "withdrawal" };
  return { activityType: raw || "Unknown", activitySubType: raw.toUpperCase(), category: categorize(raw, description) };
}

function activityId(parts) {
  return parts.map((p) => String(p ?? "").trim()).join("|");
}

function pickFrom(row, ...keys) {
  for (const key of keys) {
    if (row[key] != null && String(row[key]).trim() !== "") return String(row[key]).trim();
  }
  return "";
}

function tradeSide(activity) {
  const s = String(activity.activitySubType || "").trim().toUpperCase().replace(/[\s_\-]/g, "");
  if (s === "BUY" || s === "BUYTOOPEN" || s === "BTO" || s === "BUYTOCLOSE" || s === "BTC") return "BUY";
  if (s === "SELL" || s === "SELLTOOPEN" || s === "STO" || s === "SELLTOCLOSE" || s === "STC") return "SELL";
  const t = String(activity.activityType || "").trim().toUpperCase().replace(/[\s_\-]/g, "");
  if (t === "BUYTOOPEN" || t === "BTO" || t === "BUYTOCLOSE" || t === "BTC") return "BUY";
  if (t === "SELLTOOPEN" || t === "STO" || t === "SELLTOCLOSE" || t === "STC") return "SELL";
  return null;
}

function bookIdFromFileName(name) {
  const n = String(name || "").split("/").pop();
  const m = n.match(/([A-Z0-9]{8,}(?:CAD|USD))-\d{4}-\d{2}-\d{2}/i) || n.match(/([A-Z0-9]{8,}(?:CAD|USD))/i);
  return m ? m[1].toUpperCase() : (n || "");
}

function parseCsv(text, sourceName) {
  const skipped = [];
  const fileBookId = bookIdFromFileName(sourceName);
  let footerStripped = false;
  const rawLines = String(text || "").replace(/^\uFEFF/, "").split(/\r?\n/);
  const cleaned = [];
  for (const line of rawLines) {
    if (isFooterLine(line)) {
      footerStripped = true;
      continue;
    }
    cleaned.push(line);
  }
  const table = parseCsvRows(cleaned.join("\n"));
  if (!table.length) {
    return {
      format: "unknown",
      activities: [],
      skipped: [{ row: 1, message: "Empty file", raw: "" }],
      footerStripped,
      countsByType: {},
      rowCount: 0,
    };
  }
  const headerRow = table[0];
  const fields = headerRow.map((h) => String(h).replace(/^\uFEFF/, "").trim());
  const format = detectFormat(fields);
  const norms = fields.map(normalizeHeader);
  const activities = [];
  const countsByType = {};

  if (format === "unknown") {
    skipped.push({
      row: 1,
      message:
        "Unrecognized CSV format. Expected a Wealthsimple activities-export (canonical), a legacy Date/Action/Symbol file, or a statement export with date/transaction/description/amount columns.",
      raw: fields.join(","),
    });
    return { format, activities: [], skipped, footerStripped, countsByType, rowCount: table.length - 1 };
  }

  function rowObj(cells) {
    const o = {};
    for (let i = 0; i < norms.length; i++) o[norms[i]] = cells[i] != null ? String(cells[i]) : "";
    return o;
  }

  function rowEmpty(o) {
    return Object.values(o).every((v) => v == null || String(v).trim() === "");
  }

  for (let i = 1; i < table.length; i++) {
    const rowNum = i + 1;
    const o = rowObj(table[i]);
    if (rowEmpty(o)) continue;
    const joined = Object.values(o).join(" ");
    if (isFooterLine(joined)) {
      footerStripped = true;
      continue;
    }
    let activity = null;
    let issue;
    try {
      if (format === "statement") {
        const mapped = mapStatement(o, fileBookId);
        activity = mapped.activity;
        issue = mapped.issue;
      } else if (format === "legacy") {
        activity = mapLegacy(o);
      } else {
        activity = mapCanonical(o);
      }
    } catch (e) {
      skipped.push({ row: rowNum, message: e && e.message ? e.message : "parse error", raw: JSON.stringify(o) });
      continue;
    }
    if (issue) skipped.push({ row: rowNum, message: issue, raw: JSON.stringify(o) });
    if (!activity) {
      skipped.push({ row: rowNum, message: "Unparsed row (missing or invalid date)", raw: JSON.stringify(o) });
      continue;
    }
    activities.push(activity);
    const typeKey = activity.activityType || activity.category;
    countsByType[typeKey] = (countsByType[typeKey] || 0) + 1;
  }

  return { format, activities, skipped, footerStripped, countsByType, rowCount: table.length - 1 };
}

function mapStatement(row, bookId) {
  const settlementDate = parseDate(pickFrom(row, "date", "settlement_date", "transaction_date"));
  if (!settlementDate) return { activity: null };
  const code = pickFrom(row, "transaction", "activity_type", "type", "action");
  const description = pickFrom(row, "description", "memo", "details");
  const parsed = parseStatementDescription(description);
  const typed = mapStatementType(code, description);
  let activityType = typed.activityType;
  let activitySubType = typed.activitySubType;
  let category = typed.category;
  let currency = (pickFrom(row, "currency", "ccy") || "CAD").toUpperCase();
  const keyCcy = (String(parsed.symbol || "").match(/\b(USD|CAD)\b/i) || [])[1];
  if (keyCcy && currency !== "CAD" && currency !== "USD") currency = keyCcy.toUpperCase();
  const accountId = "";
  const book = String(bookId || "").trim();
  const balRaw = pickFrom(row, "balance");
  const balance = balRaw === "" ? null : parseNumber(balRaw);
  const netCashAmount = parseNumber(pickFrom(row, "amount", "net_cash_amount", "net_amount"));
  const compactCode = String(code || "").trim().toUpperCase().replace(/[\s_\-]/g, "");
  if (compactCode === "STKDIS" || compactCode === "STKDIV" || compactCode === "SPIN" || compactCode === "SPINOFF") {
    activityType = "STKDIS";
    activitySubType = parsed.sharesSigned < 0 ? "SELL" : "BUY";
    category = "trade";
  }
  if (parsed.fillParsed && category === "other" && compactCode !== "LOAN" && compactCode !== "RECALL") {
    activitySubType = netCashAmount < 0 ? "BUY" : "SELL";
    activityType = activityType && activityType !== "Unknown" ? activityType : "Trade";
    category = "trade";
  }
  let quantity = parsed.quantity;
  let unitPrice = parsed.unitPrice;
  if (compactCode === "STKDIS" || compactCode === "STKDIV" || compactCode === "SPIN" || compactCode === "SPINOFF") {
    unitPrice = 0;
  }
  if (parsed.fillParsed && unitPrice === 0 && parsed.quantity > 0 && compactCode !== "STKDIS" && compactCode !== "STKDIV") {
    unitPrice = Math.abs(netCashAmount) / parsed.quantity;
  }
  if (category === "option_event" && parsed.fillParsed) {
    if (parsed.contractSigned < 0) activitySubType = "BUY";
    else if (parsed.contractSigned > 0) activitySubType = "SELL";
  }
  if (activitySubType === "SELL") quantity = -Math.abs(quantity);
  else if (activitySubType === "BUY") quantity = Math.abs(quantity);
  let issue;
  if (category === "trade" && (activitySubType === "BUY" || activitySubType === "SELL") && (!parsed.fillParsed || parsed.quantity === 0)) {
    issue = "Could not parse quantity/price from description for " + activitySubType;
  }
  const transactionDate = parsed.executedAt || settlementDate;
  const activity = {
    id: activityId([transactionDate, book, parsed.symbol, quantity, unitPrice, netCashAmount, activityType, activitySubType]),
    transactionDate,
    settlementDate,
    accountId,
    bookId: book,
    accountType: "",
    activityType,
    activitySubType,
    description,
    direction: "",
    symbol: parsed.symbol,
    name: parsed.name,
    currency,
    quantity,
    unitPrice,
    commission: 0,
    netCashAmount,
    category,
    balance: balance,
    source: "statement",
  };
  return { activity, issue };
}

function mapCanonical(row) {
  const transactionDate = parseDate(pickFrom(row, "transaction_date", "date", "trade_date", "activity_date"));
  if (!transactionDate) return null;
  const activityType = pickFrom(row, "activity_type", "type");
  const activitySubType = pickFrom(row, "activity_sub_type", "activity_subtype", "sub_type", "subtype");
  const category = categorize(activityType, activitySubType);
  const quantity = parseNumber(pickFrom(row, "quantity", "qty"));
  const unitPrice = parseNumber(pickFrom(row, "unit_price", "price", "fill_price"));
  const commission = Math.abs(parseNumber(pickFrom(row, "commission", "fee", "fees")));
  const netCashAmount = parseNumber(pickFrom(row, "net_cash_amount", "amount", "net_amount", "net_cash"));
  const accountId = pickFrom(row, "account_id", "account");
  const symbol = pickFrom(row, "symbol", "ticker");
  return {
    id: activityId([transactionDate, accountId, symbol, quantity, unitPrice, netCashAmount, activityType, activitySubType]),
    transactionDate,
    settlementDate: parseDate(pickFrom(row, "settlement_date", "settle_date")) || transactionDate,
    accountId,
    accountType: pickFrom(row, "account_type"),
    activityType: activityType || "Unknown",
    activitySubType,
    description: pickFrom(row, "description", "memo", "details"),
    direction: pickFrom(row, "direction").toUpperCase(),
    symbol,
    name: pickFrom(row, "name", "security_name", "instrument"),
    currency: (pickFrom(row, "currency", "ccy") || "CAD").toUpperCase(),
    quantity,
    unitPrice,
    commission,
    netCashAmount,
    category,
    source: "canonical",
  };
}

function mapLegacy(row) {
  const transactionDate = parseDate(pickFrom(row, "date", "transaction_date"));
  if (!transactionDate) return null;
  const action = pickFrom(row, "action", "type", "activity").toLowerCase();
  let activityType = "Other";
  let activitySubType = "";
  if (action === "buy" || action === "sell") {
    activityType = "Trade";
    activitySubType = action.toUpperCase();
  } else if (action.includes("dividend")) {
    activityType = "Dividend";
    activitySubType = "DIVIDEND";
  } else if (action.includes("deposit")) {
    activityType = "Deposit";
    activitySubType = "DEPOSIT";
  } else if (action.includes("withdraw")) {
    activityType = "Withdrawal";
    activitySubType = "WITHDRAWAL";
  } else if (action.includes("interest")) {
    activityType = "Interest";
    activitySubType = "INTEREST";
  } else if (action.includes("fee")) {
    activityType = "Fee";
    activitySubType = "FEE";
  } else if (action.includes("fx")) {
    activityType = "FxExchange";
    activitySubType = action.toUpperCase();
  } else if (action) {
    activityType = action.charAt(0).toUpperCase() + action.slice(1);
    activitySubType = action.toUpperCase();
  }
  const quantity = parseNumber(pickFrom(row, "quantity", "qty"));
  const unitPrice = parseNumber(pickFrom(row, "price", "unit_price"));
  const netCashAmount = parseNumber(pickFrom(row, "amount", "net_cash_amount", "net_amount"));
  const symbol = pickFrom(row, "symbol", "ticker");
  const accountId = pickFrom(row, "account_id", "account") || "legacy";
  const commission = Math.abs(parseNumber(pickFrom(row, "commission", "fee", "fees")));
  return {
    id: activityId([transactionDate, accountId, symbol, quantity, unitPrice, netCashAmount, activityType, activitySubType]),
    transactionDate,
    settlementDate: transactionDate,
    accountId,
    accountType: pickFrom(row, "account_type") || "",
    activityType,
    activitySubType,
    description: pickFrom(row, "description", "memo"),
    direction: "",
    symbol,
    name: pickFrom(row, "name", "security_name"),
    currency: (pickFrom(row, "currency", "ccy") || "CAD").toUpperCase(),
    quantity,
    unitPrice,
    commission,
    netCashAmount,
    category: categorize(activityType, activitySubType),
    source: "legacy",
  };
}

function dedupKey(a) {
  return [a.transactionDate, a.accountId, a.symbol, a.quantity, a.unitPrice, a.netCashAmount].join("|");
}

function mergeActivities(existing, incoming) {
  const existingCounts = new Map();
  for (const a of existing) {
    const k = dedupKey(a);
    existingCounts.set(k, (existingCounts.get(k) || 0) + 1);
  }
  const incomingSeen = new Map();
  const merged = existing.slice();
  let added = 0;
  let duplicates = 0;
  for (const a of incoming) {
    const k = dedupKey(a);
    const n = (incomingSeen.get(k) || 0) + 1;
    incomingSeen.set(k, n);
    if (n <= (existingCounts.get(k) || 0)) {
      duplicates += 1;
      continue;
    }
    merged.push(a);
    added += 1;
  }
  merged.sort((x, y) => x.transactionDate.localeCompare(y.transactionDate) || x.id.localeCompare(y.id));
  return { merged, added, duplicates };
}

function daysBetween(a, b) {
  const ms = Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z");
  return Math.max(0, Math.round(ms / 86400000));
}

function stableTradeId(t) {
  return [t.accountId, t.symbol, t.currency, t.entryDate, t.exitDate, t.quantity.toFixed(8), t.entryPrice.toFixed(8), t.exitPrice.toFixed(8), t.side].join("|");
}

function compactType(s) {
  return String(s || "").trim().toUpperCase().replace(/[\s_\-]/g, "");
}

function isIntentionalOpen(activity) {
  const type = compactType(activity.activityType);
  const sub = compactType(activity.activitySubType);
  const fields = [type, sub];
  if (fields.some((f) => f.includes("TOOPEN"))) return true;
  if (fields.some((f) => f === "STO" || f === "BTO")) return true;
  return false;
}

function isCloseOnly(activity) {
  const type = compactType(activity.activityType);
  const sub = compactType(activity.activitySubType);
  const fields = [type, sub];
  if (fields.some((f) => f.includes("TOCLOSE") || f === "BTC" || f === "STC")) return true;
  if (fields.some((f) => f.includes("EXPIR") || f.includes("ASSIGN") || f.includes("EXERCISE"))) return true;
  return false;
}

function openingDirection(activity, side) {
  if (side === "BUY") {
    if (isCloseOnly(activity)) return null;
    return "LONG";
  }
  if (isIntentionalOpen(activity)) return "SHORT";
  return null;
}

function formatUnmatchedWarning(unmatched) {
  if (!unmatched || !unmatched.length) return "";
  function detail(u) {
    const qty = Number(u.quantity);
    const q = Number.isFinite(qty) ? (Math.abs(qty) >= 1 ? String(Math.round(qty)) : String(qty)) : "";
    const d = u.date || "";
    return [u.symbol, q ? q + " sh" : "", d].filter(Boolean).join(" ");
  }
  const sells = unmatched.filter((u) => u.side === "SELL");
  const buys = unmatched.filter((u) => u.side !== "SELL");
  const parts = [];
  if (sells.length) {
    parts.push(sells.length + " sell" + (sells.length === 1 ? "" : "s") + " had no matching buy (not counted as shorts): " + sells.slice(0, 8).map(detail).join("; "));
  }
  if (buys.length) {
    parts.push(buys.length + " close" + (buys.length === 1 ? "" : "s") + " had no matching open: " + buys.slice(0, 8).map(detail).join("; "));
  }
  return parts.join(" ");
}

function fifoAccount(a) {
  const nick = String((a && a.accountType) || "").trim();
  if (nick) return nick;
  if (a && a.fifoId) return String(a.fifoId);
  return String((a && a.accountId) || "");
}

function tickerWasReplaced(activities, accountId, symbol, currency, byDate) {
  let removedOn = "";
  for (let i = 0; i < (activities || []).length; i++) {
    const a = activities[i];
    if (fifoAccount(a) !== String(accountId || "")) continue;
    if (a.symbol !== symbol || a.currency !== currency) continue;
    const t = compactType(a.activityType);
    const raw = compactType(a.rawType) + compactType(a.aftType);
    const sub = compactType(a.activitySubType);
    const q = Number(a.quantity) || 0;
    const removal = (t === "STKDIS" && (sub === "SELL" || q < 0)) || /CODECHANGE|SYMBOLCHANGE|TICKERCHANGE|LISTINGSTATUS|SECURITYSWAP/.test(raw);
    if (removal && a.transactionDate && (!removedOn || a.transactionDate < removedOn)) removedOn = a.transactionDate;
  }
  if (!removedOn || removedOn > byDate) return false;
  for (let i = 0; i < (activities || []).length; i++) {
    const a = activities[i];
    if (fifoAccount(a) !== String(accountId || "")) continue;
    if (a.symbol !== symbol || a.currency !== currency) continue;
    if ((a.transactionDate || "") <= removedOn) continue;
    if ((a.category === "trade" || a.category === "option_event") && compactType(a.activityType) !== "STKDIS" && tradeSide(a)) return false;
  }
  return true;
}

function foldStkdis(activities) {
  // Name-change STKDIS is +N and -N of the same ticker on one day.
  // Net those to zero so they do not close real lots at $0. Leftover +N opens at $0.
  // Parent -N with no matching +N is ignored so we do not sell the old ticker at $0.
  const rest = [];
  const groups = new Map();
  for (let i = 0; i < activities.length; i++) {
    const a = activities[i];
    if (compactType(a.activityType) !== "STKDIS") {
      rest.push(a);
      continue;
    }
    const k = [a.symbol, a.transactionDate, a.currency].join("|");
    if (!groups.has(k)) groups.set(k, { pos: 0, neg: 0, sample: a });
    const g = groups.get(k);
    const q = Number(a.quantity) || 0;
    if (a.activitySubType === "SELL" || q < 0) g.neg += Math.abs(q);
    else g.pos += Math.abs(q);
  }
  groups.forEach((g) => {
    const net = g.pos - g.neg;
    if (net > 1e-10) {
      const a = Object.assign({}, g.sample, {
        quantity: net,
        activitySubType: "BUY",
        unitPrice: 0,
        netCashAmount: 0,
        category: "trade",
      });
      rest.push(a);
    }
  });
  return rest;
}

function matchFifo(activities) {
  const fills = foldStkdis(activities)
    .filter((a) => (a.category === "trade" || a.category === "option_event") && a.symbol)
    .map((a) => ({ activity: a, side: tradeSide(a), qty: Math.abs(a.quantity) }))
    .filter((f) => f.side && f.qty > 0);
  function fillRank(f) {
    // Same-day option order without timestamps:
    // STO, BTC (cover), BTO, STC, then plain stock SELL.
    // Stock day trades stay BUY then SELL.
    const t = compactType(f.activity.activityType);
    const s = compactType(f.activity.activitySubType);
    const blob = t + s;
    if ((blob.includes("TOOPEN") || t === "STO" || s === "STO") && f.side === "SELL") return 0;
    if (isCloseOnly(f.activity) && f.side === "BUY") return 1;
    if (f.side === "BUY") return 2;
    if (blob.includes("TOCLOSE") || t === "STC" || s === "STC") return 3;
    return 4;
  }
  fills.sort((a, b) => {
    const d = a.activity.transactionDate.localeCompare(b.activity.transactionDate);
    if (d !== 0) return d;
    const ra = fillRank(a);
    const rb = fillRank(b);
    if (ra !== rb) return ra - rb;
    return a.activity.id.localeCompare(b.activity.id);
  });
  const books = new Map();
  const closed = [];
  const unmatched = [];
  function getBook(a) {
    const k = fifoAccount(a) + "::" + a.symbol + "::" + a.currency;
    if (!books.has(k)) books.set(k, []);
    return books.get(k);
  }
  for (const fill of fills) {
    const a = fill.activity;
    const book = getBook(a);
    const closingDir = fill.side === "BUY" ? "SHORT" : "LONG";
    let remaining = fill.qty;
    while (remaining > 0 && book.length > 0 && book[0].direction === closingDir) {
      const lot = book[0];
      const matched = Math.min(lot.qty, remaining);
      const exitCommission = fill.qty > 0 ? a.commission * (matched / fill.qty) : 0;
      const entryCommission = lot.qty > 0 ? lot.commission * (matched / lot.qty) : 0;
      const commission = entryCommission + exitCommission;
      const rawPnl = lot.direction === "LONG" ? (a.unitPrice - lot.price) * matched : (lot.price - a.unitPrice) * matched;
      const trade = {
        id: "",
        accountId: lot.accountId,
        accountType: lot.accountType,
        symbol: lot.symbol,
        name: lot.name,
        currency: lot.currency,
        side: fill.side,
        quantity: matched,
        entryPrice: lot.price,
        exitPrice: a.unitPrice,
        entryDate: lot.date,
        exitDate: a.transactionDate,
        holdDays: daysBetween(lot.date, a.transactionDate),
        commission,
        entryCommission: entryCommission,
        exitCommission: exitCommission,
        pnl: rawPnl - commission,
        pnlCad: rawPnl - commission,
        openDirection: lot.direction,
      };
      trade.id = stableTradeId(trade);
      closed.push(trade);
      lot.commission *= (lot.qty - matched) / lot.qty;
      lot.qty -= matched;
      remaining -= matched;
      if (lot.qty <= 1e-10) book.shift();
    }
    if (remaining > 1e-10 && fill.side === "SELL") {
      for (const [dk, dbook] of books) {
        if (!dbook || !dbook.length) continue;
        if (dk === fifoAccount(a) + "::" + a.symbol + "::" + a.currency) continue;
        const bits = dk.split("::");
        if (bits[0] !== fifoAccount(a) || bits[2] !== a.currency) continue;
        if (!tickerWasReplaced(activities, bits[0], bits[1], bits[2], a.transactionDate)) continue;
        while (remaining > 1e-10 && dbook.length > 0 && dbook[0].direction === closingDir) {
          const lot = dbook[0];
          const matched = Math.min(lot.qty, remaining);
          const exitCommission = fill.qty > 0 ? a.commission * (matched / fill.qty) : 0;
          const entryCommission = lot.qty > 0 ? lot.commission * (matched / lot.qty) : 0;
          const commission = entryCommission + exitCommission;
          const rawPnl = lot.direction === "LONG" ? (a.unitPrice - lot.price) * matched : (lot.price - a.unitPrice) * matched;
          const trade = {
            id: "",
            accountId: lot.accountId,
            accountType: lot.accountType,
            symbol: a.symbol,
            name: a.name || lot.name,
            currency: lot.currency,
            side: fill.side,
            quantity: matched,
            entryPrice: lot.price,
            exitPrice: a.unitPrice,
            entryDate: lot.date,
            exitDate: a.transactionDate,
            holdDays: daysBetween(lot.date, a.transactionDate),
            commission,
            entryCommission: entryCommission,
            exitCommission: exitCommission,
            pnl: rawPnl - commission,
            pnlCad: rawPnl - commission,
            openDirection: lot.direction,
          };
          trade.id = stableTradeId(trade);
          closed.push(trade);
          lot.commission *= (lot.qty - matched) / lot.qty;
          lot.qty -= matched;
          remaining -= matched;
          if (lot.qty <= 1e-10) dbook.shift();
        }
        if (remaining <= 1e-10) break;
      }
    }
    if (remaining > 1e-10) {
      const opening = openingDirection(a, fill.side);
      if (opening) {
        book.push({
          qty: remaining,
          price: a.unitPrice,
          date: a.transactionDate,
          commission: fill.qty > 0 ? a.commission * (remaining / fill.qty) : 0,
          direction: opening,
          accountId: a.accountId,
          accountType: a.accountType,
          symbol: a.symbol,
          name: a.name,
          currency: a.currency,
        });
      } else {
        unmatched.push({
          symbol: a.symbol,
          currency: a.currency,
          side: fill.side,
          quantity: remaining,
          price: a.unitPrice,
          date: a.transactionDate,
          description: a.description || undefined,
          accountId: a.accountId,
        });
      }
    }
  }
  const open = [];
  for (const book of books.values()) {
    for (const lot of book) {
      if (lot.qty <= 1e-10) continue;
      open.push({
        accountId: lot.accountId,
        accountType: lot.accountType,
        symbol: lot.symbol,
        name: lot.name,
        currency: lot.currency,
        quantity: lot.qty,
        price: lot.price,
        date: lot.date,
        commission: lot.commission,
        direction: lot.direction,
      });
    }
  }
  closed.sort((a, b) => a.exitDate.localeCompare(b.exitDate) || a.id.localeCompare(b.id));
  return { closed, open, unmatched };
}

const FX_FALLBACK = 1.35;

function shiftIsoDate(iso, days) {
  const d = new Date(String(iso).slice(0, 10) + "T12:00:00");
  if (Number.isNaN(d.getTime())) return String(iso).slice(0, 10);
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function rateOn(date) {
  let d = String(date || "").slice(0, 10);
  if (!d) return FX_FALLBACK;
  for (let i = 0; i < 12; i++) {
    const r = state.fxByDate[d];
    if (r > 0) return r;
    d = shiftIsoDate(d, -1);
  }
  return FX_FALLBACK;
}

function toCad(amount, currency, date) {
  const ccy = (currency || "CAD").toUpperCase();
  if (ccy !== "USD") return amount;
  return amount * rateOn(date);
}

function applyFx(trades) {
  return trades.map((t) => {
    const ccy = (t.currency || "CAD").toUpperCase();
    if (ccy !== "USD") return Object.assign({}, t, { pnlCad: t.pnl });
    const qty = t.quantity;
    const entryC = t.entryCommission || 0;
    const exitC = t.exitCommission || 0;
    const entryNotional = t.entryPrice * qty;
    const exitNotional = t.exitPrice * qty;
    let pnlCad;
    if (t.openDirection === "SHORT") {
      pnlCad = toCad(entryNotional - entryC, ccy, t.entryDate) - toCad(exitNotional + exitC, ccy, t.exitDate);
    } else {
      pnlCad = toCad(exitNotional - exitC, ccy, t.exitDate) - toCad(entryNotional + entryC, ccy, t.entryDate);
    }
    return Object.assign({}, t, { pnlCad: pnlCad });
  });
}

async function ensureFxRates() {
  const dates = (state.activities || []).map((a) => a.transactionDate).filter(Boolean).sort();
  const start = dates[0] || "2020-01-01";
  const end = new Date().toISOString().slice(0, 10);
  const keys = Object.keys(state.fxByDate || {}).sort();
  if (keys.length && keys[0] <= start && keys[keys.length - 1] >= shiftIsoDate(end, -5)) return;
  try {
    const url = "https://www.bankofcanada.ca/valet/observations/FXUSDCAD/json?start_date=" + encodeURIComponent(start) + "&end_date=" + encodeURIComponent(end);
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const map = Object.assign({}, state.fxByDate);
    for (const ob of data.observations || []) {
      const v = ob.FXUSDCAD && Number(ob.FXUSDCAD.v);
      if (ob.d && v > 0) map[ob.d] = v;
    }
    state.fxByDate = map;
    try { localStorage.setItem(LS_FX_TABLE, JSON.stringify(map)); } catch (e) {}
    render();
  } catch (e) {}
}

function formatReturn(r) {
  if (!Number.isFinite(r)) return "—";
  const pct = (r * 100).toFixed(1) + "%";
  if (r > 0) return "+" + pct;
  return pct;
}

function spyOn(date) {
  let d = String(date || "").slice(0, 10);
  if (!d) return null;
  for (let i = 0; i < 18; i++) {
    const v = state.spyByDate[d];
    if (v > 0) return v;
    d = shiftIsoDate(d, -1);
  }
  return null;
}

function spyReturn(from, to) {
  const a = spyOn(from);
  const b = spyOn(to);
  if (!(a > 0) || !(b > 0)) return null;
  return b / a - 1;
}

function ingestYahooChart(data, map) {
  const r = data && data.chart && data.chart.result && data.chart.result[0];
  if (!r || !r.timestamp) return 0;
  const close = (r.indicators.adjclose && r.indicators.adjclose[0] && r.indicators.adjclose[0].adjclose)
    || (r.indicators.quote && r.indicators.quote[0] && r.indicators.quote[0].close);
  if (!close) return 0;
  let n = 0;
  for (let i = 0; i < r.timestamp.length; i++) {
    if (close[i] == null || !(close[i] > 0)) continue;
    const d = new Date(r.timestamp[i] * 1000).toISOString().slice(0, 10);
    map[d] = close[i];
    n += 1;
  }
  return n;
}

function ingestStooqCsv(text, map) {
  const lines = String(text || "").split(/\r?\n/);
  let n = 0;
  for (let i = 1; i < lines.length; i++) {
    const parts = lines[i].split(",");
    if (parts.length < 5) continue;
    const d = parts[0].trim();
    const px = Number(parts[4]);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || !(px > 0)) continue;
    map[d] = px;
    n += 1;
  }
  return n;
}

async function ensureSpyPrices() {

}

function ensureBookIds(activities) {
  const rows = activities || [];
  if (!rows.some((a) => !a.bookId && a.balance != null && Number.isFinite(a.balance))) return rows;
  const streams = [];
  let n = 0;
  return rows.map((a) => {
    if (a.bookId || a.balance == null || !Number.isFinite(a.balance)) return a;
    const ccy = (a.currency || "CAD").toUpperCase();
    const amt = Number(a.netCashAmount) || 0;
    let best = -1;
    let bestErr = 1e9;
    for (let i = 0; i < streams.length; i++) {
      if (streams[i].ccy !== ccy) continue;
      const err = Math.abs(streams[i].lastBal + amt - a.balance);
      if (err < bestErr) {
        bestErr = err;
        best = i;
      }
    }
    if (best >= 0 && bestErr < 0.06) {
      streams[best].lastBal = a.balance;
      return Object.assign({}, a, { bookId: streams[best].id });
    }
    n += 1;
    const id = "~" + ccy + n;
    streams.push({ ccy: ccy, lastBal: a.balance, id: id });
    return Object.assign({}, a, { bookId: id });
  });
}

function navHist() {
  return (state.navHistory || []).slice().sort(function (a, b) {
    return String(a.date || "").localeCompare(String(b.date || ""));
  });
}

function histNavOn(day) {
  const hist = navHist();
  if (!hist.length) return null;
  let v = null;
  for (let i = 0; i < hist.length; i++) {
    if (hist[i].date > day) break;
    const eq = Number(hist[i].equity);
    if (Number.isFinite(eq)) v = eq;
  }
  return v;
}

function yearWindow(activities, year) {
  const to = clampToToday(year + "-12-31");
  const cal = year + "-01-01";
  const hist = navHist();
  if (!hist.length) return { from: cal, to: to, start: null, flowAfter: cal };
  const startDay = shiftIsoDate(cal, -1);
  let start = histNavOn(startDay);
  let from = cal;
  let flowAfter = startDay;
  if (!(start > 0)) {
    let first = null;
    for (let i = 0; i < hist.length; i++) {
      if (hist[i].date >= cal && hist[i].date <= to) {
        first = hist[i];
        break;
      }
    }
    if (!first) return { from: cal, to: to, start: null, flowAfter: cal };
    from = first.date;
    start = Number(first.equity);
    flowAfter = from;
  }
  return { from: from, to: to, start: start, flowAfter: flowAfter };
}

function histNetDepositsOn(day) {
  const hist = navHist();
  if (!hist.length) return null;
  let v = null;
  for (let i = 0; i < hist.length; i++) {
    if (hist[i].date > day) break;
    if (hist[i].netDeposits != null && Number.isFinite(Number(hist[i].netDeposits))) {
      v = Number(hist[i].netDeposits);
    }
  }
  return v;
}

function bookReturn(activities, from, to, start, flowAfter) {
  const hist = navHist();
  if (!hist.length) return null;
  const after = flowAfter || shiftIsoDate(from, -1);
  if (start == null) start = histNavOn(after);
  if (!(start > 0)) return null;
  const pts = hist.filter((p) => p && p.date > after && p.date <= to);
  if (!pts.length) return null;
  let prevEq = start;
  let prevNd = histNetDepositsOn(after);
  let factor = 1;
  for (let i = 0; i < pts.length; i++) {
    const eq = Number(pts[i].equity);
    if (!Number.isFinite(eq) || !(prevEq > 0)) return null;
    let cf = 0;
    const nd = (pts[i].netDeposits != null) ? Number(pts[i].netDeposits) : null;
    if (nd != null && Number.isFinite(nd) && prevNd != null) cf = nd - prevNd;
    factor *= 1 + (eq - prevEq - cf) / prevEq;
    prevEq = eq;
    if (nd != null && Number.isFinite(nd)) prevNd = nd;
  }
  const r = factor - 1;
  if (!Number.isFinite(r)) return null;
  return r;
}

function clampToToday(iso) {
  const today = new Date().toISOString().slice(0, 10);
  return iso > today ? today : iso;
}

function compareRow(year, activities) {
  const w = yearWindow(activities, year);
  const mine = bookReturn(activities, w.from, w.to, w.start, w.flowAfter);
  const idx = spyReturn(w.from, w.to);
  const vs = (mine != null && idx != null) ? mine - idx : null;
  return (
    "<tr><td class=\"year\">" + esc(year) + "</td>" +
    '<td class="num ' + (mine == null ? "" : pnlClass(mine)) + '">' + formatReturn(mine) + "</td>" +
    '<td class="num">' + formatReturn(idx) + "</td>" +
    '<td class="num ' + (vs == null ? "" : pnlClass(vs)) + '">' + formatReturn(vs) + "</td></tr>"
  );
}

function renderCompare(closedFx, selectedYear, years, activities) {
  const ys = [];
  if (selectedYear) {
    ys.push(selectedYear);
    const prev = String(Number(selectedYear) - 1);
    if ((years || []).indexOf(prev) >= 0) ys.push(prev);
  } else {
    (years || []).forEach((y) => ys.push(y));
  }
  if (!ys.length) return "";
  const body = ys.map((y) => compareRow(y, activities)).join("");
  return (
    '<div class="compare"><table><thead><tr>' +
    "<th>Year</th><th class=\"num\">Return</th><th class=\"num\">S&amp;P 500</th><th class=\"num\">vs S&amp;P</th>" +
    "</tr></thead><tbody>" + body + "</tbody></table></div>"
  );
}

function isoDayDiff(from, to) {
  const a = Date.parse(String(from).slice(0, 10) + "T12:00:00");
  const b = Date.parse(String(to).slice(0, 10) + "T12:00:00");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return (b - a) / 86400000;
}

function accountAnnualizedReturn(activities, years) {
  const ys = (years || []).slice().sort();
  let prod = 1;
  let days = 0;
  let from = "";
  let to = "";
  let firstYear = "";
  let lastYear = "";
  for (let i = 0; i < ys.length; i++) {
    const w = yearWindow(activities, ys[i]);
    const r = bookReturn(activities, w.from, w.to, w.start, w.flowAfter);
    if (r == null || !Number.isFinite(r) || r <= -1) continue;
    const d = isoDayDiff(w.from, w.to);
    if (!(d >= 30)) continue;
    prod *= (1 + r);
    days += d;
    if (!from) {
      from = w.from;
      firstYear = ys[i];
    }
    to = w.to;
    lastYear = ys[i];
  }
  if (!from || !(days > 0)) {
    return { rate: null, from: "", to: "", years: 0, firstYear: "", lastYear: "" };
  }
  const yrs = days / 365.25;
  const rate = yrs >= 1 / 12 ? Math.pow(prod, 1 / yrs) - 1 : prod - 1;
  return { rate: rate, from: from, to: to, years: yrs, firstYear: firstYear, lastYear: lastYear };
}

function formatYearSpan(years) {
  if (!(years > 0)) return "";
  if (years >= 1) return years.toFixed(1) + " yrs";
  const months = Math.max(1, Math.round(years * 12));
  return months + " mo";
}

function renderAnnualized(activities, years) {
  const a = accountAnnualizedReturn(activities, years);
  const sub = formatYearSpan(a.years) || "No NAV history";
  const cls = a.rate == null ? "flat" : pnlClass(a.rate);
  return kpiCard("Avg annualized return", formatReturn(a.rate), esc(sub), cls, "annual");
}

function realizedPnlCurve(trades) {
  const sorted = trades.slice().sort((a, b) => a.exitDate.localeCompare(b.exitDate));
  const points = [];
  let equity = 0;
  for (const t of sorted) {
    equity += t.pnlCad;
    const last = points[points.length - 1];
    if (last && last.date === t.exitDate) last.equity = equity;
    else points.push({ date: t.exitDate, equity });
  }
  return points;
}

function equityCurve(activities, from, to) {
  const hist = state.navHistory || [];
  return hist
    .filter((p) => p && p.date && (!from || p.date >= from) && (!to || p.date <= to))
    .map((p) => ({ date: p.date, equity: Number(p.equity) || 0 }));
}

function monthlyPnl(trades) {
  const map = new Map();
  for (const t of trades) {
    const month = t.exitDate.slice(0, 7);
    map.set(month, (map.get(month) || 0) + t.pnlCad);
  }
  return Array.from(map.entries())
    .sort((a, b) => a[0].localeCompare(b[0]))
    .map(([month, pnl]) => ({ month, pnl }));
}

function maxDrawdown(points) {
  let peak = 0;
  let maxDd = 0;
  for (const p of points) {
    if (p.equity > peak) peak = p.equity;
    const dd = peak - p.equity;
    if (dd > maxDd) maxDd = dd;
  }
  return maxDd;
}

function underlyingSymbol(symbol) {
  const s = String(symbol || "").trim();
  if (!s) return "—";
  const u = s.toUpperCase().replace(/\s+/g, " ");
  if (/\b(PUT|CALL)\b/.test(u) || /\s[CP]$/.test(u)) {
    const tok = u.split(" ")[0];
    return tok || s;
  }
  const occ = u.match(/^([A-Z][A-Z0-9.]{0,9}) \d{6}[CP]\d+/);
  if (occ) return occ[1];
  const dated = u.match(/^([A-Z][A-Z0-9.]{0,9}) \d{1,2}[A-Z]{3}\d{2}\b/);
  if (dated) return dated[1];
  return s;
}

function blotterTickerMatch(t, q) {
  const qq = String(q || "").trim().toUpperCase();
  if (!qq) return true;
  const s = String(t.symbol || "").trim().toUpperCase().replace(/\s+/g, " ");
  const u = String(underlyingSymbol(t.symbol) || "").toUpperCase();
  if (u === qq || s === qq) return true;
  if (s.indexOf(qq + " ") === 0) return true;
  return false;
}

function computeMetrics(trades, openLotCount, incomeCad, feesCad) {
  const wins = trades.filter((t) => t.pnlCad > 0);
  const losses = trades.filter((t) => t.pnlCad < 0);
  const grossProfit = wins.reduce((s, t) => s + t.pnlCad, 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + t.pnlCad, 0));
  const avgWin = wins.length ? grossProfit / wins.length : 0;
  const avgLoss = losses.length ? -grossLoss / losses.length : 0;
  const winRate = trades.length ? wins.length / trades.length : 0;
  const lossRate = trades.length ? losses.length / trades.length : 0;
  const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : grossProfit > 0 ? Infinity : 0;
  const expectancy = trades.length ? winRate * avgWin + lossRate * avgLoss : 0;
  const curve = realizedPnlCurve(trades);
  const realizedPnlCad = trades.reduce((s, t) => s + t.pnlCad, 0);
  const avgHoldDays = trades.length ? trades.reduce((s, t) => s + t.holdDays, 0) / trades.length : 0;
  const bySym = new Map();
  for (let i = 0; i < trades.length; i++) {
    const t = trades[i];
    const k = underlyingSymbol(t.symbol);
    bySym.set(k, (bySym.get(k) || 0) + t.pnlCad);
  }
  let maxWinSymbol = "";
  let maxWinPnl = 0;
  let maxLossSymbol = "";
  let maxLossPnl = 0;
  bySym.forEach((pnl, sym) => {
    if (pnl > maxWinPnl) { maxWinPnl = pnl; maxWinSymbol = sym; }
    if (pnl < maxLossPnl) { maxLossPnl = pnl; maxLossSymbol = sym; }
  });
  let best = null;
  let worst = null;
  for (const t of trades) {
    if (!best || t.pnlCad > best.pnlCad) best = t;
    if (!worst || t.pnlCad < worst.pnlCad) worst = t;
  }
  return {
    realizedPnlCad, tradeCount: trades.length, winCount: wins.length, lossCount: losses.length,
    evenCount: trades.length - wins.length - losses.length,
    grossProfit, grossLoss,
    winRate, profitFactor, avgWin, avgLoss, expectancy, maxDrawdown: maxDrawdown(curve),
    maxWinPnl: maxWinPnl, maxWinSymbol: maxWinSymbol,
    maxLossPnl: maxLossPnl, maxLossSymbol: maxLossSymbol,
    avgHoldDays, bestTrade: best, worstTrade: worst, incomeCad, feesCad, openLotCount,
  };
}

function breakdown(trades, keyFn) {
  const map = new Map();
  for (const t of trades) {
    const key = keyFn(t) || "—";
    const cur = map.get(key) || { key, label: key, pnlCad: 0, trades: 0, wins: 0 };
    cur.pnlCad += t.pnlCad;
    cur.trades += 1;
    if (t.pnlCad > 0) cur.wins += 1;
    map.set(key, cur);
  }
  return Array.from(map.values())
    .map((v) => Object.assign(v, { winRate: v.trades ? v.wins / v.trades : 0 }))
    .sort((a, b) => b.pnlCad - a.pnlCad);
}

const HAS_LOCAL_API = (location.hostname === "127.0.0.1" || location.hostname === "localhost");

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatMoney(n, currency) {
  currency = currency || "CAD";
  const abs = Math.abs(n);
  const formatted = abs.toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const sign = n < 0 ? "−" : n > 0 ? "+" : "";
  return sign + currency + " " + formatted;
}
function formatSigned(n, digits) {
  digits = digits == null ? 2 : digits;
  const abs = Math.abs(n).toLocaleString("en-CA", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  if (n < 0) return "−" + abs;
  if (n > 0) return "+" + abs;
  return abs;
}
function formatCad(n, digits) {
  digits = digits == null ? 0 : digits;
  const abs = Math.abs(n).toLocaleString("en-CA", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  if (n < 0) return "−$" + abs;
  return "$" + abs;
}
function formatAxisCad(n, digits) {
  digits = digits == null ? 0 : digits;
  const abs = Math.abs(n).toLocaleString("en-CA", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  if (n < 0) return "−$" + abs;
  if (n > 0) return "+$" + abs;
  return "$" + abs;
}
function formatPct(n) {
  if (!Number.isFinite(n)) return "—";
  return (n * 100).toFixed(1) + "%";
}
function formatNumber(n, digits) {
  digits = digits == null ? 2 : digits;
  return n.toLocaleString("en-CA", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}
function formatHold(days) {
  if (days === 0) return "intraday";
  if (days === 1) return "1d";
  if (days < 60) return days + "d";
  const months = Math.round(days / 30.44);
  if (months < 24) return days + "d (~" + months + "mo)";
  return days + "d";
}
function pnlClass(n) {
  if (n > 0.0001) return "pos";
  if (n < -0.0001) return "neg";
  return "flat";
}

function persist() {
  try {
    localStorage.setItem(LS_ACT, JSON.stringify(state.activities));
    localStorage.setItem(LS_NOTES, JSON.stringify(state.notes));
    localStorage.setItem(LS_FX_TABLE, JSON.stringify(state.fxByDate || {}));
    localStorage.setItem(LS_SPY, JSON.stringify(state.spyByDate || {}));
    localStorage.setItem(LS_NAV, JSON.stringify(state.navHistory || []));
  } catch (e) {}
}

function isInventedAccountId(accountId, currency) {
  const id = String(accountId || "").trim();
  if (!id) return false;
  const up = id.toUpperCase();
  if (up === "CAD" || up === "USD" || id.toLowerCase() === "statement") return true;
  return up === String(currency || "").trim().toUpperCase();
}

function migrateInventedAccounts(activities) {
  let changed = false;
  const next = (activities || []).map((a) => {
    if (!isInventedAccountId(a.accountId, a.currency)) return a;
    changed = true;
    return Object.assign({}, a, { accountId: "", accountType: "" });
  });
  return { activities: next, changed };
}

function migrateInventedNoteKeys(notes) {
  const src = notes || {};
  const next = {};
  let changed = false;
  for (const key of Object.keys(src)) {
    const m = key.match(/^(CAD|USD|statement)\|/i);
    const nk = m ? key.slice(m[1].length) : key;
    const note = Object.assign({}, src[key]);
    if (nk !== key || (note.tradeId && note.tradeId !== nk)) {
      note.tradeId = nk;
      changed = true;
    }
    next[nk] = note;
  }
  return { notes: next, changed };
}

function loadPersisted() {
  try {
    const a = localStorage.getItem(LS_ACT);
    if (a) state.activities = JSON.parse(a);
    const n = localStorage.getItem(LS_NOTES);
    if (n) state.notes = JSON.parse(n);
    const fx = localStorage.getItem(LS_FX_TABLE);
    if (fx) {
      const parsed = JSON.parse(fx);
      if (parsed && typeof parsed === "object") state.fxByDate = parsed;
    }
    const spy = localStorage.getItem(LS_SPY);
    if (spy) {
      const parsedS = JSON.parse(spy);
      if (parsedS && typeof parsedS === "object") state.spyByDate = parsedS;
    }
    const nav = localStorage.getItem(LS_NAV);
    if (nav) {
      const parsedN = JSON.parse(nav);
      if (Array.isArray(parsedN)) state.navHistory = parsedN;
    }
    mergeSpySeed();
    state.activities = ensureBookIds(state.activities);
    const acts = migrateInventedAccounts(state.activities);
    const notes = migrateInventedNoteKeys(state.notes);
    state.activities = acts.activities;
    state.notes = notes.notes;
    if (acts.changed || notes.changed) persist();
  } catch (e) {}
}

function ingestText(name, text) {
  const parsed = parseCsv(text, name);
  const { merged, added, duplicates } = mergeActivities(state.activities, parsed.activities);
  state.activities = ensureBookIds(merged);
  state.reports = [{
    file: name,
    format: parsed.format,
    rowCount: parsed.rowCount,
    added,
    duplicates,
    footerStripped: parsed.footerStripped,
    countsByType: parsed.countsByType,
    skipped: parsed.skipped,
  }];
  persist();
  render();
  ensureFxRates();
  ensureSpyPrices();
}

function filteredTrades(closedFx) {
  const f = state.filters;
  return closedFx.filter((t) => {
    if (f.from && t.exitDate < f.from) return false;
    if (f.to && t.exitDate > f.to) return false;
    if (f.account && t.accountId !== f.account && t.accountType !== f.account) return false;
    if (f.symbol && underlyingSymbol(t.symbol) !== f.symbol) return false;
    return true;
  });
}

function unique(arr) {
  return Array.from(new Set(arr.filter(Boolean))).sort();
}

function yearsFromActivities(activities) {
  const years = new Set();
  for (let i = 0; i < (activities || []).length; i++) {
    const d = String((activities[i] && activities[i].transactionDate) || "").slice(0, 4);
    if (/^\d{4}$/.test(d)) years.add(d);
  }
  return Array.from(years).sort().reverse();
}

function yearFromRange(from, to) {
  const a = /^(\d{4})-01-01$/.exec(from || "");
  const b = /^(\d{4})-12-31$/.exec(to || "");
  if (a && b && a[1] === b[1]) return a[1];
  return "";
}

function cmp(a, b) {
  if (a == null && b == null) return 0;
  if (a == null || a === "") return 1;
  if (b == null || b === "") return -1;
  if (typeof a === "number" && typeof b === "number") {
    if (a < b) return -1;
    if (a > b) return 1;
    return 0;
  }
  return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: "base" });
}

function sortRows(rows, keyFn, dir) {
  const m = dir === "asc" ? 1 : -1;
  return rows.slice().sort((a, b) => m * cmp(keyFn(a), keyFn(b)));
}

function groupClosedByExit(trades) {
  // FIFO writes one row per buy lot. Same sell against 12 lots looks like 12 tiny P&Ls.
  // Collapse those slices so the table is one row per close (avg entry, summed P&L).
  const map = new Map();
  for (let i = 0; i < trades.length; i++) {
    const t = trades[i];
    const k = [t.symbol, t.currency, t.exitDate, Number(t.exitPrice).toFixed(8), t.side, t.openDirection].join("|");
    let g = map.get(k);
    if (!g) {
      g = {
        id: t.id,
        accountId: t.accountId,
        accountType: t.accountType,
        symbol: t.symbol,
        name: t.name,
        currency: t.currency,
        side: t.side,
        quantity: 0,
        entryPrice: 0,
        exitPrice: t.exitPrice,
        entryDate: t.entryDate,
        exitDate: t.exitDate,
        holdDays: t.holdDays,
        commission: 0,
        pnl: 0,
        pnlCad: 0,
        openDirection: t.openDirection,
        _entryNotional: 0,
      };
      map.set(k, g);
    }
    g.quantity += t.quantity;
    g.pnl += t.pnl;
    g.pnlCad += t.pnlCad;
    g.commission += t.commission;
    g._entryNotional += t.entryPrice * t.quantity;
    if (t.entryDate < g.entryDate) g.entryDate = t.entryDate;
  }
  const out = Array.from(map.values());
  for (let i = 0; i < out.length; i++) {
    const g = out[i];
    g.entryPrice = g.quantity ? g._entryNotional / g.quantity : 0;
    g.holdDays = daysBetween(g.entryDate, g.exitDate);
    delete g._entryNotional;
  }
  return out;
}

function closedTradesForBlotter() {
  const { closed } = matchFifo(state.activities);
  const visible = filteredTrades(applyFx(closed));
  const grouped = groupClosedByExit(visible);
  const q = (state.filters.q || "").trim().toUpperCase();
  const searched = !q ? grouped : grouped.filter(function (t) {
    return blotterTickerMatch(t, q);
  });
  const closedSort = state.sort.closed || { key: "exitDate", dir: "desc" };
  return sortRows(searched, (t) => {
    const n = state.notes[t.id] || {};
    const map = {
      entryDate: t.entryDate,
      exitDate: t.exitDate,
      symbol: t.symbol,
      side: t.openDirection === "SHORT" ? "COVER" : t.side,
      quantity: t.quantity,
      entryPrice: t.entryPrice,
      exitPrice: t.exitPrice,
      pnlCad: t.pnlCad,
      holdDays: t.holdDays,
      currency: t.currency,
      tag: n.tag || "",
      notes: n.thesis || "",
    };
    return map[closedSort.key];
  }, closedSort.dir);
}

function closedBlotterBodyHtml(rows) {

function bindClosedBlotterClicks(root) {
  const scope = root || document;

function refreshClosedBlotter() {
  const tbody = document.querySelector("table#closedBlotter tbody");
  if (!tbody) return;
  const rows = closedTradesForBlotter();
  const countEl = document.getElementById("closedCount");
  if (countEl) countEl.textContent = rows.length + " closed";

function blotterSymbolList() {
  const { closed } = matchFifo(state.activities);
  const grouped = groupClosedByExit(filteredTrades(applyFx(closed)));
  const seen = {};
  const out = [];
  for (let i = 0; i < grouped.length; i++) {
    const s = underlyingSymbol(grouped[i].symbol);
    if (!s || s === "—" || seen[s]) continue;
    seen[s] = true;
    out.push(s);
  }
  out.sort(function (a, b) { return a.localeCompare(b); });
  return out;
}

function matchingBlotterSymbols(q) {
  const all = blotterSymbolList();
  const qq = String(q || "").trim().toUpperCase();
  if (!qq) return all;
  return all.filter(function (s) { return s.toUpperCase().indexOf(qq) === 0; });
}

function exactBlotterSymbol(q) {
  const qq = String(q || "").trim().toUpperCase();
  if (!qq) return "";
  const matches = matchingBlotterSymbols(qq);
  for (let i = 0; i < matches.length; i++) {
    if (matches[i].toUpperCase() === qq) return matches[i];
  }
  return "";
}
