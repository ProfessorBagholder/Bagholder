<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bagholder</title>
<link rel="icon" type="image/png" href="favicon.png"/>
<script src="/lightweight-charts.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"/>
<style>
html{color-scheme:dark}
:root{
  --mat:#101220;--bg:#161826;--surface:#232532;--n900:#292b31;--accent:#9184d9;--accent-300:#d2cefd;--accent-900:#2b2741;
  --ink:#e9e9ed;--ink-rgb:233,233,237;--ink75:rgba(233,233,237,.8);--ink60:rgba(233,233,237,.68);--ink55:rgba(233,233,237,.62);
  --hair:rgba(233,233,237,.14);--grid:rgba(233,233,237,.07);--pos:#6fd39b;--neg:#e0778a;--mixed:#7972a9;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28);--shadow-md:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(233,233,237,.06);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--font-num:var(--font);--brand-color:var(--ink);--brand-transform:none;--brand-spacing:.02em;--outline:.1;--field:rgba(22,24,38,.55);
  --chip-bg:var(--accent-900);--chip-fg:var(--accent-300);--chip-hi:rgba(145,132,217,.18);
  --pie-1:#9184d9;--pie-2:#6fd39b;--pie-3:#5fb0e6;--pie-4:#e8b36a;--pie-5:#e0778a;--pie-6:#7fd3c9;--pie-7:#c48fdc;--pie-8:#d7c46a;--pie-9:#e59a6a;--pie-10:#8fb87a;--pie-11:#a0a8b8;
  --pos-rgb:111,211,155;--neg-rgb:224,119,138;--accent-rgb:145,132,217;--accent-bar:var(--accent);--hover:.08;--area:.22;--well:var(--n900);--well-line:.12;
}
html[data-theme="midnight"]{
  --mat:#06070b;--bg:#0b0d12;--surface:#10131a;--n900:#171b24;--accent:#3fd68a;--accent-300:#8fe8b8;--accent-900:#123324;
  --ink:#e6e8ee;--ink-rgb:230,232,238;--ink75:rgba(230,232,238,.8);--ink60:rgba(230,232,238,.66);--ink55:rgba(230,232,238,.6);
  --hair:rgba(230,232,238,.16);--grid:rgba(230,232,238,.08);--pos:#3fd68a;--neg:#ff6b7a;--mixed:#6c6f8a;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);--shadow-md:0 10px 28px rgba(0,0,0,.6),0 0 0 1px rgba(230,232,238,.08);
  --font-num:ui-monospace,"JetBrains Mono","SF Mono",Menlo,monospace;--outline:.14;--field:rgba(4,5,9,.6);
  --chip-bg:rgba(230,232,238,.1);--chip-fg:rgba(230,232,238,.82);--chip-hi:rgba(230,232,238,.12);
  --pos-rgb:63,214,138;--neg-rgb:255,107,122;--accent-rgb:63,214,138;
  --pie-1:#3fd68a;--pie-2:#5fb0e6;--pie-3:#9184d9;--pie-4:#e8b36a;--pie-5:#ff6b7a;--pie-6:#7fd3c9;--pie-7:#c48fdc;--pie-8:#d7c46a;--pie-9:#f0955f;--pie-10:#a3c96f;--pie-11:#9aa4b5;
}
html[data-theme="light"]{color-scheme:light;
  --mat:#e0e2ea;--bg:#eef0f5;--surface:#fafafc;--n900:#f1f2f6;--accent:#6b5cd6;--accent-300:#4a3bb8;--accent-900:#e9e6fa;--accent-bar:#a89ee6;
  --ink:#1b1d27;--ink-rgb:27,29,39;--ink75:rgba(27,29,39,.82);--ink60:rgba(27,29,39,.72);--ink55:rgba(27,29,39,.66);
  --hair:rgba(27,29,39,.12);--grid:rgba(27,29,39,.06);--pos:#2e8a62;--neg:#c0505f;--mixed:#9a95c4;--pos-rgb:46,138,98;--neg-rgb:192,80,95;--accent-rgb:107,92,214;
  --shadow-sm:0 1px 2px rgba(20,22,40,.06);--shadow-md:0 10px 28px rgba(20,22,40,.14),0 0 0 1px rgba(27,29,39,.08);
  --outline:.08;--field:rgba(27,29,39,.04);--hover:.045;--area:.16;--well:transparent;--well-line:.09;
  --pie-1:#a89ee6;--pie-2:#8fd4b4;--pie-3:#93c4ec;--pie-4:#f0c98c;--pie-5:#eea3ae;--pie-6:#9adbd4;--pie-7:#cfaee6;--pie-8:#e0d48c;--pie-9:#f2b592;--pie-10:#b9d69c;--pie-11:#b6bec9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--mat);color:var(--ink);color-scheme:dark}
body{font:400 13px/1.45 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh;padding:24px}
#app{background:var(--bg);border-radius:20px;box-shadow:0 0 0 1px var(--hair);overflow:hidden;min-height:calc(100vh - 48px)}
button{font-family:inherit}
a{color:var(--accent)}
h4,h5{font-weight:500;margin:0;letter-spacing:0}
h4{font-size:20px}
h5{font-size:14px}
.card{background:var(--surface);border-radius:8px;box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),var(--outline))}
.elev-sm{box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),var(--outline)),var(--shadow-sm)}
.elev-md{box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.12),var(--shadow-md)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:6px;cursor:pointer;font:500 12.5px Inter,system-ui,sans-serif;padding:6px 12px;color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.16);white-space:nowrap}
.btn:hover{background:var(--n900)}
.btn-primary{background:var(--accent);color:var(--bg);box-shadow:none}
.btn-primary:hover{background:var(--accent)}
.btn-secondary{background:var(--surface);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.16)}
.btn-icon{width:34px;height:34px;padding:0;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.input{width:100%;border:0;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.14);color:var(--ink);font:400 13px Inter,system-ui,sans-serif;padding:10px 12px;outline:none;min-height:40px}
.input::placeholder{color:rgba(var(--ink-rgb),.4)}
.input:focus{box-shadow:inset 0 0 0 1px var(--accent)}
textarea.input{resize:none;line-height:1.5}
.table{width:100%;border-collapse:separate;border-spacing:0}
.table th{font:500 10.5px/18px Inter,system-ui,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink60);text-align:left;padding:4px 5.6px 8px;background:var(--surface);user-select:none}
.table td{padding:7px 5.6px;border-top:1px solid rgba(var(--ink-rgb),.06);font-size:12.5px;vertical-align:middle}
.table tbody tr:hover{background:rgba(var(--ink-rgb),var(--hover))}
.tab{font-variant-numeric:tabular-nums;font-family:var(--font-num)}
.muted{color:var(--ink55)}
.dim{color:var(--ink60)}
.pos{color:var(--pos)}
.neg{color:var(--neg)}
.lbl{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink55)}
.seg{display:flex;gap:0;padding:0;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.14);overflow:hidden}
.seg-opt{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 0;cursor:pointer;font-size:13px;color:var(--ink);border-left:1px solid rgba(var(--ink-rgb),.14)}
.seg-opt:first-child{border-left:0}
.seg-opt:hover{background:rgba(var(--ink-rgb),.06)}
.seg-opt.on{background:var(--chip-bg);color:var(--chip-fg)}
.seg-opt input{display:none}
.scroll{overflow-y:auto;overflow-x:hidden;min-width:0}
.scroll-xy{overflow:auto;min-width:0}
.th-in{display:inline-flex;vertical-align:top;align-items:center;gap:4px;height:18px;line-height:18px;position:relative}
.arrow{display:block;width:9px;height:9px;overflow:hidden;font-size:9px;line-height:9px}
.chip{display:inline-flex;align-items:center;font-size:12px;border-radius:6px;overflow:hidden;background:var(--n900);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.09);white-space:nowrap}
.chip .cf{padding:3px 7px;color:var(--ink60)}
.chip .cv{cursor:pointer;border:0;font:400 12px Inter,system-ui,sans-serif;padding:3px 8px;background:var(--accent-900);color:var(--accent-300)}
.chip .cv:hover{background:var(--accent-900)}
.chip .cx{cursor:pointer;border:0;font:400 12px Inter,system-ui,sans-serif;padding:3px 7px;background:transparent;color:var(--ink60);line-height:1.4}
.chip .cx:hover{background:rgba(var(--neg-rgb),.3)}
.pop{position:absolute;top:42px;right:0;z-index:30;width:300px;background:var(--surface);border-radius:8px;padding:9px;text-align:left;box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.12),var(--shadow-md)}
.pop-row{cursor:pointer;border:0;display:flex;align-items:center;gap:8px;text-align:left;font:400 12.5px Inter,system-ui,sans-serif;padding:6px 7px 6px 10px;border-radius:5px;background:transparent;color:rgba(var(--ink-rgb),.85);width:100%}
.pop-row:hover{background:rgba(var(--ink-rgb),var(--hover))}
.pop-row.on{background:var(--accent-900);color:var(--accent-300);box-shadow:inset 3px 0 0 var(--chip-fg)}
.pop-row.on:hover{background:rgba(var(--accent-rgb),.28)}
.pop-row.hi{background:rgba(var(--ink-rgb),var(--hover))}
.pop-row:focus{outline:none}
.pop-row.on.hi{background:rgba(var(--accent-rgb),.28)}
.pill{cursor:pointer;border:0;font:400 11.5px Inter,system-ui,sans-serif;padding:4px 0;border-radius:6px;background:rgba(var(--ink-rgb),.06);color:rgba(var(--ink-rgb),.7);font-variant-numeric:tabular-nums}
.pill:hover{background:rgba(var(--ink-rgb),.18)}
.pill.on{background:var(--accent-900);color:var(--accent-300)}
/* the chart library's credit sits in the card's bottom-left corner at the same
   inset as the title in the top-left: 18px from the left, 16px from the bottom */
#tradeChart a[href*="tradingview.com"]{left:0!important;bottom:-24px!important}

.menu{position:absolute;top:42px;right:0;z-index:5;width:max-content;min-width:170px;background:var(--surface);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:1px;box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.12),var(--shadow-md)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;cursor:pointer;color:rgba(var(--ink-rgb),.85);font:400 13px Inter,system-ui,sans-serif;padding:7px 9px;border-radius:6px}
.menu button:hover{background:rgba(var(--ink-rgb),var(--hover))}
.menu button.primary{color:var(--accent-300);font-weight:500}
.menu button[disabled]{opacity:.4;cursor:default}
.menu .sep{height:1px;background:rgba(var(--ink-rgb),.1);margin:4px 2px}
.menu button.open{background:rgba(var(--ink-rgb),var(--hover))}
.menu .sub{top:0;right:calc(100% + 8px);z-index:6}
.menu .sub::before{content:"";position:absolute;top:0;bottom:0;left:100%;width:8px}
.menu .swatch{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(var(--ink-rgb),.3)}
.tabbtn{background:transparent;border:0;cursor:pointer;font:500 13px Inter,system-ui,sans-serif;padding:11px 0;flex:none;white-space:nowrap;color:var(--ink60)}
.tabbtn:hover{color:var(--accent-300)}
.tabbtn.on{color:var(--accent-300);box-shadow:inset 0 -2px 0 var(--accent)}
.kpi{padding:12px;height:87px;display:flex;flex-direction:column;justify-content:center}
.kpi .v{font-size:21px;font-weight:500;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;line-height:1.15}
.kpi .s{font-size:11px;color:var(--ink60);white-space:nowrap;margin-top:2px}
.grade{display:inline-grid;place-items:center;vertical-align:middle;width:20px;height:20px;border-radius:5px;font-size:11px;line-height:1}
.g-ab{background:rgba(var(--pos-rgb),.14);color:var(--pos)}
.g-f{background:rgba(var(--neg-rgb),.16);color:var(--neg)}
.g-c,.g-none{background:rgba(var(--ink-rgb),.09);color:rgba(var(--ink-rgb),.65)}
.tagchip{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--chip-bg);color:var(--chip-fg);white-space:nowrap;max-width:54px;overflow:hidden;text-overflow:ellipsis;display:inline-block;vertical-align:middle}
.queue-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:6px;cursor:pointer;background:var(--well);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),var(--well-line))}
.queue-row:hover{background:rgba(var(--accent-rgb),.06);box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.4)}
.tip{position:absolute;top:0;padding:5px 8px;border-radius:6px;background:var(--n900);box-shadow:var(--shadow-md);pointer-events:none;white-space:nowrap;z-index:2}
.tip .tv{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.tip .tl{font-size:10px;color:var(--ink55);font-variant-numeric:tabular-nums}
.xline{position:absolute;top:0;bottom:0;width:1px;background:rgba(var(--ink-rgb),.35);pointer-events:none}
.bar-col{position:relative;flex:1;height:100%;cursor:pointer}
.bar-col:hover{background:rgba(var(--ink-rgb),.05)}
.rule-b{background:linear-gradient(to right,transparent,rgba(var(--ink-rgb),.14) 20px,rgba(var(--ink-rgb),.14) calc(100% - 20px),transparent) no-repeat bottom/100% 1px}
.rule-t{background:linear-gradient(to right,transparent,rgba(var(--ink-rgb),.14) 20px,rgba(var(--ink-rgb),.14) calc(100% - 20px),transparent) no-repeat top/100% 1px}
tr.sel{box-shadow:inset 0 0 0 9999px rgba(var(--accent-rgb),.14)}
.status-err{color:var(--neg)}
/* order ticket */
.tk-scrim{position:fixed;inset:24px;border-radius:20px;background:rgba(16,18,32,.42);z-index:20}
.tk{position:fixed;top:24px;right:24px;bottom:24px;width:400px;background:var(--surface);z-index:21;display:flex;flex-direction:column;border-radius:0 20px 20px 0;box-shadow:-1px 0 0 rgba(var(--ink-rgb),.12),-18px 0 40px rgba(0,0,0,.45);overflow:hidden}
.tk .num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.tk-hd{display:flex;align-items:center;padding:18px 24px 0;flex:none}
.tk-title{font-size:15px;font-weight:500}
.tk-x{margin-left:auto;margin-right:-6px;width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:rgba(var(--ink-rgb),.62);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tk-x:hover{background:rgba(var(--ink-rgb),.08)}
.tk-body{flex:1;overflow-y:auto;padding:22px 24px 20px;display:flex;flex-direction:column;gap:22px}
.tk-quote{padding:14px 16px;border-radius:8px;background:var(--n900);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.08);display:flex;flex-direction:column;gap:12px}
.tk-seg{display:flex;padding:2px;border-radius:8px;background:var(--field);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.10)}
.tk-segopt{flex:1;padding:8px;border-radius:6px;border:0;background:transparent;color:var(--ink60);font:500 13px var(--font);cursor:pointer}
.tk-segopt.on.buy{background:rgba(var(--pos-rgb),.16);color:var(--pos)}
.tk-segopt.on.sell{background:rgba(var(--neg-rgb),.16);color:var(--neg)}
.tk-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.tk-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.tk-l{font-size:12px;color:var(--ink55)}
.tk-in{height:36px;border-radius:6px;border:0;background:var(--field);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.14);color:var(--ink);font:400 13px var(--font);padding:0 10px;outline:none;width:100%;min-width:0}
.tk-in:focus{box-shadow:inset 0 0 0 1px var(--accent)}
.tk-sel{position:relative;display:block}
.tk-sel select{appearance:none;-webkit-appearance:none;padding-right:28px;cursor:pointer}
.tk-sel select option{background:var(--surface);color:var(--ink)}
.tk-sel svg{position:absolute;right:10px;top:12px;pointer-events:none;color:rgba(var(--ink-rgb),.5)}
.tk-rule{height:1px;flex:none;background:linear-gradient(90deg,transparent,rgba(var(--ink-rgb),.14) 48px,rgba(var(--ink-rgb),.14) calc(100% - 48px),transparent)}
.tk-sec{display:flex;flex-direction:column;gap:12px}
.tk-sech{display:flex;align-items:center;min-height:20px;font-size:13px;font-weight:500}
.tk-add{margin-left:auto;border:0;background:transparent;cursor:pointer;font:500 12.5px var(--font);color:var(--accent);padding:0}
.tk-add:hover{color:var(--accent-300)}
.tk-rm{margin-left:auto;border:0;background:transparent;cursor:pointer;font:400 12px var(--font);color:rgba(var(--ink-rgb),.45);padding:0}
.tk-rm:hover{color:var(--accent-300)}
.tk-read{display:flex;justify-content:space-between;gap:12px;font-size:12px}
.tk-read .l{color:var(--ink55);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-read .r{white-space:nowrap}
.tk-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.tk-row .l{color:var(--ink55)}
.tk-ft{display:flex;align-items:center;padding:14px 24px 20px;box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.10);flex:none}
.tk-cancel{border:0;background:transparent;cursor:pointer;font:500 13px var(--font);color:var(--ink55);padding:0}
.tk-cancel:hover{color:var(--accent-300)}
.tk-go{margin-left:auto;border:0;background:transparent;cursor:pointer;font:500 13px var(--font);color:var(--accent-300);box-shadow:inset 0 0 0 1px var(--accent);padding:9px 18px;border-radius:8px}
.tk-go:hover{background:rgba(var(--accent-rgb),.12)}
.tk-go[disabled]{opacity:.5;cursor:default}
.tk-rowbtns{display:inline-flex;gap:2px;flex:none}
.tk-rowbtn{width:22px;height:22px;border-radius:5px;border:0;background:transparent;color:rgba(var(--ink-rgb),.5);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.tk-rowbtn.off{color:rgba(var(--ink-rgb),.18);cursor:default;pointer-events:none}
.tk-rowbtn.buy:hover{background:rgba(var(--pos-rgb),.16);color:var(--pos)}
.tk-rowbtn.sell:hover{background:rgba(var(--neg-rgb),.16);color:var(--neg)}
/* orders panel */
.od-badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--bg);font:600 11px/18px var(--font);text-align:center;box-shadow:0 0 0 2px var(--bg)}
.od-segs{display:flex;padding:3px;border-radius:10px;background:var(--field);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.10)}
.od-seg{flex:1;padding:9px 8px;border-radius:8px;border:0;background:transparent;color:var(--ink60);font:500 13.5px var(--font);cursor:pointer}
.od-seg.on{background:rgba(var(--accent-rgb),.16);color:var(--ink)}
.od-list{display:flex;flex-direction:column;gap:12px}
.od-group{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink55);margin-top:2px}
.od-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.od-scope{font-size:11px;color:var(--ink55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.od-value{flex:none;font-size:13px;color:var(--ink)}
.od-state{flex:none;color:var(--ink55)}
.od-state.neg{color:var(--neg)}
.od-leg-text{color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-card{padding:14px 16px 12px;border-radius:10px;background:var(--n900);box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.08);display:flex;flex-direction:column;gap:6px}
.od-row1{display:flex;align-items:center;justify-content:space-between;gap:12px}
.od-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.od-pill{flex:none;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:rgba(var(--ink-rgb),.10);color:var(--ink75)}
.od-pill.accent{background:rgba(var(--accent-rgb),.20);color:var(--accent-300)}
.od-pill.pos{background:rgba(var(--pos-rgb),.16);color:var(--pos)}
.od-pill.neg{background:rgba(var(--neg-rgb),.16);color:var(--neg)}
.od-row2{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--ink55)}
.od-line{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-when{flex:none;white-space:nowrap}
.od-fill{font-size:12.5px;color:var(--ink55)}
.od-leg{display:flex;align-items:center;gap:7px;padding:0;margin:0;font-size:12.5px}
.od-dot{flex:none;width:6px;height:6px;border-radius:50%;background:rgba(var(--ink-rgb),.28)}
.od-dot.on{background:var(--accent)}
.od-leg-label{flex:none;font-weight:500}
.od-leg-label.neg{color:var(--neg)}
.od-leg-label.pos{color:var(--pos)}

.od-foot-acts .od-link{border-radius:6px;padding:4px 11px;font-size:12px;color:var(--ink);background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--ink-rgb),.18)}
.od-foot-acts .od-link:hover{color:var(--ink);background:rgba(var(--ink-rgb),var(--hover))}
.od-foot-acts .od-link.neg{color:var(--neg);box-shadow:inset 0 0 0 1px rgba(var(--neg-rgb),.45)}
.od-foot-acts .od-link.neg:hover{color:var(--neg);background:rgba(var(--neg-rgb),.14);box-shadow:inset 0 0 0 1px rgba(var(--neg-rgb),.7)}

.od-foot-acts .od-link[disabled]:hover{color:var(--ink);background:transparent}
.od-edit{display:flex;flex-direction:column;gap:10px;padding:10px 0 2px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:60px 20px}
.spin{display:inline-block;width:10px;height:10px;border:2px solid rgba(var(--ink-rgb),.25);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
html{scrollbar-gutter:stable}
.scroll::-webkit-scrollbar,.scroll-xy::-webkit-scrollbar{width:9px;height:9px}
.scroll::-webkit-scrollbar-thumb,.scroll-xy::-webkit-scrollbar-thumb{background:transparent;border-radius:6px;border:2px solid transparent}
.scroll.scrolling::-webkit-scrollbar-thumb,.scroll-xy.scrolling::-webkit-scrollbar-thumb{background:rgba(var(--ink-rgb),.22);border-color:var(--surface)}
.scroll,.scroll-xy{scrollbar-color:transparent transparent;scrollbar-width:thin}
.scroll.scrolling,.scroll-xy.scrolling{scrollbar-color:rgba(var(--ink-rgb),.22) transparent}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Bagholder v2. Everything numeric comes from GET /api/model; this file only
// formats, sorts, selects and draws. Journal edits go to POST /api/journal.
// ---------------------------------------------------------------------------

const EMPTY_FILTERS = () => ({
  lists: { account: [], symbol: [], grade: [], tag: [], kind: [], exchange: [], side: [], result: [] },
  ranges: { price: { op: ">", v: null }, hold: { op: ">", v: null }, pnl: { op: ">", v: null }, qty: { op: ">", v: null } },
  preset: "all", years: [], from: "", to: "", search: "",
});

const state = {
  page: "dashboard",
  filters: EMPTY_FILTERS(),
  model: null,
  loading: false,
  loadError: "",
  sel: null,
  sort: {
    trades: { key: "exitDate", dir: "desc" },
    positions: { key: "unreal", dir: "desc" },
    bySymbol: { key: "pnl", dir: "desc" },
    execs: { key: "when", dir: "desc" },
    yoc: { key: "ttm", dir: "desc" },
    cash: { key: "date", dir: "desc" },
    orders: { key: "placed", dir: "desc" },
  },
  orders: null,
  ordersError: "",
  ordersOpen: false,
  ordersTab: "pending",
  orderEdit: null,
  bracketEdit: null,
  menuOpen: false,
  picker: null,
  valueQuery: "",
  tagDraft: "",
  tagHi: 0,
  valueHi: 0,
  fieldQuery: null,
  status: { connected: false, syncing: false, capturing: false, lastSync: "", error: "", syncStep: "", email: "", activityCount: 0 },
  loginView: false,
  ticket: null,
  busy: "",
  notice: "",
  confirmOpen: "",
  themeOpen: false,
  modal: null,
  importReport: null,
  watch: null,
  tradeForm: null,
  theme: "nocturne",
};
const THEMES = [["nocturne", "Nocturne", "#161826"], ["midnight", "Midnight", "#0b0d12"], ["light", "Light", "#eef0f5"]];
const PROTOCOL = "2026-09-10.9"; // must match bagholder.PROTOCOL
const TIMEFRAMES = [["1h", "1H"], ["4h", "4H"], ["1d", "1D"], ["1w", "1W"], ["1M", "1M"]];
// The default timeframe follows the trade's length so the whole trade fits the
// view; a timeframe the user picks is kept for that trade while the page is open.
const _tfByTrade = {};
function autoTf(t) {
  const days = Math.max(1, Math.round((Date.parse(t.exitDate) - Date.parse(t.entryDate)) / 86400000) + 1);
  return days <= 2 ? "1h" : days <= 10 ? "4h" : days <= 180 ? "1d" : days <= 1100 ? "1w" : "1M";
}
function chartTfFor(t, available) {
  const order = TIMEFRAMES.map((x) => x[0]);
  const want = _tfByTrade[t.id] || autoTf(t);
  if (!available) return want;
  if (available.indexOf(want) >= 0) return want;
  // not offered for this instrument: the nearest coarser one that is, else the finest
  const from = order.indexOf(want);
  const coarser = order.slice(from + 1).find((x) => available.indexOf(x) >= 0);
  return coarser || available[available.length - 1] || "";
}
function chartTf() { const t = state.sel ? selById(state.sel) : null; return t ? chartTfFor(t) : "1d"; }
function setChartTf(tf) { if (state.sel) _tfByTrade[state.sel] = tf; }
// The index the yearly returns are compared against: a preference, not a filter
const BENCHMARKS = [["SP500", "S&P 500"], ["TSX", "S&P/TSX"], ["TSX60", "TSX 60"]];
function benchmarkPref() { const v = state.benchmark || (function () { try { return localStorage.getItem("bh2.benchmark"); } catch (e) { return ""; } })(); return BENCHMARKS.some((x) => x[0] === v) ? v : "SP500"; }
function setBenchmark(key) { state.benchmark = key; try { localStorage.setItem("bh2.benchmark", key); } catch (e) {} loadModel(); }
function applyTheme(name) {
  state.theme = THEMES.some((t) => t[0] === name) ? name : "nocturne";
  if (state.theme === "nocturne") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", state.theme);
  try { localStorage.setItem("bh2.theme", state.theme); } catch (e) {}
}

const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const MON_LONG = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
function monthLong(key) { return MON_LONG[+key.slice(5, 7) - 1] + " " + key.slice(0, 4); }
const PRESETS = [["1d", "1D"], ["1w", "1W"], ["1m", "1M"], ["3m", "3M"], ["6m", "6M"], ["ytd", "YTD"], ["1y", "1Y"], ["5y", "5Y"]];

const FIELDS = [
  { key: "date", label: "Date", kind: "date" },
  { key: "account", label: "Account", kind: "list", opt: "accounts" },
  { key: "symbol", label: "Symbol", kind: "list", opt: "symbols", search: true },
  { key: "grade", label: "Grade", kind: "list", opt: "grades" },
  { key: "tag", label: "Tag", kind: "list", opt: "tags", search: true },
  { key: "side", label: "Side", kind: "list", opt: "sides" },
  { key: "kind", label: "Kind", kind: "list", opt: "kinds" },
  { key: "exchange", label: "Exchange", kind: "list", opt: "exchanges" },
  { key: "result", label: "Result", kind: "list", opt: "results" },
  { key: "price", label: "Price", kind: "range", unit: "$", steps: [1, 5, 20, 100], ph: "Entry price, e.g. 2.50" },
  { key: "hold", label: "Hold", kind: "range", unit: "d", steps: [7, 30, 90, 180], ph: "Days, e.g. 45" },
  { key: "pnl", label: "P&L", kind: "range", unit: "$", steps: [100, 500, 1000, 5000], ph: "Amount, e.g. 250" },
  { key: "qty", label: "Qty", kind: "range", unit: "", steps: [100, 1000, 10000, 100000], ph: "Units, e.g. 500" },
];

// ---------------------------------------------------------------------------
// utilities
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function attr(o) { return esc(JSON.stringify(o)); }
function n2(v, dp) { return Number(v).toLocaleString("en-US", { minimumFractionDigits: dp, maximumFractionDigits: dp }); }
function money(v, ccy, dp) {
  if (v == null || !isFinite(v)) return "—";
  dp = dp == null ? 2 : dp;
  const sign = v < 0 ? "−" : "";
  return sign + "$" + n2(Math.abs(v), dp);
}
function money0(v, ccy) { return money(v, ccy, 0); }
function signedMoney(v, ccy, dp) { if (v == null || !isFinite(v)) return "—"; return (v >= 0 ? "+" : "") + money(v, ccy, dp); }
function pct(v, dp) {
  if (v == null || !isFinite(v)) return "—";
  dp = dp == null ? 1 : dp;
  return (v < 0 ? "−" : "+") + Math.abs(v * 100).toFixed(dp) + "%";
}
function pctPlain(v, dp) { if (v == null || !isFinite(v)) return "—"; return (v * 100).toFixed(dp == null ? 1 : dp) + "%"; }
function qty(v) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const dp = a % 1 ? (a < 1 ? 6 : 2) : 0;
  return (v < 0 ? "−" : "") + n2(a, dp);
}
function px(v) {
  if (v == null || !isFinite(v)) return "—";
  const a = Math.abs(v);
  const dp = a === 0 ? 2 : a < 0.01 ? 5 : a < 1 ? 4 : 2;
  return n2(v, dp);
}
function hold(d) { return d == null ? "—" : Math.round(d).toLocaleString("en-US") + "d"; }
function stamp(iso) { return iso ? MON[+iso.slice(5, 7) - 1] + " '" + iso.slice(2, 4) : ""; }
function stampDay(iso) { return iso ? +iso.slice(8, 10) + " " + MON[+iso.slice(5, 7) - 1] + " '" + iso.slice(2, 4) : ""; }
function shortMoney(v) {
  const a = Math.abs(v);
  return (v < 0 ? "−$" : "$") + (a >= 1000 ? (a / 1000).toFixed(1) + "k" : Math.round(a));
}
function relTime(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (!isFinite(t)) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 1) return "just now";
  if (m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if (h < 48) return h + " h ago";
  return Math.round(h / 24) + " d ago";
}
function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }
function color(v) { return v >= 0 ? "var(--pos)" : "var(--neg)"; }
function cmp(a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  if (typeof a === "number" && typeof b === "number") return a - b;
  return String(a).localeCompare(String(b));
}
function sortRows(rows, key, dir, get) {
  const out = rows.slice();
  out.sort((a, b) => { const c = cmp(get(a, key), get(b, key)); return dir === "desc" ? -c : c; });
  return out;
}
function th(table, cols) {
  const s = state.sort[table];
  return cols.map((c) => {
    const on = s.key === c.key;
    const right = c.align === "right", center = c.align === "center";
    return '<th data-act="sort" data-arg=\'' + attr({ table, key: c.key }) + "' style=\"white-space:nowrap;text-align:" + (c.align || "left") +
      ";cursor:pointer;position:sticky;top:0;z-index:1;color:" + (on ? "var(--ink)" : "rgba(var(--ink-rgb),.6)") +
      (c.padLeft ? ";padding-left:" + c.padLeft : "") + (c.padRight ? ";padding-right:" + c.padRight : "") + (c.width ? ";width:" + c.width : "") + '">' +
      '<span class="th-in" style="flex-direction:' + (right ? "row-reverse" : "row") + '">' + esc(c.label) +
      '<span class="arrow" style="color:' + (on ? "var(--accent)" : "transparent") + (center ? ";position:absolute;left:100%;margin-left:4px" : "") + '">' + (on && s.dir === "asc" ? "▲" : "▼") + "</span></span></th>";
  }).join("");
}
function api(method, path, body) {
  const opts = { method, headers: { "X-Bagholder": "1" } };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  return fetch(path, opts).then((r) => r.json()).catch((e) => ({ ok: false, error: String(e) }));
}
function tradeById(id) { return (state.model && state.model.trades || []).find((t) => t.id === id) || null; }
function positionById(id) { return (state.model && state.model.positions || []).find((p) => p.id === id) || null; }
// A holding opens the page a trade opens, with the position standing in for the trade:
// no close date, the current price as the exit, the days so far as the hold.
function holdingAsTrade(p) {
  if (!p) return null;
  return Object.assign({}, p, { holding: true, pnl: p.unreal, pnlPct: p.unrealPct, entryDate: p.opened, exitDate: "", entry: p.avg, exit: p.last, holdDays: p.held, status: "open", legs: [] });
}
function selById(id) { return tradeById(id) || holdingAsTrade(positionById(id)); }
function filtersActive() {
  const f = state.filters;
  return Object.keys(f.lists).some((k) => f.lists[k].length) || Object.keys(f.ranges).some((k) => f.ranges[k].v != null && f.ranges[k].v !== "") ||
    f.preset !== "all" || f.years.length > 0 || !!f.from || !!f.to || !!f.search;
}

// ---------------------------------------------------------------------------
// data
// ---------------------------------------------------------------------------
let _loadSeq = 0;
function loadModel() {
  const seq = ++_loadSeq;
  state.loading = true;
  if (!state.model) render();
  const q = encodeURIComponent(JSON.stringify(Object.assign({}, state.filters, { benchmark: benchmarkPref() })));
  return fetch("/api/model?filters=" + q, { headers: { "X-Bagholder": "1" } })
    .then((r) => r.json())
    .then((m) => {
      if (seq !== _loadSeq) return;
      state.loading = false;
      if (!m || !m.ok) { state.loadError = (m && m.error) || "Could not load the model."; render(); return; }
      state.loadError = "";
      state.model = m;
      if (m.status) applyStatus(m.status);
      if (state.sel && !selById(state.sel)) { state.sel = null; if (state.page === "trades" || state.page === "portfolio") history.replaceState(null, "", "#" + state.page); }
      render();
    })
    .catch((e) => { if (seq !== _loadSeq) return; state.loading = false; state.loadError = String(e); render(); });
}
function setFilters(patch) {
  Object.assign(state.filters, patch);
  if (state.sel) { state.sel = null; if (state.page === "trades") history.replaceState(null, "", "#trades"); }
  loadModel();
}
function applyStatus(st) {
  if (!st) return;
  // a new version is serving: this page belongs to the old one
  if (st.version && state.status.version && st.version !== state.status.version) { location.reload(); return; }
  // A restarted server may answer differently (new sources, new timeframes):
  // forget what earlier answers said and let the open trade fetch again.
  if (st.startedAt && state.status.startedAt && st.startedAt !== state.status.startedAt) {
    Object.keys(_histCache).forEach((k) => delete _histCache[k]);
    const el = document.activeElement;
    if (document.getElementById("tradeChart") && !(el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT"))) render();
  }
  const prev = state.status.lastSync;
  const prevCount = state.status.activityCount;
  const prevVersion = state.status.dataVersion;
  state.status = Object.assign({}, state.status, st);
  const changed = (st.lastSync && st.lastSync !== prev && prev !== undefined) || (st.activityCount !== prevCount && prevCount) ||
    (st.dataVersion && prevVersion && st.dataVersion !== prevVersion);
  if (changed && !state.status.syncing) {
    // Quotes, distributions, FX and new activity all change the version. Reload
    // now, unless a trade is open or a note is being typed: then on the next page change.
    const el = document.activeElement;
    const typing = !!(el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT"));
    if (typing || state.sel) state.derivedStale = true; else loadModel();
  }
}
let _pollTimer = 0;
function pollStatus() {
  clearTimeout(_pollTimer);
  api("GET", "/api/status").then((st) => {
    // while the server restarts (an update) answers are not status payloads: keep asking
    if (!st || !st.protocol) { _pollTimer = setTimeout(pollStatus, 1000); return; }
    const before = JSON.stringify([state.status.lastSync, state.status.syncing, state.status.connected, state.status.syncStep, state.status.error, state.status.capturing, state.status.protocol, state.status.updateAvailable, state.status.version, state.status.openOrders]);
    applyStatus(st);
    const after = JSON.stringify([state.status.lastSync, state.status.syncing, state.status.connected, state.status.syncStep, state.status.error, state.status.capturing, state.status.protocol, state.status.updateAvailable, state.status.version, state.status.openOrders]);
    if (before !== after) renderHeaderOnly();
    const fast = state.status.syncing || state.status.capturing || state.busy || state.status.updating;
    _pollTimer = setTimeout(pollStatus, fast ? 2500 : 30000);
  });
}

// ---------------------------------------------------------------------------
// journal
// ---------------------------------------------------------------------------
const _saveTimers = {};
function saveJournal(id, patch, soon) {
  const t = tradeById(id) || positionById(id);
  if (!t) return;
  Object.assign(t, patch);
  const body = { id, thesis: t.thesis || "", tags: t.tags || [], grade: t.grade || "" };
  clearTimeout(_saveTimers[id]);
  const post = () => api("POST", "/api/journal", body).then((r) => {
    if (!r || !r.ok) { state.notice = "Could not save journal entry."; state.noticeKind = "err"; renderHeaderOnly(); return; }
  });
  // the trade on screen is already updated locally; the dashboard's grade
  // buckets and review queue are refreshed the next time a page is opened
  if (patch.tags) { const opts = state.model.options; patch.tags.forEach((x) => { if (opts.tags.indexOf(x) < 0) { opts.tags.push(x); opts.tags.sort(); } }); }
  state.derivedStale = true;
  if (soon) _saveTimers[id] = setTimeout(post, 500);
  else post();
}

// ---------------------------------------------------------------------------
// header, tabs, chips
// ---------------------------------------------------------------------------
// The "No activity yet" page shows a sync error in full beneath its button, so
// the header does not repeat it there.
function showingEmpty() { return !!(state.model && !state.model.activityCount && !state.loadError); }
function syncLine() {
  const s = state.status;
  if (s.updating) return '<span class="spin"></span>' + esc(s.updating);
  if (s.updateError) return '<span class="status-err">' + esc(s.updateError) + "</span>";
  if (s.protocol && s.protocol !== PROTOCOL) return '<span class="status-err">Restart Bagholder to finish the update</span>';
  if (state.busy === "connecting") return '<span class="spin"></span>Waiting for Wealthsimple login… <button class="pill" data-act="cancelConnect" style="padding:1px 8px;font-size:11px;width:auto;margin-left:6px">Cancel</button>';
  if (state.busy === "refresh") return '<span class="spin"></span>Refreshing session…';
  if (s.syncing) return '<span class="spin"></span>' + esc(s.syncStep || "Syncing…");
  if (s.error && !showingEmpty()) return '<span class="status-err" title="' + esc(s.error) + '">' + esc(s.error.length > 60 ? s.error.slice(0, 57) + "…" : s.error) + "</span>";
  // nothing heard from the server yet (a page loaded while Bagholder starts): claim no state
  if (!s.protocol) return '<span class="spin"></span>';
  if (!s.connected) return "Not connected";
  return "Synced " + esc(relTime(s.lastSync) || "—");
}
function headerHtml() {
  const m = state.model;
  return '<div id="hdr" style="display:flex;align-items:center;gap:22px;padding:12px 20px;background:var(--bg);box-shadow:inset 0 -1px 0 rgba(var(--ink-rgb),.08)">' +
    '<div style="display:flex;align-items:center;gap:9px;margin-right:8px"><img src="favicon.png" alt="" style="width:24px;height:24px;border-radius:6px"><span style="font-size:15px;font-weight:600;letter-spacing:var(--brand-spacing);color:var(--brand-color);text-transform:var(--brand-transform)">Bagholder</span>' + (state.status.version ? '<span class="muted" style="font-size:11px;margin-left:8px">v' + esc(state.status.version) + "</span>" : "") + (state.status.updateAvailable && !state.status.updating ? (state.status.canUpdate
      ? '<button class="pill" data-act="update" style="font-size:11px;margin-left:8px;padding:1px 8px;width:auto;color:var(--accent-300)">Update to ' + esc(state.status.latestVersion) + "</button>"
      : '<a href="' + esc(state.status.updateUrl || "#") + '" target="_blank" rel="noopener" style="font-size:11px;margin-left:8px;color:var(--accent-300);text-decoration:none">' +
        (state.status.updateBy === "image" ? esc(state.status.latestVersion) + " image available" : "Update available") + "</a>") : "") + "</div>" +
    '<div style="margin-left:auto;display:flex;align-items:center;gap:12px">' +
    '<span style="font-size:12px;color:var(--ink55)">' + (state.notice ? '<span class="' + (state.noticeKind === "err" ? "status-err" : "") + '">' + esc(state.notice) + "</span>" : syncLine()) + "</span>" +
    '<button class="btn btn-icon btn-secondary" aria-label="Orders" data-act="ordersOpen" style="position:relative"><svg width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="' + ICONS.receipt + '"/></svg>' +
    (state.status.openOrders ? '<span class="od-badge">' + state.status.openOrders + "</span>" : "") + "</button>" +

function bracketEditSave(id) {
  const e = state.bracketEdit; const b = (state.orders && state.orders.brackets || []).find((x) => x.id === id); if (!b || !e) return;
  const sl = document.getElementById("od-sl"), tp = document.getElementById("od-tp");
  const calls = [];
  if (sl) {
    const v = tkNum(sl.value);
    if (!(v > 0)) { e.error = b.slKind === "trail" ? "A trail is required." : "A stop price is required."; renderOrders(); return; }
    const cur = b.slKind === "trail" ? b.slTrail : b.slPrice;
    if (v !== cur) calls.push(b.slKind === "trail" ? { id, leg: "sl", trail: v } : { id, leg: "sl", price: v });
  }
  if (tp) {
    const v = tkNum(tp.value);
    if (!(v > 0)) { e.error = "A limit price is required."; renderOrders(); return; }
    if (v !== b.tpPrice) calls.push({ id, leg: "tp", price: v });
  }
  if (!calls.length) { state.bracketEdit = null; renderOrders(); return; }
  state.busy = "orders"; e.error = ""; renderOrders();
  const run = (i) => {
    if (i >= calls.length) {
      state.busy = ""; state.bracketEdit = null;
      state.notice = "Bracket changed · " + b.symbol; state.noticeKind = "ok";
      setTimeout(() => { state.notice = ""; renderHeaderOnly(); }, 10000);
      renderHeaderOnly(); loadOrders(); return;
    }
    api("POST", "/api/bracket/adjust", calls[i]).then((r) => {
      if (!r || !r.ok) { state.busy = ""; if (state.bracketEdit) state.bracketEdit.error = (r && r.error) || "Could not change the bracket."; renderOrders(); loadOrders(); return; }
      run(i + 1);

  };

}
function bracketRemove(id, leg) {

function niceMax(peak) {
  if (!(peak > 0)) return 1;
  const step = Math.pow(10, Math.max(0, String(Math.round(peak / 3)).length - 2));
  return Math.max(step * 3, Math.ceil(peak / (step * 3)) * step * 3);
}
function eqGeom(series) {
  const vals = series.map((p) => p.v);
  const peak = Math.max.apply(null, vals.concat([0]));
  const max = niceMax(peak);
  const W = 880, H = 260, pad = 8, top = 6;
  const n = Math.max(1, vals.length - 1);
  const pts = vals.map((v, i) => [(i / n) * W, H - pad - (v / max) * (H - pad - top)]);
  const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return { max, path, area: path + " L880 252 L0 252 Z", pts };
}
