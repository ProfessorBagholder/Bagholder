function svgEquity(points) {
  const w = 640, h = 220, padL = 52, padR = 12, padT = 16, padB = 28;
  if (!points.length) {
    return '<svg viewBox="0 0 640 220" class="chart"><text x="320" y="110" text-anchor="middle" fill="#6b7380" font-size="12">No equity yet</text></svg>';
  }
  const ys = points.map((p) => p.equity);
  let minY = Math.min(0, ...ys);
  let maxY = Math.max(0, ...ys);
  if (minY === maxY) { minY -= 1; maxY += 1; }
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  function x(i) { return padL + (points.length === 1 ? innerW / 2 : (i / (points.length - 1)) * innerW); }
  function y(v) { return padT + ((maxY - v) / (maxY - minY)) * innerH; }
  const d = points.map((p, i) => (i === 0 ? "M" : "L") + x(i).toFixed(1) + " " + y(p.equity).toFixed(1)).join(" ");
  const zero = y(0);
  const last = points[points.length - 1];
  const cls = last.equity >= points[0].equity ? "pos" : "neg";
  const grid = [];
  for (let g = 0; g < 4; g++) {
    const gy = padT + (innerH * g) / 3;
    const gv = maxY - ((maxY - minY) * g) / 3;
    grid.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="#262c36"/>');
    grid.push('<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" text-anchor="end" fill="#6b7380" font-size="10">' + formatAxisCad(gv, 0) + "</text>");
  }
  const hits = points.map((p, i) => {
    const x0 = i === 0 ? padL : (x(i - 1) + x(i)) / 2;
    const x1 = i === points.length - 1 ? w - padR : (x(i) + x(i + 1)) / 2;
    const tip = esc(formatChartDate(p.date) + "  " + formatCad(p.equity, 2));
    return '<rect class="equity-hit" data-pnl-tip="' + tip + '" x="' + x0.toFixed(1) + '" y="' + padT + '" width="' + Math.max(1, x1 - x0).toFixed(1) + '" height="' + innerH.toFixed(1) + '" fill="#fff" fill-opacity="0" pointer-events="all"/>';
  }).join("");
  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart" preserveAspectRatio="none">' +
    grid.join("") +
    '<line x1="' + padL + '" y1="' + zero + '" x2="' + (w - padR) + '" y2="' + zero + '" stroke="#343b47" stroke-dasharray="3 3"/>' +
    '<path d="' + d + '" fill="none" stroke="' + (cls === "pos" ? "#3ecf8e" : "#ef6b73") + '" stroke-width="2" pointer-events="none"/>' +
    '<text class="chart-axis-lbl" x="' + padL + '" y="' + (h - 8) + '" fill="#6b7380" font-size="10">' + esc(formatChartDate(points[0].date)) + "</text>" +
    '<text class="chart-axis-lbl" x="' + (w - padR) + '" y="' + (h - 8) + '" text-anchor="end" fill="#6b7380" font-size="10">' + esc(formatChartDate(last.date)) + "</text>" +
    hits +
    "</svg>"
  );
}

function monthTick(ym) {
  const parts = String(ym || "").split("-");
  const y = parts[0] || "";
  const m = Number(parts[1] || 0);
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mon = names[m - 1] || (parts[1] || "");
  return mon + " '" + y.slice(2);
}

function formatChartDate(iso) {
  const parts = String(iso || "").split("-");
  if (parts.length < 3) return parts.length === 2 ? monthTick(iso) : String(iso || "");
  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mon = names[Number(parts[1]) - 1] || parts[1];
  return Number(parts[2]) + " " + mon + " '" + String(parts[0]).slice(2);
}

function svgMonthly(rows) {
  const w = 640, h = 220, padL = 52, padR = 16, padT = 16, padB = 44;
  if (!rows.length) {
    return '<svg viewBox="0 0 640 220" class="chart"><text x="320" y="110" text-anchor="middle" fill="#6b7380" font-size="12">No monthly P&amp;L</text></svg>';
  }
  const ys = rows.map((r) => r.pnl);
  let minY = Math.min(0, ...ys);
  let maxY = Math.max(0, ...ys);
  if (minY === maxY) { minY -= 1; maxY += 1; }
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;
  function y(v) { return padT + ((maxY - v) / (maxY - minY)) * innerH; }
  const zero = y(0);
  const n = rows.length;
  const slot = innerW / n;
  const gap = Math.min(4, Math.max(1, slot * 0.18));
  const bw = Math.max(2, slot - gap);
  const maxLabels = 8;
  const step = Math.max(1, Math.ceil(n / maxLabels));
  const labeled = new Set();
  for (let i = 0; i < n; i++) {
    const isJan = String(rows[i].month).slice(5, 7) === "01";
    if (i === 0 || i === n - 1 || isJan || i % step === 0) labeled.add(i);
  }
  // Drop a label if it sits too close to a neighbor (in slot units).
  const idxs = Array.from(labeled).sort((a, b) => a - b);
  const keep = [];
  for (let k = 0; k < idxs.length; k++) {
    const i = idxs[k];
    if (keep.length && i - keep[keep.length - 1] < step && i !== n - 1 && String(rows[i].month).slice(5, 7) !== "01") continue;
    if (i === n - 1 && keep.length && n - 1 - keep[keep.length - 1] < Math.max(1, Math.floor(step / 2))) keep.pop();
    keep.push(i);
  }
  const keepSet = new Set(keep);
  const grid = [];
  for (let g = 0; g < 4; g++) {
    const gy = padT + (innerH * g) / 3;
    const gv = maxY - ((maxY - minY) * g) / 3;
    grid.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (w - padR) + '" y2="' + gy + '" stroke="#262c36"/>');
    grid.push('<text x="' + (padL - 6) + '" y="' + (gy + 3) + '" text-anchor="end" fill="#6b7380" font-size="10">' + formatAxisCad(gv, 0) + "</text>");
  }
  const hits = [];
  const bars = rows.map((r, i) => {
    const x = padL + i * slot + gap / 2;
    const y1 = y(r.pnl);
    const top = Math.min(y1, zero);
    const height = Math.max(2, Math.abs(y1 - zero));
    const color = r.pnl >= 0 ? "#3ecf8e" : "#ef6b73";
    const tip = esc(monthTick(r.month) + "  " + formatAxisCad(r.pnl, 2));
    hits.push(
      '<rect class="month-hit" data-pnl-tip="' + tip + '" x="' + (padL + i * slot).toFixed(1) + '" y="' + padT + '" width="' + slot.toFixed(1) + '" height="' + innerH.toFixed(1) + '" fill="#fff" fill-opacity="0" pointer-events="all"/>'
    );
    let label = "";
    if (keepSet.has(i)) {
      label = '<text class="month-lbl" x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 12) + '" text-anchor="middle" fill="#8b93a0" font-size="10">' + esc(monthTick(r.month)) + "</text>";
    }
    return (
      '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + height.toFixed(1) + '" fill="' + color + '" rx="1"/>' +
      label
    );
  }).join("");
  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" class="chart">' +
    grid.join("") +
    '<line x1="' + padL + '" y1="' + zero + '" x2="' + (w - padR) + '" y2="' + zero + '" stroke="#343b47"/>' +
    bars +
    hits.join("") +
    "</svg>"
  );
}

function breakdownTable(rows, title) {

  const sorted = sortRows(rows, (r) => {

    return map[sort.key];
  }, sort.dir);
  const body = sorted.map((r) => {
    return (
      "<tr><td class='name'>" + esc(r.label) + "</td><td class='" + pnlClass(r.pnlCad) + "'>" +
      esc(formatMoney(r.pnlCad)) + "</td><td>" + r.trades + "</td><td>" + formatPct(r.winRate) +
      "</td></tr>"
    );
  }).join("");
  return (
    '<div class="panel tight"><h3 class="section-title">' + esc(title) + "</h3>" +
    '<div class="b-scroll"><table class="b-table"><thead><tr>' +
    sortTh("symbol", [
      { key: "key", label: "Symbol" },
      { key: "pnlCad", label: "P&L" },
      { key: "trades", label: "# of trades" },
      { key: "winRate", label: "Win rate" },
    ]) +
    "</tr></thead><tbody>" +
    (body || "<tr><td class='name' colspan='4'>None yet</td></tr>") +
    "</tbody></table></div></div>"
  );
}

function render() {
  const root = document.getElementById("app");
  const { closed, open, unmatched } = matchFifo(state.activities);
  const unmatchedWarn = formatUnmatchedWarning(unmatched);
  const closedFx = applyFx(closed);
  const visible = filteredTrades(closedFx);
  const incomeActs = state.activities.filter((a) => {
    const f = state.filters;
    if (f.from && a.transactionDate < f.from) return false;
    if (f.to && a.transactionDate > f.to) return false;
    if (f.account && a.accountId !== f.account && a.accountType !== f.account) return false;
    if (f.symbol && a.symbol && underlyingSymbol(a.symbol) !== f.symbol) return false;
    return true;
  });
  const incomeCad = incomeActs
    .filter((a) => a.category === "dividend" || a.category === "interest")
    .reduce((s, a) => s + toCad(a.netCashAmount, a.currency, a.transactionDate), 0);
  const feesCad = incomeActs
    .filter((a) => a.category === "fee")
    .reduce((s, a) => s + toCad(a.netCashAmount, a.currency, a.transactionDate), 0);
  const m = computeMetrics(visible, open.length, incomeCad, feesCad);
  const curve = equityCurve(state.activities, state.filters.from, state.filters.to);
  const monthly = monthlyPnl(visible);
  const bySymbol = breakdown(visible, (t) => underlyingSymbol(t.symbol));
  const symbols = unique(state.activities.map((a) => underlyingSymbol(a.symbol)).filter((x) => x && x !== "—"));
  const years = yearsFromActivities(state.activities);
  const selectedYear = yearFromRange(state.filters.from, state.filters.to);
  const pf = m.profitFactor === Infinity ? "∞" : Number.isFinite(m.profitFactor) ? m.profitFactor.toFixed(2) : "—";

  const reportsHtml = state.reports.map((r) => {
    const counts = Object.keys(r.countsByType)
      .sort((a, b) => r.countsByType[b] - r.countsByType[a])
      .map((k) => "<li>" + esc(k) + ": " + r.countsByType[k] + "</li>")
      .join("");
    const skipped = r.skipped && r.skipped.length
      ? '<div class="meta" style="margin-top:8px;color:var(--neg)">' + r.skipped.length + " skipped / unparsed<ul>" +
        r.skipped.slice(0, 8).map((s) => "<li>row " + s.row + ": " + esc(s.message) + "</li>").join("") +
        "</ul></div>"
      : "";
    return (
      "<div><h3>Import · " + esc(r.file) + "</h3><div class='meta'>format " +
      esc(r.format) + " · " + r.rowCount + " data rows · " + r.added + " new · " + r.duplicates + " duplicates" +
      (r.footerStripped ? " · footer stripped" : "") + "</div><ul>" + counts + "</ul>" + skipped + "</div>"
    );
  }).join("");

  let main;
  if (!state.activities.length) {
    main = emptyStateHtml();
  } else {
    const closedSorted = closedTradesForBlotter();
    const blotterRows = closedBlotterBodyHtml(closedSorted);

    const actSort = state.sort.activity || { key: "transactionDate", dir: "desc" };
    const actSorted = sortRows(incomeActs, (a) => ({
      transactionDate: a.transactionDate,
      settlementDate: a.settlementDate,
      activityType: a.activityType,
      activitySubType: a.activitySubType,
      symbol: a.symbol,
      name: a.name,
      quantity: a.quantity,
      unitPrice: a.unitPrice,
      netCashAmount: a.netCashAmount,
      currency: a.currency,
      category: a.category,
    }[actSort.key]), actSort.dir);
    const actRows = actSorted.map((a) => {
        return (
          "<tr>" +
          "<td>" + esc(a.transactionDate) + "</td>" +
          "<td>" + esc(a.settlementDate) + "</td>" +
          "<td>" + esc(a.activityType) + "</td>" +
          "<td>" + esc(a.activitySubType) + "</td>" +
          "<td>" + esc(a.symbol) + "</td>" +
          "<td class='sans'>" + esc(a.name) + "</td>" +
          "<td>" + (a.quantity ? formatNumber(a.quantity, a.quantity % 1 ? 4 : 0) : "") + "</td>" +
          "<td>" + (a.unitPrice ? formatNumber(a.unitPrice) : "") + "</td>" +
          "<td class='" + pnlClass(a.netCashAmount) + "'>" + esc(formatMoney(a.netCashAmount, a.currency)) + "</td>" +
          "<td>" + esc(a.currency) + "</td>" +
          "<td class='sans' title='" + esc(a.description) + "'>" + esc(a.category) + "</td></tr>"
        );
      }).join("");

    const openSort = state.sort.open || { key: "date", dir: "desc" };
    const openSorted = sortRows(open, (l) => ({
      date: l.date,
      symbol: l.symbol,
      direction: l.direction,
      quantity: l.quantity,
      price: l.price,
      currency: l.currency,
      name: l.name,
    }[openSort.key]), openSort.dir);
    const openRows = openSorted.map((l) => {
      return (
        "<tr><td>" + esc(l.date) + "</td><td>" + esc(l.symbol) + "</td><td>" + esc(l.direction) + "</td>" +
        "<td>" + formatNumber(l.quantity, l.quantity % 1 ? 4 : 0) + "</td>" +
        "<td>" + formatNumber(l.price) + "</td><td>" + esc(l.currency) + "</td>" +

    const tabClosed =

      '<input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="Symbol" value="' + esc(state.filters.q) + '"/>' +
      '<div class="symbol-pick-list" id="symbolPickList" hidden></div></div></div>' +
      '<div class="table-wrap"><table class="blotter" id="closedBlotter"><thead><tr>' +
      sortTh("closed", [
        { key: "entryDate", label: "In" },
        { key: "exitDate", label: "Out" },
        { key: "symbol", label: "Symbol" },
        { key: "side", label: "Side" },
        { key: "quantity", label: "Qty" },
        { key: "entryPrice", label: "Entry" },
        { key: "exitPrice", label: "Exit" },

    const tabAct =

      '<div class="table-wrap"><table class="blotter"><thead><tr>' +
      sortTh("activity", [
        { key: "transactionDate", label: "Date" },
        { key: "settlementDate", label: "Settle" },
        { key: "activityType", label: "Type" },
        { key: "activitySubType", label: "Sub" },
        { key: "symbol", label: "Symbol" },
        { key: "name", label: "Name" },
        { key: "quantity", label: "Qty" },
        { key: "unitPrice", label: "Price" },
        { key: "netCashAmount", label: "Amount" },
        { key: "currency", label: "Ccy" },
        { key: "category", label: "Cat" },
      ]) +
      "</tr></thead><tbody>" +
      (actRows || "<tr><td colspan='11' class='sans'>No rows.</td></tr>") +
      "</tbody></table></div>";

    const tabOpen =
      '<div class="blotter-head"><h3 class="section-title" style="margin:0">Open lots <em>' + open.length + "</em></h3></div>" +
      '<div class="table-wrap"><table class="blotter"><thead><tr>' +
      sortTh("open", [
        { key: "date", label: "Opened" },
        { key: "symbol", label: "Symbol" },
        { key: "direction", label: "Dir" },
        { key: "quantity", label: "Qty" },
        { key: "price", label: "Price" },
        { key: "currency", label: "Ccy" },
        { key: "name", label: "Name" },
      ]) +
      "</tr></thead><tbody>" +
      (openRows || "<tr><td colspan='7' class='sans'>No open lots.</td></tr>") +
      "</tbody></table></div>";

    const tabBody = state.tab === "activity" ? tabAct : state.tab === "open" ? tabOpen : tabClosed;

    main =
      (reportsHtml

        : "") +
      (unmatchedWarn ? '<div class="warn fifo-warn">' + esc(unmatchedWarn) + "</div>" : "") +
      '<div class="kpis">' +
      kpiCard("Realized P&L (CAD)", esc(formatCad(m.realizedPnlCad, 2)), m.tradeCount.toLocaleString("en-CA") + (m.tradeCount === 1 ? " trade" : " trades"), pnlClass(m.realizedPnlCad)) +
      kpiCard("Win rate", formatPct(m.winRate), m.winCount.toLocaleString("en-CA") + " W, " + m.lossCount.toLocaleString("en-CA") + " L, " + m.evenCount.toLocaleString("en-CA") + " BE", "") +
      kpiCard("Profit factor", pf, esc(formatCad(m.grossProfit, 2) + " W, " + formatCad(m.grossLoss, 2) + " L"), "") +
      kpiCard("Expectancy", esc(formatCad(m.expectancy, 2)), "avg W " + formatCad(m.avgWin, 2) + " · avg L " + formatCad(m.avgLoss, 2), pnlClass(m.expectancy)) +
      kpiCard("Biggest winner", esc(formatCad(m.maxWinPnl, 2)), m.maxWinSymbol ? esc(m.maxWinSymbol) : "—", pnlClass(m.maxWinPnl)) +

      "</div>" +
      '<div class="grid-2">' +
      renderCompare(closedFx, selectedYear, years, state.activities) +

      '<div class="grid-2">' +
      '<div class="panel"><h3 class="section-title">Equity <em>account value CAD</em></h3><div class="chart-wrap" id="equityChart">' + svgEquity(curve) + '<div class="chart-tip" id="equityTip" hidden></div></div></div>' +

      '<div class="breakdowns">' + breakdownTable(bySymbol, "By symbol") + "</div>" +
      '<div class="tabs">' +
      '<button type="button" class="tab' + (state.tab === "closed" ? " on" : "") + '" data-tab="closed">Closed trades</button>' +

function isCsvName(name) {
  return /\.csv$/i.test(name || "");
}

function isJunkCsvPath(name, rel) {
  const n = String(name || "");
  const r = String(rel || "").replace(/\\/g, "/");
  if (n.startsWith("._")) return true;
  if (/__MACOSX/i.test(n) || /__MACOSX/i.test(r)) return true;
  return false;
}

function isTopLevelCsvFile(file) {
  if (!file || !isCsvName(file.name)) return false;
  if (file.size === 0) return false;
  const rel = String(file.webkitRelativePath || "").replace(/\\/g, "/");
  if (isJunkCsvPath(file.name, rel)) return false;
  if (!rel) return true;
  return rel.split("/").filter(Boolean).length <= 2;
}

function ingestFileList(fileList) {
  const files = Array.from(fileList || []).filter(isTopLevelCsvFile);
  if (!files.length) return Promise.resolve();
  const jobs = files.map((f) => f.text().then((text) => ({ name: f.name, text })));
  return Promise.all(jobs).then((items) => {
    let current = state.activities;
    const reports = [];
    for (const item of items) {
      if (!item.text || !String(item.text).trim()) continue;
      const parsed = parseCsv(item.text, item.name);
      const { merged, added, duplicates } = mergeActivities(current, parsed.activities);
      current = merged;
      reports.push({
        file: item.name,
        format: parsed.format,
        rowCount: parsed.rowCount,
        added,
        duplicates,
        footerStripped: parsed.footerStripped,
        countsByType: parsed.countsByType,
        skipped: parsed.skipped,
      });
    }
    state.activities = ensureBookIds(current);
    state.reports = reports;
    persist();
    render();
    ensureFxRates();
    ensureSpyPrices();
  });
}

function fileFromEntry(entry) {
  return new Promise((resolve, reject) => entry.file(resolve, reject));
}

function readAllEntries(reader) {
  return new Promise((resolve, reject) => {
    const acc = [];
    function next() {
      reader.readEntries((batch) => {
        if (!batch.length) resolve(acc);
        else { acc.push.apply(acc, batch); next(); }
      }, reject);
    }
    next();
  });
}

async function collectCsvFromEntry(entry, out) {
  if (!entry) return;
  if (entry.isFile) {
    const file = await fileFromEntry(entry);
    if (isTopLevelCsvFile(file)) out.push(file);
  } else if (entry.isDirectory) {
    if (/__MACOSX/i.test(entry.name || "")) return;
    const children = await readAllEntries(entry.createReader());
    for (let i = 0; i < children.length; i++) {
      const child = children[i];
      if (child && child.isFile) {
        const file = await fileFromEntry(child);
        if (isTopLevelCsvFile(file)) out.push(file);
      }
    }
  }
}

async function filesFromDataTransfer(dt) {
  const items = dt && dt.items;
  if (items && items.length) {
    const entries = [];
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      if (item.kind === "file" && typeof item.webkitGetAsEntry === "function") {
        const entry = item.webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
    }
    if (entries.length) {
      const out = [];
      for (let i = 0; i < entries.length; i++) await collectCsvFromEntry(entries[i], out);
      return out;
    }
  }
  return Array.from((dt && dt.files) || []).filter(isTopLevelCsvFile);
}

const WATCH_MS = 5000;
let watchTimer = null;
let watchHandle = null;
let watchPrints = new Map();

function setWatchStatus(text) {
  state.watchStatus = text || "";
  const el = document.getElementById("watchStatus");
  if (el) el.textContent = state.watchStatus;
}

function stopWatch() {
  if (watchTimer) {
    clearInterval(watchTimer);
    watchTimer = null;
  }
  watchHandle = null;
  watchPrints = new Map();
  setWatchStatus("");
}

function openWatchDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("ledger-watch-folder", 1);
    req.onupgradeneeded = function () {
      if (!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv");
    };
    req.onsuccess = function () { resolve(req.result); };
    req.onerror = function () { reject(req.error); };
  });
}

async function saveDirHandle(handle) {
  try {
    const db = await openWatchDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(handle, "dir");
      tx.oncomplete = function () { resolve(); };
      tx.onerror = function () { reject(tx.error); };
    });
  } catch (e) {}
}

async function loadDirHandle() {
  try {
    const db = await openWatchDb();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction("kv", "readonly");
      const req = tx.objectStore("kv").get("dir");
      req.onsuccess = function () { resolve(req.result || null); };
      req.onerror = function () { reject(req.error); };
    });
  } catch (e) {
    return null;
  }
}

async function ensureReadPermission(handle) {
  const opts = { mode: "read" };
  if (handle.queryPermission) {
    const q = await handle.queryPermission(opts);
    if (q === "granted") return true;
  }
  if (handle.requestPermission) {
    const r = await handle.requestPermission(opts);
    return r === "granted";
  }
  return true;
}

async function csvFilesFromDirHandle(dirHandle) {
  const out = [];
  for await (const entry of dirHandle.values()) {
    if (entry.kind === "file" && isCsvName(entry.name) && !isJunkCsvPath(entry.name, entry.name)) {
      const file = await entry.getFile();
      if (file.size > 0) out.push({ file: file, path: entry.name });
    }
  }
  return out;
}

async function scanWatchedDir() {
  if (!watchHandle) return;
  try {
    const items = await csvFilesFromDirHandle(watchHandle);
    const fresh = [];
    const nextPrints = new Map();
    for (let i = 0; i < items.length; i++) {
      const item = items[i];
      const fp = item.path + "|" + item.file.size + "|" + item.file.lastModified;
      nextPrints.set(item.path, fp);
      if (watchPrints.get(item.path) !== fp) fresh.push(item.file);
    }
    watchPrints = nextPrints;
    const now = new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit", second: "2-digit" });
    setWatchStatus("Watching /" + watchHandle.name + " · last scan " + now);
    if (fresh.length) await ingestFileList(fresh);
  } catch (e) {
    setWatchStatus("Watch error — use Load folder in the menu to retry");
  }
}

function startWatch(handle) {
  if (watchTimer) {
    clearInterval(watchTimer);
    watchTimer = null;
  }
  watchHandle = handle;
  watchPrints = new Map();
  scanWatchedDir();
  watchTimer = setInterval(scanWatchedDir, WATCH_MS);
}

async function resumeWatch() {
  const handle = await loadDirHandle();
  if (!handle) return;
  try {
    const ok = await ensureReadPermission(handle);
    if (ok) startWatch(handle);
    else setWatchStatus("Folder watch paused — use Load folder in the menu to resume");
  } catch (e) {
    setWatchStatus("Folder watch paused — use Load folder in the menu to resume");
  }
}

function relSync(iso) {
  if (!iso) return "";
  const t = Date.parse(iso);
  if (!Number.isFinite(t)) return "";
  const sec = Math.round((Date.now() - t) / 1000);
  if (sec < 45) return "Synced just now";
  if (sec < 120) return "Synced 1 min ago";
  if (sec < 3600) return "Synced " + Math.round(sec / 60) + " min ago";
  return "Synced " + Math.round(sec / 3600) + "h ago";
}

function wsStatusText() {
  if (!HAS_LOCAL_API && !state.ws.available) return "";
  if (state.ws.syncing) return state.ws.syncStep || "Importing activity…";
  if (state.ws.capturing || (state.connectOpen && !state.ws.connected)) return "Waiting for Wealthsimple login…";
  if (state.ws.error) return state.ws.error;
  if (state.ws.connected && state.ws.lastSync) {
    const rel = relSync(state.ws.lastSync);
    if (rel) return rel;
  }
  if (state.ws.connected) return "Connected";
  return "";
}

function api(method, path, body) {
  const headers = { "X-Bagholder": "1" };
  if (body) headers["Content-Type"] = "application/json";
  return fetch(path, {
    method: method,
    headers: headers,
    body: body ? JSON.stringify(body) : undefined,
  }).then((r) => r.json().catch(() => ({ ok: false }))).catch(() => ({ ok: false, error: "offline" }));
}

function replaceWsActivities(book) {
  const acts = (book && book.activities) ? book.activities : [];
  state.activities = ensureBookIds(acts);
  if (book && book.accounts) state.ws.accounts = book.accounts;
  state.navHistory = (book && book.navHistory) ? book.navHistory.slice().sort(function (a, b) { return String(a.date).localeCompare(String(b.date)); }) : [];
  if (book && book.syncedAt) state.ws.lastSync = book.syncedAt;
  window.__wsBookAt = state.ws.lastSync || "";
  persist();
  render();
  ensureFxRates();
  ensureSpyPrices();
}

function importElapsedText() {
  const t0 = state.ws.syncStartedAt;
  if (!t0) return "Working · 0s";
  const sec = Math.max(0, Math.floor((Date.now() - t0) / 1000));
  if (sec < 60) return "Working · " + sec + "s";
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return "Working · " + m + "m " + String(s).padStart(2, "0") + "s";
}

function applyWsStatus(st) {
  if (!st) return false;
  const prevSync = state.ws.lastSync;
  const prevCount = state.ws.activityCount;
  state.ws.available = true;
  state.ws.connected = !!st.connected;
  state.ws.email = st.email || "";
  state.ws.syncing = !!st.syncing;
  state.ws.capturing = !!st.capturing;
  state.ws.lastSync = st.lastSync || state.ws.lastSync || "";
  state.ws.activityCount = st.activityCount || 0;
  state.ws.error = st.error || "";
  state.ws.syncStep = st.syncStep || "";
  if (st.syncing && !state.ws.syncStartedAt) state.ws.syncStartedAt = Date.now();
  if (!st.syncing) state.ws.syncStartedAt = 0;
  const el = document.getElementById("watchStatus");
  if (el) el.textContent = wsStatusText() || state.watchStatus || "";
  const changed = (state.ws.lastSync && state.ws.lastSync !== prevSync) || (state.ws.activityCount !== prevCount);
  return changed;
}

function fetchWsBook() {
  return api("GET", "/api/book").then((book) => {
    if (book && book.ok && Array.isArray(book.activities)) replaceWsActivities(book);
  });
}

function pollWsStatus() {
  if (!HAS_LOCAL_API) return Promise.resolve();
  return api("GET", "/api/status").then((st) => {
    if (!st || st.ok === false) {
      state.ws.available = false;
      return;
    }
    const prev = {
      connected: state.ws.connected,
      syncing: state.ws.syncing,
      error: state.ws.error,
      capturing: state.ws.capturing,
      connectOpen: state.connectOpen,
      syncStep: state.ws.syncStep,
    };
    const changed = applyWsStatus(st);
    if (state.ws.connected && state.ws.capturing === false && state.connectOpen) {
      state.connectOpen = false;
    }
    const screenChanged = (
      prev.connected !== state.ws.connected ||
      prev.syncing !== state.ws.syncing ||
      prev.error !== state.ws.error ||
      prev.capturing !== state.ws.capturing ||
      prev.connectOpen !== state.connectOpen ||
      prev.syncStep !== state.ws.syncStep
    );
    if (changed && state.ws.connected && state.ws.activityCount > 0 && state.ws.lastSync !== window.__wsBookAt) {
      return fetchWsBook();
    }
    if (screenChanged) render();
    else {
      const el = document.getElementById("watchStatus");
      if (el) el.textContent = wsStatusText() || state.watchStatus || "";
    }
  });
}

function startWsPoll() {
  if (window.__wsPollStarted || !HAS_LOCAL_API) return;
  window.__wsPollStarted = true;
  setInterval(pollWsStatus, 20000);
  setInterval(function () {
    if (state.ws.capturing || state.ws.syncing) pollWsStatus();
    if (state.ws.syncing) {
      const el = document.getElementById("importElapsed");
      if (el) el.textContent = importElapsedText();
    }
  }, 1000);
}

function waitForConnect(timeoutMs) {
  const t0 = Date.now();
  return new Promise((resolve) => {
    const tick = () => {
      api("GET", "/api/status").then((st) => {
        applyWsStatus(st);
        render();
        if (st && st.connected) return resolve(st);
        if (Date.now() - t0 > timeoutMs) {
          if (!st || !st.connected) {
            state.ws.error = "No session yet. Finish login in the Chrome window, then wait a few seconds.";
            state.ws.capturing = false;
          }
          return resolve(st);
        }
        setTimeout(tick, 1500);
      });
    };
    tick();
  });
}

function beginConnect() {
  state.ws.error = "";
  state.connectOpen = true;
  state.menuOpen = false;
  render();
}

function confirmConnect() {
  state.ws.error = "";
  state.ws.capturing = true;
  render();
  api("POST", "/api/login/start").then((res) => {
    if (!res || !res.ok) {
      state.ws.capturing = false;
      state.ws.error = (res && res.error) || "Install Chrome. Passkey login has to happen on Wealthsimple’s site.";
      render();
      return;
    }
    setWatchStatus("Waiting for Wealthsimple login…");
    waitForConnect(180000).then((st) => {
      if (!st || !st.connected) {
        state.ws.capturing = false;
        render();
        return;
      }
      state.connectOpen = false;
      state.ws.syncing = true;
      setWatchStatus("Syncing…");
      render();
      api("POST", "/api/sync").then(() => {
        const t0 = Date.now();
        const waitSync = () => {
          api("GET", "/api/status").then((s2) => {
            applyWsStatus(s2);
            if (s2 && s2.error && !s2.syncing) {
              state.ws.syncing = false;
              render();
              return;
            }
            if (s2 && !s2.syncing && (s2.lastSync || s2.activityCount > 0)) {
              return fetchWsBook().then(() => { state.ws.syncing = false; render(); });
            }
            if (Date.now() - t0 > 120000) {
              state.ws.syncing = false;
              if (!state.ws.error) state.ws.error = "Sync timed out.";
              render();
              return;
            }
            setTimeout(waitSync, 1500);
          });
        };
        waitSync();
      });
    });
  });
}

function saveManualTrade() {
  const date = (document.getElementById("trDate") || {}).value || "";
  const symbol = String((document.getElementById("trSymbol") || {}).value || "").trim().toUpperCase();
  const side = String((document.getElementById("trSide") || {}).value || "BUY").toUpperCase();
  const qty = Number((document.getElementById("trQty") || {}).value || 0);
  const price = Number((document.getElementById("trPrice") || {}).value || 0);
  const currency = String((document.getElementById("trCcy") || {}).value || "CAD").toUpperCase();
  const accountId = String((document.getElementById("trAccount") || {}).value || "manual") || "manual";
  if (!symbol || !(qty > 0) || !(price >= 0) || !date) return;
  const payload = { date: date, symbol: symbol, side: side, qty: qty, price: price, currency: currency, accountId: accountId };
  const finish = (act) => {
    if (act) {
      const { merged } = mergeActivities(state.activities, [act]);
      state.activities = ensureBookIds(merged);
    }
    state.tradeOpen = false;
    persist();
    render();
    ensureFxRates();
    ensureSpyPrices();
  };
  if (HAS_LOCAL_API) {
    api("POST", "/api/book/append", payload).then((res) => {
      if (res && res.ok && res.activity) finish(res.activity);
      else {
        const signedQty = side === "SELL" ? -Math.abs(qty) : Math.abs(qty);
        const cash = side === "SELL" ? Math.abs(qty * price) : -Math.abs(qty * price);
        finish({
          id: "manual|" + date + "|" + accountId + "|" + symbol + "|" + side + "|" + qty + "|" + price + "|" + Date.now(),
          transactionDate: date,
          settlementDate: date,
          accountId: accountId,
          bookId: accountId,
          accountType: accountId === "manual" ? "Manual" : "",
          activityType: "Trade",
          activitySubType: side,
          description: (side === "BUY" ? "Buy" : "Sell") + " " + qty + " " + symbol + " @ " + price,
          direction: side === "BUY" ? "DEBIT" : "CREDIT",
          symbol: symbol,
          name: symbol,
          currency: currency,
          quantity: signedQty,
          unitPrice: price,
          commission: 0,
          netCashAmount: cash,
          category: "trade",
          source: "manual",
        });
      }
    });
  } else {
    const signedQty = side === "SELL" ? -Math.abs(qty) : Math.abs(qty);
    const cash = side === "SELL" ? Math.abs(qty * price) : -Math.abs(qty * price);
    finish({
      id: "manual|" + date + "|" + accountId + "|" + symbol + "|" + side + "|" + qty + "|" + price + "|" + Date.now(),
      transactionDate: date,
      settlementDate: date,
      accountId: accountId,
      bookId: accountId,
      accountType: accountId === "manual" ? "Manual" : "",
      activityType: "Trade",
      activitySubType: side,
      description: (side === "BUY" ? "Buy" : "Sell") + " " + qty + " " + symbol + " @ " + price,
      direction: side === "BUY" ? "DEBIT" : "CREDIT",
      symbol: symbol,
      name: symbol,
      currency: currency,
      quantity: signedQty,
      unitPrice: price,
      commission: 0,
      netCashAmount: cash,
      category: "trade",
      source: "manual",
    });
  }
}

function bootLocalApi() {
  if (!HAS_LOCAL_API) return;
  startWsPoll();
  api("GET", "/api/status").then((st) => {
    if (!st || st.ok === false) return;
    applyWsStatus(st);
    const load = (st.connected && st.activityCount > 0)
      ? api("GET", "/api/book").then((book) => {
          if (book && book.ok && Array.isArray(book.activities)) replaceWsActivities(book);
        })
      : Promise.resolve();
    load.then(() => {
      const last = st.lastSync ? Date.parse(st.lastSync) : 0;
      const stale = !last || (Date.now() - last) > 2 * 60 * 1000;
      if (st.connected && stale) {
        api("POST", "/api/sync");
      }
      render();
    });
  });
}

function bindDocumentOnce() {
  if (window.__bagholderDocBound) return;
  window.__bagholderDocBound = true;
  document.addEventListener("dragover", (e) => {
    const types = e.dataTransfer && e.dataTransfer.types;
    if (!types || (types.contains ? !types.contains("Files") : ![].slice.call(types).includes("Files"))) return;
    e.preventDefault();
    showDropOverlay(true);
  });
  document.addEventListener("dragleave", (e) => {
    if (e.relatedTarget) return;
    showDropOverlay(false);
  });
  document.addEventListener("drop", (e) => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();
    showDropOverlay(false);
    filesFromDataTransfer(e.dataTransfer).then((files) => {
      if (files && files.length) ingestFileList(files);
    });
  });
  document.addEventListener("input", (e) => {
    if (!e.target || e.target.id !== "search") return;
    const raw = e.target.value;
    const exact = exactBlotterSymbol(raw);
    state.filters.q = exact;
    state.symbolPickHi = null;
    refreshClosedBlotter();
    showSymbolPick(raw);
  });
  document.addEventListener("focusin", (e) => {
    if (!e.target || e.target.id !== "search") return;
    showSymbolPick(e.target.value);
  });
  document.addEventListener("keydown", (e) => {
    if (!e.target || e.target.id !== "search") return;
    const list = document.getElementById("symbolPickList");
    const open = list && !list.hidden;
    const matches = matchingBlotterSymbols(e.target.value);
    if (e.key === "Escape") {
      hideSymbolPick();
      return;
    }
    if (e.key === "ArrowDown" && matches.length) {
      e.preventDefault();
      const cur = state.symbolPickHi;
      state.symbolPickHi = cur == null ? 0 : Math.min(matches.length - 1, cur + 1);
      showSymbolPick(e.target.value);
      return;
    }
    if (e.key === "ArrowUp" && matches.length) {
      e.preventDefault();
      const cur = state.symbolPickHi;
      state.symbolPickHi = cur == null ? matches.length - 1 : Math.max(0, cur - 1);
      showSymbolPick(e.target.value);
      return;
    }
    if (e.key === "Enter") {
      e.preventDefault();
      const exact = exactBlotterSymbol(e.target.value);
      const hi = state.symbolPickHi;
      const pick = (hi != null && matches[hi]) || exact || (matches.length === 1 ? matches[0] : "");
      if (pick) pickBlotterSymbol(pick);
      return;
    }
  });
  document.addEventListener("mousedown", (e) => {
    const btn = e.target && e.target.closest && e.target.closest("#symbolPickList [data-symbol]");
    if (!btn) return;
    e.preventDefault();
    pickBlotterSymbol(btn.getAttribute("data-symbol"));
  });
  document.addEventListener("mousemove", (e) => {
    const hit = e.target && e.target.closest && e.target.closest("[data-pnl-tip]");
    const wrap = hit && hit.closest(".chart-wrap");
    document.querySelectorAll(".chart-tip").forEach((t) => {
      if (!wrap || t.parentElement !== wrap) t.hidden = true;
    });
    if (!hit || !wrap) return;
    const tip = wrap.querySelector(".chart-tip");
    if (!tip) return;
    tip.hidden = false;
    tip.textContent = hit.getAttribute("data-pnl-tip") || "";
    const r = wrap.getBoundingClientRect();
    const tw = tip.offsetWidth || 0;
    const th = tip.offsetHeight || 0;
    let x = e.clientX - r.left;
    let y = e.clientY - r.top;
    const half = tw / 2;
    x = Math.min(Math.max(half + 4, x), Math.max(half + 4, r.width - half - 4));
    const above = y >= th + 12;
    tip.classList.toggle("below", !above);
    tip.style.left = x + "px";
    tip.style.top = y + "px";
  });
  document.addEventListener("click", (e) => {
    if (!e.target || !e.target.closest || !e.target.closest("#symbolPick")) hideSymbolPick();
    if (!state.menuOpen && !state.filterOpen) return;
    state.menuOpen = false;
    state.filterOpen = false;
    const menu = document.getElementById("menu");
    const panel = document.getElementById("filterPanel");
    const fbtn = document.getElementById("filterBtn");
    if (menu) menu.classList.remove("open");
    if (panel) panel.classList.remove("open");
    if (fbtn) fbtn.classList.remove("on");
  });
}

function bind() {
  bindDocumentOnce();
  const file = document.getElementById("file");
  const folder = document.getElementById("folder");
  file.addEventListener("change", () => {
    if (file.files && file.files.length) ingestFileList(file.files);
    file.value = "";
  });
  if (folder) {
    folder.addEventListener("change", () => {
      if (folder.files && folder.files.length) ingestFileList(folder.files);
      folder.value = "";
    });
  }
  function closePanels() {
    state.menuOpen = false;
    state.filterOpen = false;
    const menu = document.getElementById("menu");
    const panel = document.getElementById("filterPanel");
    const fbtn = document.getElementById("filterBtn");
    if (menu) menu.classList.remove("open");
    if (panel) panel.classList.remove("open");
    if (fbtn) fbtn.classList.remove("on");
  }
  const menuBtn = document.getElementById("menuBtn");
  const menu = document.getElementById("menu");
  if (menuBtn && menu) {
    menuBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = !state.menuOpen;
      closePanels();
      state.menuOpen = open;
      menu.classList.toggle("open", open);
    });
    menu.addEventListener("click", (e) => e.stopPropagation());
  }
  const filterBtn = document.getElementById("filterBtn");
  const filterPanel = document.getElementById("filterPanel");
  if (filterBtn && filterPanel) {
    filterBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = !state.filterOpen;
      closePanels();
      state.filterOpen = open;
      filterPanel.classList.toggle("open", open);
      filterBtn.classList.toggle("on", open);
    });
    filterPanel.addEventListener("click", (e) => e.stopPropagation());
  }
  const resetFilters = document.getElementById("resetFilters");
  if (resetFilters) {
    resetFilters.addEventListener("click", () => {
      state.filters.from = "";
      state.filters.to = "";
      state.filters.symbol = "";
      state.filterOpen = true;
      persist();
      render();
    });
  }
  function closeConnect() { state.connectOpen = false; render(); }
  function closeTrade() { state.tradeOpen = false; render(); }
  const connectWs = document.getElementById("connectWs");
  if (connectWs) connectWs.addEventListener("click", (e) => { e.stopPropagation(); beginConnect(); });
  const emptyConnect = document.getElementById("emptyConnect");
  if (emptyConnect) emptyConnect.addEventListener("click", (e) => { e.stopPropagation(); beginConnect(); });
  const emptySync = document.getElementById("emptySync");
  if (emptySync) emptySync.addEventListener("click", (e) => { e.stopPropagation(); syncNow(); });
  const confirmConnectBtn = document.getElementById("confirmConnect");
  if (confirmConnectBtn) confirmConnectBtn.addEventListener("click", (e) => { e.stopPropagation(); confirmConnect(); });
  const cancelConnect = document.getElementById("cancelConnect");
  if (cancelConnect) cancelConnect.addEventListener("click", (e) => { e.stopPropagation(); closeConnect(); });
  const closeConnectBtn = document.getElementById("closeConnect");
  if (closeConnectBtn) closeConnectBtn.addEventListener("click", (e) => { e.stopPropagation(); closeConnect(); });
  const connectModal = document.getElementById("connectModal");
  if (connectModal) connectModal.addEventListener("click", (e) => e.stopPropagation());
  const connectOverlay = document.getElementById("connectOverlay");
  if (connectOverlay) connectOverlay.addEventListener("click", closeConnect);
  const syncNowBtn = document.getElementById("syncNow");
  if (syncNowBtn) syncNowBtn.addEventListener("click", (e) => { e.stopPropagation(); syncNow(); });
  const disconnectBtn = document.getElementById("disconnectWs");
  if (disconnectBtn) disconnectBtn.addEventListener("click", (e) => { e.stopPropagation(); disconnectWs(); });
  const addTrade = document.getElementById("addTrade");
  if (addTrade) addTrade.addEventListener("click", (e) => {
    e.stopPropagation();
    state.menuOpen = false;
    state.tradeOpen = true;
    render();
  });
  const tradeModal = document.getElementById("tradeModal");
  if (tradeModal) tradeModal.addEventListener("click", (e) => e.stopPropagation());
  const tradeOverlay = document.getElementById("tradeOverlay");
  if (tradeOverlay) tradeOverlay.addEventListener("click", closeTrade);
  const closeTradeBtn = document.getElementById("closeTrade");
  if (closeTradeBtn) closeTradeBtn.addEventListener("click", (e) => { e.stopPropagation(); closeTrade(); });
  const cancelTrade = document.getElementById("cancelTrade");
  if (cancelTrade) cancelTrade.addEventListener("click", (e) => { e.stopPropagation(); closeTrade(); });
  const saveTrade = document.getElementById("saveTrade");
  if (saveTrade) saveTrade.addEventListener("click", (e) => { e.stopPropagation(); saveManualTrade(); });

  document.getElementById("chooseFile").addEventListener("click", () => {
    state.menuOpen = false;
    document.getElementById("file").click();
  });
  document.getElementById("loadFolder").addEventListener("click", async () => {
    state.menuOpen = false;
    if (typeof window.showDirectoryPicker === "function") {
      try {
        const handle = await window.showDirectoryPicker({ mode: "read" });
        await saveDirHandle(handle);
        startWatch(handle);
      } catch (e) {
        if (e && e.name === "AbortError") return;
        document.getElementById("folder").click();
      }
      return;
    }
    setWatchStatus("Loaded from folder. Live watch needs Chrome/Edge (not a file:// page).");
    document.getElementById("folder").click();
  });
  document.getElementById("clear").addEventListener("click", () => {
    state.menuOpen = false;
    if (!confirm("Clear all imported activity and notes from this browser?")) return;
    stopWatch();
    state.activities = [];
    state.notes = {};
    state.filters = { from: "", to: "", account: "", symbol: "", q: "" };
    state.reports = [];
    state.selected = null;
    state.filterOpen = false;
    persist();
    render();
  });
  const dismiss = document.getElementById("dismiss");
  if (dismiss) dismiss.addEventListener("click", () => { state.reports = []; render(); });
  const from = document.getElementById("from");
  if (from) {
    from.addEventListener("change", () => { state.filters.from = from.value; state.filterOpen = true; persist(); render(); });
    document.getElementById("to").addEventListener("change", (e) => { state.filters.to = e.target.value; state.filterOpen = true; persist(); render(); });
    document.getElementById("symbol").addEventListener("change", (e) => { state.filters.symbol = e.target.value; state.filterOpen = true; persist(); render(); });
  }
  const yearSel = document.getElementById("year");
  if (yearSel) {
    yearSel.addEventListener("change", (e) => {
      const y = e.target.value;
      if (!y) {
        state.filters.from = "";
        state.filters.to = "";
      } else {
        state.filters.from = y + "-01-01";
        state.filters.to = y + "-12-31";
      }
      state.filterOpen = true;
      persist();
      render();
    });
  }
  document.querySelectorAll(".tab").forEach((btn) => {
    btn.addEventListener("click", () => { state.tab = btn.getAttribute("data-tab"); render(); });
  });
  document.querySelectorAll("th.sort").forEach((th) => {
    th.addEventListener("click", (e) => {
      e.stopPropagation();
      const tab = th.getAttribute("data-sort-tab");
      const key = th.getAttribute("data-sort-key");
      const cur = state.sort[tab] || { key: key, dir: "desc" };
      const dir = cur.key === key && cur.dir === "desc" ? "asc" : "desc";
      state.sort[tab] = { key: key, dir: dir };
      render();
    });
  });
  document.querySelectorAll("table.blotter tbody tr[data-id]").forEach((tr) => {
    tr.addEventListener("click", () => {
      const id = tr.getAttribute("data-id");
      const { closed } = matchFifo(state.activities);
      const t = applyFx(closed).find((x) => x.id === id);
      state.selected = t || null;
      render();
    });
  });
  const overlay = document.getElementById("overlay");
  const closeDrawer = document.getElementById("closeDrawer");
  if (overlay) overlay.addEventListener("click", () => { state.selected = null; render(); });
  if (closeDrawer) closeDrawer.addEventListener("click", () => { state.selected = null; render(); });
  const thesis = document.getElementById("thesis");
  if (thesis) {
    const saveNote = () => {
      const id = state.selected.id;
      const cur = state.notes[id] || { thesis: "", tag: "", grade: "" };
      cur.thesis = thesis.value;
      cur.tag = document.getElementById("tag").value;
      cur.tradeId = id;
      state.notes[id] = cur;
      persist();
    };
    thesis.addEventListener("change", saveNote);
    document.getElementById("tag").addEventListener("change", saveNote);
    document.querySelectorAll(".grades button").forEach((b) => {
      b.addEventListener("click", () => {
        const id = state.selected.id;
        const cur = state.notes[id] || { thesis: "", tag: "", grade: "" };
        cur.grade = b.getAttribute("data-grade");
        cur.tradeId = id;
        state.notes[id] = cur;
        persist();
        render();
      });
    });
  }
}

loadPersisted();
bootLocalApi();
render();
resumeWatch();
ensureFxRates();
ensureSpyPrices();

</script>
</body>
</html>
