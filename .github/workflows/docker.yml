# Publishes the web app's image to GitHub's container registry on every release tag,
# as ghcr.io/professorbagholder/bagholder:<version> and :latest, so a Docker user
# updates with `docker compose pull && docker compose up -d`. A manual run of the
# workflow on a branch takes an image tag and publishes the branch under that tag only,
# never :latest, so a branch can be handed to testers as
# `docker pull ghcr.io/professorbagholder/bagholder:<tag>`.
name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      name:
        description: "Image tag for this branch's build, e.g. go-v1.44.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the image carries the release's version and nothing else: the tag and the app must agree
      - name: The app's version is the tag's
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^\tAppVersion *= "\(.*\)"$/\1/p' internal/app/app.go)"
          test "$have" = "$want" || { echo "internal/app/app.go says $have, the tag says $want"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/professorbagholder/bagholder
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.name }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
