# Publishes the app's image to GitHub's container registry for every release tag, as
# ghcr.io/professorbagholder/bagholder:<version> and :latest, and under the tags
# :rust-<version> and :rust too. A Docker user updates with
# `docker compose pull && docker compose up -d`. Built from the repository root.
name: Docker image

on:
  # a release tag runs it from `release.yml`, whose publishing of the release waits
  # for it, so a release is never shown before its image is there
  workflow_call:
    inputs:
      # the binaries the release's Linux archives carry, kept by release.yml as
      # artifacts, in place of a second compile
      prebuilt:
        type: boolean
        default: false
  # a run started by hand publishes :rust only, so a copy of master never goes
  # out as the image a release tag put there
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The Rust image is compiled, so each architecture is built on a runner of its
  # own kind rather than under emulation -- minutes instead of the best part of an
  # hour -- and the two are joined into one image afterwards.
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux/amd64, arch: amd64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, platform: linux/arm64, arch: arm64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: The app's version is the tag's
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' rust/crates/server/src/app.rs)"
          test "$have" = "$want" || { echo "rust/crates/server/src/app.rs says $have, the tag says $want"; exit 1; }
      - name: The release's binaries
        if: inputs.prebuilt
        uses: actions/download-artifact@v4
        with:
          name: bins-${{ matrix.target }}
          path: rust/prebuilt/${{ matrix.arch }}
      - name: Runnable
        if: inputs.prebuilt
        run: chmod +x rust/prebuilt/${{ matrix.arch }}/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: rust/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: BINARIES=${{ inputs.prebuilt && 'prebuilt' || 'build' }}
          # each architecture is pushed by its digest; the tags go on the joined image
          outputs: type=image,name=ghcr.io/professorbagholder/bagholder,push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # the file is named for the digest, and a file name cannot carry a colon
          touch "/tmp/digests/${{ matrix.arch }}-${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-rust-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  rust-image:
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-rust-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/professorbagholder/bagholder
          # a release tag is :X.Y.Z and :latest, and :rust-X.Y.Z and :rust for the
          # installs that follow those; a run by hand is :rust alone
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}},prefix=rust-
            type=raw,value=rust
      - name: One image from both architectures
        run: |
          cd /tmp/digests
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for f in *; do echo "ghcr.io/professorbagholder/bagholder@sha256:${f#*-}"; done)
      - name: What was published
        run: docker buildx imagetools inspect ghcr.io/professorbagholder/bagholder:rust
