# Publishes the web app's image to GitHub's container registry.
#
# A release tag `vX.Y.Z` publishes `:X.Y.Z` and moves `:latest`, which is what a Docker user
# running the app follows: `docker compose pull && docker compose up -d`.
#
# A Go port tag `go-vX.Y.Z` publishes `:go-vX.Y.Z` and moves `:go`, and never touches `:latest`.
# The port is a second implementation of the same spec, run beside the app rather than in place
# of it, so `:go` is the one line a user changes to try it and the one that carries them forward.
# The tag is outside the `vX.Y.Z` scheme on purpose: the in-app updater only reads that scheme,
# so a port release never offers itself to a copy of the app.
#
# A manual run on a branch takes an image tag and publishes that tag only, for a build that is
# not a release of either.
name: Docker image

on:
  push:
    tags: ["v*.*.*", "go-v*.*.*"]
  workflow_dispatch:
    inputs:
      name:
        description: "Image tag for this branch's build, e.g. go-v1.44.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # the image carries the release's version and nothing else: the tag and the app must agree
      - name: The app's version is the tag's
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#go-}"
          want="${want#v}"
          have="$(sed -n 's/^\tAppVersion *= "\(.*\)"$/\1/p' internal/app/app.go)"
          test "$have" = "$want" || { echo "internal/app/app.go says $have, the tag says $want"; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/professorbagholder/bagholder
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'go-') }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'go-') }}
            type=raw,value=go,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'go-') }}
            type=raw,value=${{ inputs.name }},enable=${{ github.event_name == 'workflow_dispatch' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
