# The server held to its cost budget (docs/architecture.md §16). Its own workflow so it runs only
# when the Rust code it builds and measures changed, or this file.
name: Capacity

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/capacity.yml'
  push:
    branches: [master]
    paths:
      - 'rust/**'
      - '.github/workflows/capacity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The server held to its cost budget (docs/architecture.md §16) at the reference size and four
  # times it, on the arm64 machine the budget is stated against: `bagholder capacity run` builds
  # the books, measures every operation (seven times, once for one listed over budget), prints the
  # table and fails when an operation off OVER_BUDGET misses its budget or the growth rule, or one
  # on it now meets both. In three parts, each on a runner of its own (`--part K/3`): a part builds
  # the books its measurements need, at once, then makes its measurements one after another, so no
  # two measurements share a machine. The books are built on each run: saved to the Actions cache,
  # their 1.2 GB had not finished uploading after two hours. It runs only when what it builds or
  # measures changed.
  capacity:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # saved by the first part alone, on master
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        id: cache
        with:
          workspaces: rust
          shared-key: capacity
          save-if: ${{ matrix.part == 1 }}
      # on master, after a merge, the build alone, by the first part, and only when master's cache
      # lacks it: the pull request measured this code, and its run starts from master's compiled
      # dependencies
      - name: The server, as released
        if: github.event_name != 'push' || (matrix.part == 1 && steps.cache.outputs.cache-hit != 'true')
        run: cargo build --locked --release --bin bagholder
        working-directory: rust
      - name: The cost budget, its part ${{ matrix.part }} of 3
        if: github.event_name != 'push'
        env:
          PART: ${{ matrix.part }}
        run: |
          set -o pipefail
          target/release/bagholder capacity run "$RUNNER_TEMP/capacity" --part "$PART/3" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        working-directory: rust
