# Every suite, on every pull request and every push to master that touches anything but markdown,
# or the markdown a test reads. Nothing ran on a pull request before this: a branch was only ever as
# tested as whoever remembered to run it. The server and the page are one product -- the page is
# built into the server -- so a pull request is green only when both are. The tests read three
# markdown files (SPEC.md for its rule ids, docs/spec-ids.md, and docs/architecture.md for the cost
# budget), so a change to one of them runs everything; any other documentation runs nothing.
name: Tests

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - 'SPEC.md'
      - 'docs/spec-ids.md'
      - 'docs/architecture.md'
  push:
    branches: [master]
    paths:
      - '**'
      - '!**.md'
      - 'SPEC.md'
      - 'docs/spec-ids.md'
      - 'docs/architecture.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
      # a warning fails the build: the workspace is kept warning-free
      - name: The Rust suite
        env:
          CI: "true"
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace
        working-directory: rust
      # no failure discarded outside tests: the workspace's clippy lints (Cargo.toml),
      # the tests' own code left out, where dropping a result is the test's business
      - name: No discarded failure
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --workspace --lib --bins
        working-directory: rust

  # The same suite on a Mac, and the test a sandboxed local run cannot hold: the notification
  # applet, built with osacompile, which needs Apple Events (#[ignore]d with that reason, so it
  # runs here by name on every push, whoever ran what locally).
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
      - name: The Rust suite
        env:
          CI: "true"
        run: cargo test --workspace
        working-directory: rust
      # the one test kept out of the suite for the machine it needs: the notification
      # applet, built with osacompile (the capture tests read the owner's own data,
      # kept outside the repository, and are run by hand)
      - name: The notification applet, on macOS
        env:
          CI: "true"
        run: cargo test -p bagholder-server -- --ignored --exact notify::tests::test_the_mac_applet_is_built_once_under_bagholders_name_and_icon
        working-directory: rust

  # Windows has no system time zone database, so the model reads the copy built into
  # jiff there: the model's tests (the zones and every shared case) run where that holds.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
      - name: The model's suite
        env:
          CI: "true"
        run: cargo test -p bagholder-model
        working-directory: rust

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the types and the components, then the tests, then the bundle the server carries:
      # the bundle is built here and at release, never committed
      - name: Types and components
        run: npm run check
      - name: The page's tests
        run: npm test
      - name: The bundle builds
        run: npm run build

  # The image the release publishes, built on every pull request and not pushed, then
  # started on the made-up book (offline, dry orders) and driven in a real browser for
  # one order through the page's own path (e2e/dryorder.spec.ts): docker.yml builds it
  # only on a tag, so an image that no longer builds, starts or serves would otherwise
  # first fail at a release.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: browser
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: The browser the test drives
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: The made-up book
        working-directory: rust
        run: |
          cargo build --bin bagholder --bin demo-book
          mkdir -p "$RUNNER_TEMP/book"
          target/debug/demo-book --home "$RUNNER_TEMP/book" --bars
          target/debug/bagholder demo-facts "$RUNNER_TEMP/book"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: The image builds
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: rust/Dockerfile
          load: true
          tags: bagholder:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      # the port the same inside and out, as docker-compose.yml publishes it
      - name: The image starts on the book
        run: |
          docker run -d --name bagholder -p 127.0.0.1:8792:8792 -e BAGHOLDER_PORT=8792 \
            -e BAGHOLDER_DRY_ORDERS=1 -e BAGHOLDER_OFFLINE=1 -e BAGHOLDER_NOTIFY=browser \
            -v "$RUNNER_TEMP/book:/data" bagholder:ci
          # until it answers, or the container has stopped
          until curl -sf -o /dev/null http://127.0.0.1:8792/api/status; do
            [ "$(docker inspect -f '{{.State.Running}}' bagholder)" = true ] || { docker logs bagholder; exit 1; }
            sleep 1
          done
      - name: One dry order through the page
        env:
          E2E_URL: http://127.0.0.1:8792
        run: npx playwright test
        working-directory: web
      - name: The container's log
        if: failure()
        run: docker logs bagholder

  # Known vulnerabilities in what the build depends on: an advisory fails the job
  # (cargo audit's own exit status); an unmaintained or yanked crate is printed and
  # does not, as the project cannot always act on one. npm audit fails at any severity.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
        working-directory: rust
      - name: npm audit
        run: npm audit
        working-directory: web
      # an action by a tag can change under the same name; by its commit it cannot
      # (GitHub, "Security hardening for GitHub Actions")
      - name: Every action pinned by its commit
        run: |
          if grep -nE '^\s*(-\s*)?uses:' .github/workflows/*.yml | grep -vE 'uses: \./|@[0-9a-f]{40}( |$)'; then
            echo "pin each action above to a full commit SHA"; exit 1
          fi

  # The page driven in a real browser against the real server, on a made-up book
  # (docs/architecture.md, rule 8). Nothing leaves the runner: BAGHOLDER_OFFLINE.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: browser
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: The browser the tests drive
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: The server and the made-up book
        run: cargo build --bin bagholder --bin demo-book
        working-directory: rust
      - name: The browser tests
        run: npm run e2e
        working-directory: web
