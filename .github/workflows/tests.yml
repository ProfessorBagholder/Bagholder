# Every suite, once, on every pull request that touches anything but markdown, or the markdown a
# test reads: never again on master for the same code once merged (the owner, 2026-10-26: "you should
# not be re-running duplicate and triplicate things ever, only when absolutely required as a final
# step"). The suites on Windows and macOS are that final step, run on the commit a release is cut
# from (`release.yml`), and nothing is published without them. Nothing ran on a pull request before this: a branch was only ever as
# tested as whoever remembered to run it. The server and the page are one product -- the page is
# built into the server -- so a pull request is green only when both are. The tests read the
# markdown files the paths below name (SPEC.md for its rule ids, docs/spec-ids.md, docs/architecture.md
# for the cost budget, the recorded statement forms' README), so a change to one of them runs
# everything; any other documentation runs nothing.
name: Tests

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - 'SPEC.md'
      - 'docs/spec-ids.md'
      - 'docs/architecture.md'
      - 'CLAUDE.md'
      - 'rust/crates/wealthsimple/tests/replies/wealthsimple-statements/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # the compiled dependencies, which master saves after each merge (`release.yml`,
      # `suite-cache`): a pull request reads only its own caches and master's, and no suite
      # runs on master, so a pull request saves none
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: suite
          save-if: false
      # the lock committed is the one a release builds with (`release.yml` and the
      # image build `--locked`): one that cargo would rewrite fails here, before any
      # step can rewrite it
      - name: The lock file is current
        run: cargo metadata --locked --format-version 1 > /dev/null
        working-directory: rust
      # a start is traced to show it opens no store but the book and the market
      # cache (`server/tests/start_failures.rs`)
      - name: strace
        run: sudo apt-get update && sudo apt-get install -y strace
      # which release a merge makes (release.yml's first step), over every case, with
      # `gh` stood in: it cannot be proven before a release
      - name: The release decision
        run: sh bin/release-which.test.sh
      # cargo-nextest runs each test in a process of its own, as many at once as the
      # runner has cores: the suite's tests no longer wait in line on one shared lock
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      # a warning fails the build: the workspace is kept warning-free; the suite runs
      # on a temp folder of its own, and a test that leaves anything there fails it;
      # nextest runs no doc test, so they run apart
      - name: The Rust suite
        env:
          CI: "true"
          RUSTFLAGS: "-D warnings"
        run: |
          cargo nextest list --workspace --locked > /dev/null
          ../bin/check-test-leftovers.sh cargo nextest run --workspace --locked --no-fail-fast -E 'not test(/^capacity::tests::/)'
          ../bin/check-test-leftovers.sh cargo test --workspace --locked --doc
        working-directory: rust
      # the developer's subcommands (`bagholder demo`, `pull-broker`), each behind a
      # feature no release build enables: their own tests, built with them
      - name: The developer's subcommands
        env:
          CI: "true"
          RUSTFLAGS: "-D warnings"
        run: |
          cargo test --locked -p bagholder-server --features demo,pull-broker --bin bagholder -- demo::
          cargo test --locked -p bagholder-server --features demo,pull-broker --test commands
          cargo test --locked -p bagholder-wealthsimple --features demo --test generated
          cargo clippy --locked -p bagholder-server -p bagholder-wealthsimple --features bagholder-server/demo,bagholder-server/pull-broker --bins --lib
        working-directory: rust
      # bagholder-no-dev-commands: the server as every release builds it (no feature)
      # carries no developer's subcommand, not even its name, by its words or its
      # symbols (release.yml checks the release binary the same way); a word it does
      # not know is refused one way (`crates/server/tests/commands.rs`, in the suite)
      - name: The server built without features carries no developer's subcommand
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --locked --bin bagholder
          bin=target/debug/bagholder
          # a path (a build's own folders, which the binary records, whatever they are
          # named) is left out: the commands' own words and symbols are looked for
          hits=$(strings -a "$bin" | grep -av '[/\\]' | grep -aE '(^|[^A-Za-z0-9_])(demo|pull-broker)([^A-Za-z0-9_]|$)|9bagholder4demo|10demo_facts|11pull_broker|12from_records' || true)
          if [ -n "$hits" ]; then echo "$bin carries a developer's subcommand:"; echo "$hits" | sed -n 1,20p; exit 1; fi
        working-directory: rust
      # no failure discarded outside tests: the workspace's clippy lints (Cargo.toml),
      # the tests' own code left out, where dropping a result is the test's business,
      # and the stand-in Wealthsimple (`standin.rs`, built only under its feature) in:
      # the gate CLAUDE.md names, run here so it is one
      - name: No discarded failure
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo clippy --locked --workspace --lib --bins --features bagholder-ws/standin
        working-directory: rust

  # The server's capacity cases, each building made-up books (`capacity::tests`), beside the
  # suite rather than inside it: the suite's slowest part, run once, in parallel.
  capacity-cases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # master's, as the suite's (above)
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: suite
          save-if: false
      - name: The capacity cases
        env:
          CI: "true"
          RUSTFLAGS: "-D warnings"
        run: cargo test --locked -p bagholder-server --bin bagholder capacity::tests
        working-directory: rust

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the types and the components, then the tests, then the bundle the server carries:
      # the bundle is built here and at release, never committed
      - name: Types and components
        run: npm run check
      - name: The page's tests
        run: npm test
      - name: The bundle builds
        run: npm run build

  # The image the release publishes, built on every pull request and not pushed, then
  # started on the made-up book (offline, dry orders) and driven in a real browser for
  # one order through the page's own path (e2e/dryorder.spec.ts): docker.yml builds it
  # only on a tag, so an image that no longer builds, starts or serves would otherwise
  # first fail at a release.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # master's, as the suite's (the rust job)
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: demo-server
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: The browser the test drives
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: The made-up book
        working-directory: rust
        run: |
          cargo build --locked --bin bagholder --features demo
          target/debug/bagholder demo "$RUNNER_TEMP/book"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: The image builds
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: rust/Dockerfile
          load: true
          tags: bagholder:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      # the port the same inside and out, as docker-compose.yml publishes it
      - name: The image starts on the book
        run: |
          docker run -d --name bagholder -p 127.0.0.1:8792:8792 -e BAGHOLDER_PORT=8792 \
            -e BAGHOLDER_DRY_ORDERS=1 -e BAGHOLDER_OFFLINE=1 -e BAGHOLDER_NOTIFY=browser \
            -v "$RUNNER_TEMP/book:/data" bagholder:ci
          # until it answers, or the container has stopped
          until curl -sf -o /dev/null http://127.0.0.1:8792/api/status; do
            [ "$(docker inspect -f '{{.State.Running}}' bagholder)" = true ] || { docker logs bagholder; exit 1; }
            sleep 1
          done
      - name: One dry order through the page
        env:
          E2E_URL: http://127.0.0.1:8792
        run: npx playwright test --project=image
        working-directory: web
      # #516: a store the image cannot open leaves the server up with its header
      # whole -- the version, the update on offer and the error line saying why
      - name: The image on a book whose market cache cannot be opened
        run: |
          docker rm -f bagholder
          sudo cp -a "$RUNNER_TEMP/book" "$RUNNER_TEMP/broken"
          sudo rm -f "$RUNNER_TEMP/broken/market.db-wal" "$RUNNER_TEMP/broken/market.db-shm"
          echo 'this file is not a database, whatever its name says' | sudo tee "$RUNNER_TEMP/broken/market.db" > /dev/null
          docker run -d --name bagholder -p 127.0.0.1:8792:8792 -e BAGHOLDER_PORT=8792 \
            -e BAGHOLDER_DRY_ORDERS=1 -e BAGHOLDER_OFFLINE=1 -e BAGHOLDER_NOTIFY=browser \
            -v "$RUNNER_TEMP/broken:/data" bagholder:ci
          # until it serves the page, or the container has stopped
          until curl -sf -o /dev/null http://127.0.0.1:8792/; do
            [ "$(docker inspect -f '{{.State.Running}}' bagholder)" = true ] || { docker logs bagholder; exit 1; }
            sleep 1
          done
          body=$(curl -s -H 'X-Bagholder: 1' http://127.0.0.1:8792/api/status)
          echo "$body" | jq -e '.ok == true and (.version | length > 0) and (.updateUrl | length > 0) and has("canUpdate") and .dataVersion == null and .error == "The market cache could not be opened: file is not a database."' \
            || { echo "$body"; exit 1; }
      # the image as the repository's docker-compose.yml runs it: read-only, with only
      # the powers its start needs, on a data folder root made; it takes the folder
      # over and runs as its own user
      - name: The image as shipped runs as its own user on a data folder root made
        run: |
          docker rm -f bagholder
          sudo mkdir -m 700 "$RUNNER_TEMP/rooted"
          cat > "$RUNNER_TEMP/rooted.yml" <<EOF
          services:
            bagholder:
              image: bagholder:ci
              environment:
                - BAGHOLDER_OFFLINE=1
                - BAGHOLDER_DRY_ORDERS=1
              volumes: !override
                - $RUNNER_TEMP/rooted:/data
          EOF
          BAGHOLDER_PORT=8792 docker compose -f docker-compose.yml -f "$RUNNER_TEMP/rooted.yml" up -d
          until curl -sf -o /dev/null -H 'X-Bagholder: 1' http://127.0.0.1:8792/api/status; do
            [ "$(docker inspect -f '{{.State.Running}}' bagholder)" = true ] || { docker logs bagholder; exit 1; }
            sleep 1
          done
          docker exec bagholder grep -E '^Uid:\s+1000\s+1000\s+1000\s+1000$' /proc/1/status
          docker exec bagholder grep -E '^CapEff:\s+0+$' /proc/1/status
          [ "$(sudo stat -c %u "$RUNNER_TEMP/rooted")" = 1000 ]
          docker exec -u bagholder bagholder sh -c 'echo written > "$HOME/.home-probe"'
          [ "$(sudo cat "$RUNNER_TEMP/rooted/.home-probe")" = written ]
          until [ "$(docker inspect -f '{{.State.Health.Status}}' bagholder)" = healthy ]; do
            [ "$(docker inspect -f '{{.State.Health.Status}}' bagholder)" = unhealthy ] && { docker inspect -f '{{json .State.Health}}' bagholder; exit 1; }
            sleep 2
          done
          BAGHOLDER_PORT=8792 docker compose -f docker-compose.yml -f "$RUNNER_TEMP/rooted.yml" down
          sudo rm -rf "$RUNNER_TEMP/rooted"
      # the shipped updater beside it (docker-compose.updater.yml): its API alone, no
      # schedule; Bagholder makes the token it reads and offers the button (an update
      # from one image to the next, pressed in the page, is the last step)
      - name: The shipped updater runs on the button alone, with the token Bagholder made
        run: |
          sudo mkdir -m 700 "$RUNNER_TEMP/updated"
          cat > "$RUNNER_TEMP/updated.yml" <<EOF
          services:
            bagholder:
              image: bagholder:ci
              environment:
                - BAGHOLDER_OFFLINE=1
                - BAGHOLDER_DRY_ORDERS=1
              volumes: !override
                - $RUNNER_TEMP/updated:/data
            bagholder-updater:
              volumes: !override
                - /var/run/docker.sock:/var/run/docker.sock
                - $RUNNER_TEMP/updated/updater:/bagholder-data:ro
          EOF
          files="-f docker-compose.yml -f docker-compose.updater.yml -f $RUNNER_TEMP/updated.yml"
          BAGHOLDER_PORT=8792 docker compose $files up -d --wait --wait-timeout 300
          body=$(curl -s -H 'X-Bagholder: 1' http://127.0.0.1:8792/api/status)
          echo "$body" | jq -e '.updateBy == "container"' || { echo "$body"; exit 1; }
          [ "$(sudo stat -c '%u %a' "$RUNNER_TEMP/updated/updater/token")" = "1000 600" ]
          # of the data folder, the updater is given the token's folder alone
          [ "$(docker inspect -f '{{range .Mounts}}{{.Source}} {{end}}' bagholder-updater | tr ' ' '\n' | sed '/^$/d' | sort | tr '\n' ' ')" = "$RUNNER_TEMP/updated/updater /var/run/docker.sock " ] \
            || { docker inspect -f '{{json .Mounts}}' bagholder-updater; exit 1; }
          until docker logs bagholder-updater 2>&1 | grep -q 'HTTP API enabled and periodic updates disabled'; do
            [ "$(docker inspect -f '{{.State.Running}}' bagholder-updater)" = true ] || { docker logs bagholder-updater; exit 1; }
            sleep 1
          done
          ! docker logs bagholder-updater 2>&1 | grep -i 'next scheduled run'
          [ -z "$(docker port bagholder-updater)" ]
          # from Bagholder's container, as Bagholder asks it: the token it made is
          # taken, another is refused (a name no container has, so nothing updates)
          ask() {
            docker exec bagholder bash -c 'exec 3<>/dev/tcp/bagholder-updater/8080 && printf "POST /v1/update?container=%%5Enone-here%%24&async=true HTTP/1.1\r\nHost: bagholder-updater\r\nAuthorization: Bearer %s\r\nContent-Length: 0\r\nConnection: close\r\n\r\n" "$1" >&3 && IFS= read -r l <&3 && echo "$l"' _ "$1"
          }
          ask "$(sudo cat "$RUNNER_TEMP/updated/updater/token")" | grep -q '^HTTP/1.1 202'
          ask made-up-token | grep -q '^HTTP/1.1 401'
          BAGHOLDER_PORT=8792 docker compose $files down
          sudo rm -rf "$RUNNER_TEMP/updated"
      - name: Who the image answers, on a local network and from the internet, directly and through Traefik, Caddy and nginx
        run: sh bin/container-network.test.sh bagholder:ci
      # The button end to end (docs/plans/docker-update-button.md): a copy running the
      # shipped compose with its updater is offered a release, the button is pressed in
      # a real browser, the updater pulls the next image and replaces the container,
      # and the page comes back on the new server by itself (web/e2e/update.spec.ts).
      # Twice: from the latest release, the page copies run now, to this build; then
      # from this build, its own page pressing, to the same build as another image (the
      # updater replaces a container only for an image other than its own). The updater
      # pulls from a registry on this runner, and GitHub's latest release is stood in,
      # one newer than any build, since nothing newer than this build is published.
      - name: The update button replaces the container, and the page comes back on the new one by itself
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name | ltrimstr("v")')
          this=$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' rust/crates/server/src/app.rs)
          [ -n "$latest" ] && [ -n "$this" ] || { echo "the latest release is '$latest', this build '$this'"; exit 1; }
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          until curl -sf -o /dev/null http://127.0.0.1:5000/v2/; do sleep 1; done
          docker pull -q "ghcr.io/professorbagholder/bagholder:$latest"
          # each image with a label of its own, which the container running it then
          # says: the latest release, this build, and this build again as another image
          name() { made=$(docker create "$1") && docker commit -c "LABEL bagholder.test=$2" "$made" "bagholder:$2" && docker rm -v "$made"; }
          name "ghcr.io/professorbagholder/bagholder:$latest" latest
          name bagholder:ci this
          name bagholder:ci again
          # the image the updater takes next, in the registry alone: its tag is pushed
          # and dropped here, so what runs is what was pulled
          serve() { docker tag "bagholder:$1" localhost:5000/bagholder:latest && docker push -q localhost:5000/bagholder:latest && docker rmi localhost:5000/bagholder:latest; }
          runs() { docker inspect -f '{{index .Config.Labels "bagholder.test"}}' bagholder; }
          serve latest
          # GitHub's API stood in under its own name on the compose network, with a
          # certificate the copy is told to trust
          stand="$RUNNER_TEMP/github"
          mkdir "$stand"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=api.github.com -addext subjectAltName=DNS:api.github.com \
            -keyout "$stand/key.pem" -out "$stand/cert.pem" 2> /dev/null
          cat > "$stand/github.mjs" <<'EOF'
          import { readFileSync } from 'node:fs'
          import { createServer } from 'node:https'
          const tls = { key: readFileSync('/stand-in/key.pem'), cert: readFileSync('/stand-in/cert.pem') }
          const release = JSON.stringify({ tag_name: 'v99.0.0', html_url: 'https://github.com/ProfessorBagholder/Bagholder/releases/tag/v99.0.0', assets: [] })
          createServer(tls, (q, s) => q.url.endsWith('/releases/latest') ? s.writeHead(200, { 'content-type': 'application/json' }).end(release) : s.writeHead(404).end()).listen(443)
          EOF
          sudo mkdir -m 700 "$RUNNER_TEMP/pressed"
          cat > "$RUNNER_TEMP/pressed.yml" <<EOF
          services:
            bagholder:
              image: localhost:5000/bagholder:latest
              environment:
                - BAGHOLDER_DRY_ORDERS=1
                - SSL_CERT_FILE=/stand-in/cert.pem
              volumes: !override
                - $RUNNER_TEMP/pressed:/data
                - $stand/cert.pem:/stand-in/cert.pem:ro
            bagholder-updater:
              volumes: !override
                - /var/run/docker.sock:/var/run/docker.sock
                - $RUNNER_TEMP/pressed/updater:/bagholder-data:ro
            github:
              image: node:22.21.1-alpine3.22@sha256:b2358485e3e33bc3a33114d2b1bdb18cdbe4df01bd2b257198eb51beb1f026c5
              command: [node, /stand-in/github.mjs]
              volumes:
                - $stand:/stand-in:ro
              healthcheck:
                test: [CMD, node, -e, "require('net').connect(443).on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
                interval: 1s
              networks:
                default:
                  aliases: [api.github.com]
          EOF
          files="-f docker-compose.yml -f docker-compose.updater.yml -f $RUNNER_TEMP/pressed.yml"
          # GitHub's stand-in answering before the copy first asks it
          BAGHOLDER_PORT=8792 docker compose $files up -d --wait github
          BAGHOLDER_PORT=8792 docker compose $files up -d --wait --wait-timeout 300
          [ "$(runs)" = latest ]
          # the image the updater takes next served, the button pressed in the page, and
          # the container then running that image
          press() {
            serve "$3"
            (cd web && E2E_URL=http://127.0.0.1:8792 E2E_UPDATE_FROM="$1" E2E_UPDATE_TO="$2" npx playwright test --project=update)
            [ "$(runs)" = "$3" ] || { echo "the container runs the image labelled '$(runs)', not $3"; exit 1; }
          }
          press "$latest" "$this" this
          press "$this" "$this" again
          BAGHOLDER_PORT=8792 docker compose $files down
          docker rm -f registry
          sudo rm -rf "$RUNNER_TEMP/pressed" "$stand"
      - name: The container's log
        if: failure()
        run: |
          docker logs bagholder || true
          docker logs bagholder-updater || true

  # Known vulnerabilities in what the build depends on: an advisory fails the job
  # (cargo audit's own exit status); an unmaintained or yanked crate is printed and
  # does not, as the project cannot always act on one. npm audit fails at any severity
  # on an advisory web/audit.toml does not list (each listed with why it cannot be
  # reached and when it leaves), and on a listed one it no longer reports.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
        working-directory: rust
      - name: npm audit, against the advisories it lets pass
        run: |
          node --test ../bin/npm-audit.test.mjs
          # npm audit exits 1 whenever it reports anything: the list decides
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node ../bin/npm-audit.mjs "$RUNNER_TEMP/npm-audit.json" audit.toml
        working-directory: web
      # an action by a tag can change under the same name; by its commit it cannot
      # (GitHub, "Security hardening for GitHub Actions")
      - name: Every action pinned by its commit
        run: |
          if grep -nE '^\s*(-\s*)?uses:' .github/workflows/*.yml | grep -vE 'uses: \./|@[0-9a-f]{40}( |$)'; then
            echo "pin each action above to a full commit SHA"; exit 1
          fi

  # The page driven in a real browser against the real server, on a made-up book
  # (docs/architecture.md, rule 8). Nothing leaves the runner: BAGHOLDER_OFFLINE.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # master's, as the suite's (the rust job)
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: demo-server
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: The browser the tests drive
        run: npx playwright install --with-deps chromium
        working-directory: web
