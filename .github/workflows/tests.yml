# Every suite, on every pull request and every push to master. Nothing ran on a pull request before
# this: a branch was only ever as tested as whoever remembered to run it. The builds are one
# product -- they share the page, the database and the version number -- so a pull request is green
# only when both are. The Python app is the standard library, so there is nothing to install; its
# suite refuses the network and writes only into a home of its own (python/tests/__init__.py), so a
# red run here is the code, not the day.
name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: Write the screenshot baselines instead of comparing them (they come back as the run's artifact)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the floor the README promises, and the version most people will have
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # test_package reads the tracked file list
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"      # the page's script is parsed with node --check; CI fails without it
      - name: The Python suite
        env:
          CI: "true"              # a missing tool is a failure here, never a skip
        # -t python is what imports python/tests/__init__.py, the run's guards
        run: python -m unittest discover -s python/tests -t python

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # a warning fails the build: the workspace is kept warning-free
      - name: The Rust suite
        env:
          CI: "true"
          RUSTFLAGS: "-D warnings"
        run: cargo test --workspace
        working-directory: rust

  # The same suite on a Mac, with the tests a sandboxed local run cannot hold (they are marked
  # #[ignore] with their reason, e.g. the notification applet, built with osacompile, which needs
  # Apple Events) run as well: every test counts on every push, whoever ran what locally.
  rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: The Rust suite, ignored tests included
        env:
          CI: "true"
        run: cargo test --workspace -- --include-ignored
        working-directory: rust

  # Windows has no system time zone database, so the model reads the copy built into
  # jiff there: the model's tests (the zones and every shared case) run where that holds.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: The model's suite
        env:
          CI: "true"
        run: cargo test -p bagholder-model
        working-directory: rust

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the types and the components, then the tests, then the bundle the server carries:
      # the bundle is built here and at release, never committed
      - name: Types and components
        run: npm run check
      - name: The page's tests
        run: npm test
      - name: The bundle builds
        run: npm run build

  # The page driven in a real browser against the real server, on a made-up book
  # (docs/architecture.md, rule 8). Nothing leaves the runner: BAGHOLDER_OFFLINE.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: browser
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: The browser the tests drive
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: The server and the made-up book
        run: cargo build --bin bagholder --bin demo-book
        working-directory: rust
      - name: The browser tests
        run: npm run e2e
        working-directory: web

  # The screenshot baselines of every screen at the four widths (web/e2e/baselines.spec.ts).
  # A screenshot depends on the machine that renders it, so they are made and compared in
  # this one image only, with the server's clock set to one instant so a figure measured to
  # today reads the same on every run. Run by hand with update_baselines to write them.
  baselines:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
      BAGHOLDER_BASELINES: "1"
      BAGHOLDER_E2E_FAKETIME: "2026-09-10T16:00:00Z"
      BAGHOLDER_E2E_LIBFAKETIME: /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
    steps:
      - uses: actions/checkout@v4
      - name: faketime and a linker
        run: apt-get update && apt-get install -y --no-install-recommends faketime build-essential
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: baselines
      - run: npm ci
        working-directory: web
      - name: The server and the made-up book
        run: cargo build --bin bagholder --bin demo-book
        working-directory: rust
      - name: The page
        run: npx vite build
        working-directory: web
      - name: The baselines
        run: npx playwright test e2e/baselines.spec.ts --reporter=line ${{ inputs.update_baselines && '--update-snapshots' || '' }}
        working-directory: web
      - name: The baselines written
        if: ${{ inputs.update_baselines }}
        uses: actions/upload-artifact@v4
        with:
          name: baselines
          path: web/e2e/baselines.spec.ts-snapshots
      - name: What differed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline-differences
          path: web/test-results

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the packaging tests read the tracked file list
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"      # the page's script is parsed with node --check; CI fails without it
      # the page is the repository's; the module embeds it, so it is brought in first
      - name: The page the binary carries
        run: go generate ./...
        working-directory: go
      - name: Vet
        run: go vet ./...
        working-directory: go
      - name: The Go suite
        env:
          CI: "true"
        run: go test ./...
        working-directory: go
