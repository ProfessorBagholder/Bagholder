# Builds the archives a release carries and attaches each with its .sha256 to the
# release the tag belongs to: bagholder-vX.Y.Z-rust-<target>.tar.gz (.zip on Windows),
# one per platform, the file every installed copy's updater downloads: the server (with
# the page built into it), its browser helper, the disclosures MCP server and the
# SEDAR+ command.
name: Release archives

on:
  push:
    tags: ["v*.*.*"]
    # every merge builds the same archives, nothing attached or published, so the
    # build a release tag makes starts from master's compiled dependencies and
    # Windows' OpenSSL (a tag's run may read master's caches, never another tag's)
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.43.2"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - name: The app's version is the tag's
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          have="$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' rust/crates/server/src/app.rs)"
          test "$have" = "${TAG#v}" || { echo "rust/crates/server/src/app.rs says $have, the tag says $TAG"; exit 1; }
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libssl-dev
      # OpenSSL for Windows, built by vcpkg once and kept: building it took five of
      # the release's thirteen minutes
      - name: OpenSSL for Windows, kept
        if: runner.os == 'Windows'
        id: openssl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:/vcpkg/installed/x64-windows-static-md
          key: vcpkg-openssl-x64-windows-static-md-${{ matrix.os }}-v1
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y nasm
          if [ "${{ steps.openssl.outputs.cache-hit }}" != "true" ]; then vcpkg install openssl:x64-windows-static-md; fi
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows-static-md" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # the compiled dependencies, kept per platform from master's builds
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # the page is built first: the server's build carries it (rust/crates/server/build.rs)
      - name: Build the page
        working-directory: web
        run: npm ci && npm run build
      - name: Build
        working-directory: rust
        run: cargo build --release --locked --bin bagholder --bin bagholder-browser --bin disclosures-mcp --bin sedar
      - name: Package
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          name="bagholder-${TAG}-rust-${{ matrix.target }}"
          mkdir -p dist/pkg
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for b in bagholder bagholder-browser disclosures-mcp sedar; do cp "rust/target/release/$b$ext" dist/pkg/; done
          cd dist/pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$name.zip" . >/dev/null; cd .. && sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "../$name.tar.gz" *; cd .. && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      # the Linux binaries, for the release's image (docker.yml), which is built from them
      - name: Keep the Linux binaries for the image
        if: runner.os == 'Linux' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bins-${{ matrix.target }}
          path: dist/pkg/*
          retention-days: 1
      - name: Attach to the release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/bagholder-* --clobber

  # the release's image, made from the Linux archives' own binaries
  docker:
    needs: rust
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/docker.yml
    with:
      prebuilt: true
    secrets: inherit

  # The release is created as a prerelease, which GitHub's latest release (the one
  # every installed copy checks) leaves out; it becomes the latest only once every
  # platform's archive and the image are there, so no copy is ever offered a
  # release it cannot take.
  publish:
    needs: [rust, docker]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the release as the latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
