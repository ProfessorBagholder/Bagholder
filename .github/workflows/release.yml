# Builds the archives a release carries and attaches each with its .sha256 to the
# release: bagholder-vX.Y.Z-rust-<target>.tar.gz (.zip on Windows), one per platform,
# the file every installed copy's updater downloads: the server (with the page built
# into it), its browser helper, the disclosures MCP server and the SEDAR+ command.
#
# A release is built once, by the run of the merge that makes it: a push to master
# that changes the app's version, for which a draft release of that version is
# written (its title and notes) before the merge. That run builds, tests on macOS
# and Windows, attaches the archives, publishes the image, and publishes the draft
# as the latest. Every other merge builds the same archives and attaches nothing,
# so master's caches stay warm. A run by hand rebuilds a release already tagged.
name: Release archives

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.43.2"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # The release this run makes, if any: the tag a run by hand names, or, on a merge
  # that changes the app's version, that version's draft release.
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.which.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: which
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          ASKED: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "$ASKED" ]; then echo "tag=$ASKED" >> "$GITHUB_OUTPUT"; exit 0; fi
          version() { git show "$1:rust/crates/server/src/app.rs" 2>/dev/null | sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p'; }
          now="$(version "$GITHUB_SHA")"
          was="$(version "$BEFORE")"
          if [ -z "$now" ] || [ "$now" = "$was" ]; then echo "the version stays $now: no release"; exit 0; fi
          if [ "$(gh release view "v$now" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            echo "v$now: this merge publishes its draft release"
            echo "tag=v$now" >> "$GITHUB_OUTPUT"
          else
            echo "the version is now $now and no draft release v$now is written: no release"
          fi

  rust:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.release.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - name: The app's version is the release's
        if: needs.release.outputs.tag != ''
        run: |
          have="$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' rust/crates/server/src/app.rs)"
          test "$have" = "${TAG#v}" || { echo "rust/crates/server/src/app.rs says $have, the release is $TAG"; exit 1; }
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libssl-dev
      # OpenSSL for Windows, built by vcpkg once and kept: building it took five of
      # the release's thirteen minutes
      - name: OpenSSL for Windows, kept
        if: runner.os == 'Windows'
        id: openssl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: C:/vcpkg/installed/x64-windows-static-md
          key: vcpkg-openssl-x64-windows-static-md-${{ matrix.os }}-v1
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y nasm
          if [ "${{ steps.openssl.outputs.cache-hit }}" != "true" ]; then vcpkg install openssl:x64-windows-static-md; fi
          echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows-static-md" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # the compiled dependencies, kept per platform from master's builds
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          workspaces: rust
          shared-key: release-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # the page is built first: the server's build carries it (rust/crates/server/build.rs)
      - name: Build the page
        working-directory: web
        run: npm ci && npm run build
      - name: Build
        working-directory: rust
        run: cargo build --release --locked --bin bagholder --bin bagholder-browser --bin disclosures-mcp --bin sedar
      # the archive's server carries no developer's subcommand (features no release
      # enables), not even its name, by its words or its symbols
      - name: No developer's subcommand in the release
        if: runner.os != 'Windows'
        working-directory: rust
        run: |
          bin=target/release/bagholder
          # a path (a build's own folders, which the binary records, whatever they are
          # named) is left out: the commands' own words and symbols are looked for
          hits=$(strings -a "$bin" | grep -av '[/\\]' | grep -aE '(^|[^A-Za-z0-9_])(demo|pull-broker)([^A-Za-z0-9_]|$)|9bagholder4demo|10demo_facts|11pull_broker|12from_records' || true)
          if [ -n "$hits" ]; then echo "$bin carries a developer's subcommand:"; echo "$hits" | sed -n 1,20p; exit 1; fi
      - name: Package
        if: needs.release.outputs.tag != ''
        run: |
          name="bagholder-${TAG}-rust-${{ matrix.target }}"
          mkdir -p dist/pkg
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for b in bagholder bagholder-browser disclosures-mcp sedar; do cp "rust/target/release/$b$ext" dist/pkg/; done
          cd dist/pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$name.zip" . >/dev/null; cd .. && sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "../$name.tar.gz" *; cd .. && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      # the Linux binaries, for the release's image (docker.yml), which is built from them
      - name: Keep the Linux binaries for the image
        if: runner.os == 'Linux' && needs.release.outputs.tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bins-${{ matrix.target }}
          path: dist/pkg/*
          retention-days: 1
      - name: Attach to the release
        if: needs.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/bagholder-* --clobber

  # The suites on macOS and Windows, run once, here, as a release's final step on the commit it is
  # cut from: a pull request runs them on Linux alone (`tests.yml`). The release stays a draft,
  # which no installed copy is offered, unless both pass. On a merge that makes no release each
  # compiles its suite and runs nothing, and only when master's cache lacks it, so a release's run
  # starts from compiled dependencies.
  suite-macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        id: cache
        with:
          workspaces: rust
      - name: The suite, compiled
        if: needs.release.outputs.tag == '' && steps.cache.outputs.cache-hit != 'true'
        env:
          CI: "true"
        run: cargo test --workspace --locked --no-run
        working-directory: rust
      # cargo-nextest runs each test in a process of its own, as many at once as the
      # runner has cores (`tests.yml`)
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: needs.release.outputs.tag != ''
        with:
          tool: cargo-nextest@0.9.148
      # on a temp folder of its own: a test that leaves anything there fails it;
      # nextest runs no doc test, so they run apart
      - name: The Rust suite
        if: needs.release.outputs.tag != ''
        env:
          CI: "true"
        run: |
          cargo nextest list --workspace --locked > /dev/null
          ../bin/check-test-leftovers.sh cargo nextest run --workspace --locked --no-fail-fast -E 'not test(/^capacity::tests::/)'
          ../bin/check-test-leftovers.sh cargo test --workspace --locked --doc
        working-directory: rust
      # the test a sandboxed local run cannot hold: the notification applet, built with
      # osacompile, which needs Apple Events (#[ignore]d with that reason)
      - name: The notification applet, on macOS
        if: needs.release.outputs.tag != ''
        env:
          CI: "true"
        run: cargo test --locked -p bagholder-server -- --ignored --exact notify::tests::test_the_mac_applet_is_built_once_under_bagholders_name_and_icon
        working-directory: rust

  # Windows has no system time zone database, so the model reads the copy built into
  # jiff there: the model's tests (the zones and every shared case) run where that holds.
  suite-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.tag || github.sha }}
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        id: cache
        with:
          workspaces: rust
      - name: The model's suite, compiled
        if: needs.release.outputs.tag == '' && steps.cache.outputs.cache-hit != 'true'
        env:
          CI: "true"
        run: cargo test --locked -p bagholder-model --no-run
        working-directory: rust
      # on a temp folder of its own: a test that leaves anything there fails it
      - name: The model's suite
        if: needs.release.outputs.tag != ''
        env:
          CI: "true"
        shell: bash
        run: |
          cargo test --locked -p bagholder-model --no-run
          ../bin/check-test-leftovers.sh cargo test --locked -p bagholder-model
        working-directory: rust

  # the release's image, made from the Linux archives' own binaries
  docker:
    needs: [release, rust]
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/docker.yml
    with:
      prebuilt: true
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit

  # The release stays a draft (or, run by hand, a prerelease), which GitHub's latest
  # release (the one every installed copy checks) leaves out; it becomes the latest
  # only once every platform's archive and the image are there and both suites
  # passed, so no copy is ever offered a release it cannot take. A draft is
  # published on this run's own commit, which tags it.
  publish:
    needs: [release, rust, docker, suite-macos, suite-windows]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the release as the latest
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft=false --prerelease=false --latest
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          fi
