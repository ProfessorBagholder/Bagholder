# Builds the archives a release carries and attaches each with its .sha256 to the
# release the tag belongs to: bagholder-vX.Y.Z-rust-<target>.tar.gz (.zip on Windows),
# one per platform, the file every installed copy's updater downloads: the server (with
# the page built into it), its browser helper, the disclosures MCP server and the
# SEDAR+ command.
name: Release archives

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.43.2"
        required: true

permissions:
  contents: write

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: The app's version is the tag's
        run: |
          have="$(sed -n 's/^pub const APP_VERSION: &str = "\(.*\)";$/\1/p' rust/crates/server/src/app.rs)"
          test "$have" = "${TAG#v}" || { echo "rust/crates/server/src/app.rs says $have, the tag says $TAG"; exit 1; }
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev pkg-config libssl-dev
      - name: Build tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y nasm && vcpkg install openssl:x64-windows-static-md && echo "OPENSSL_DIR=C:/vcpkg/installed/x64-windows-static-md" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the page is built first: the server's build carries it (rust/crates/server/build.rs)
      - name: Build the page
        working-directory: web
        run: npm ci && npm run build
      - name: Build
        working-directory: rust
        run: cargo build --release --locked --bin bagholder --bin bagholder-browser --bin disclosures-mcp --bin sedar
      - name: Package
        run: |
          name="bagholder-${TAG}-rust-${{ matrix.target }}"
          mkdir -p dist/pkg
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          for b in bagholder bagholder-browser disclosures-mcp sedar; do cp "rust/target/release/$b$ext" dist/pkg/; done
          cd dist/pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../$name.zip" . >/dev/null; cd .. && sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "../$name.tar.gz" *; cd .. && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/bagholder-* --clobber
