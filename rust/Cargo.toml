[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/book", "crates/sqlite", "crates/model", "crates/store", "crates/market", "crates/ws", "crates/server", "crates/browser", "crates/diff", "crates/diff-derive", "crates/sources", "crates/net", "crates/wealthsimple", "crates/broker"]

[workspace.package]
version = "1.45.0"
edition = "2021"
rust-version = "1.98"

[profile.release]
# the toolchain's objcopy is not installed with the minimal profile
strip = false
