[package]
name = "bagholder-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# SQLite itself, built from source so a copy of the app carries its own and
# does not depend on what the machine happens to have.
# "hooks": SQLite tells the process when a transaction commits (open_db_hooked), so a
# change reaches the page because it happened, not because something polled for it
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
# the instant a migration ran and a snapshot was taken, given by the caller (this
# crate never reads the clock) and written in one format
jiff = "0.2.37"

[dev-dependencies]
tempfile = "3"
