[package]
name = "bagholder-model"
version.workspace = true
edition.workspace = true

[dependencies]
# "rc": a trade's legs and fills are shared, not copied, between the model and each view of it
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The activity clock is America/Edmonton. The rules have to come from the
# system's own tzdata, not a bundled copy: a bundled
# snapshot drifts, and Alberta's move to permanent Central Standard Time in
# 2026 is already in the system database but not in older bundles.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tz-rs = "0.7"
ts-rs = "12.0.1"
# the stream's differ: each wire type compared field by field, each row type by its own id
bagholder-diff-derive = { path = "../diff-derive" }

[dev-dependencies]

[[bin]]
name = "make-cases"
path = "src/bin/make_cases.rs"
