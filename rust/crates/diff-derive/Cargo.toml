[package]
name = "bagholder-diff-derive"
version.workspace = true
edition.workspace = true

[lib]
proc-macro = true

# `#[derive(Diff)]` for the wire types (bagholder_diff). These three
# are already in the build, under serde's and ts-rs's own derives: nothing new is
# fetched or trusted for them.
[dependencies]
proc-macro2 = "1"
quote = "1"
syn = "2"
