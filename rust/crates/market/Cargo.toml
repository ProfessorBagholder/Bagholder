[package]
name = "bagholder-market"
version.workspace = true
edition.workspace = true

[dependencies]
bagholder-model = { path = "../model" }
bagholder-net = { path = "../net" }
# the one HTML table reader and character-reference rules, moved there
bagholder-sources = { path = "../sources" }
bagholder-store = { path = "../store" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# SHA digests (a cached model file, a document's key, a headline's key)
openssl = "0.10"
# the filing sources' page patterns
regex = "1"
# a headline's accents taken off, so `Québec` and `Quebec` are one word
unicode-normalization = "0.1"
# the text of an issuer PDF where no system pdftotext is present
pdf-extract = "0.9"

[dev-dependencies]
# tests read the time zone rules built into jiff, never the machine's
bagholder-model = { path = "../model", features = ["pinned-tzdb"] }
tempfile = "3"
