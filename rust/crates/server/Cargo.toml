[package]
name = "bagholder-server"
version.workspace = true
edition.workspace = true

[dependencies]
# the official MCP SDK, which tracks the specification's revisions: `bagholder mcp` over stdio (its archive cost measured in #535),
# and the agents' address over Streamable HTTP, served as a tower service inside axum (docs/plans/agents-from-anywhere.md)
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
# the diff `#[derive(Diff)]` implements
bagholder-diff = { path = "../diff" }
# the page's order types are generated from these (web/src/lib/generated/orders.ts), as the
# model's are: the two sides of the wire cannot drift
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
bagholder-model = { path = "../model" }
bagholder-diff-derive = { path = "../diff-derive" }
bagholder-market = { path = "../market" }
bagholder-net = { path = "../net" }
bagholder-ws = { path = "../ws" }
# the book the app moves onto at the switch (docs/design-review.md, stage 3); for
# now only `bagholder import-book` writes it, from the database kept today, and
# `bagholder compare-figures` reads it
bagholder-book = { path = "../book" }
# the broker interface and Wealthsimple's adapter, for `pull-broker`
bagholder-broker = { path = "../broker" }
bagholder-wealthsimple = { path = "../wealthsimple" }
bagholder-core = { path = "../core" }
# the engine the app moves onto at the switch; for now `compare-figures` runs it
# beside the old model (docs/plans/stage-2-engine.md)
bagholder-engine = { path = "../engine" }
# the readers of market data and facts: `read-sources` and `source-health`
# (docs/plans/stage-3a-sources.md)
bagholder-sources = { path = "../sources" }
# the connections kept between uses on the market cache, where the earlier readers'
# tables are (docs/plans/stage-6-cutover.md, 6a)
bagholder-sqlite = { path = "../sqlite" }
jiff = "0.2.37"
regex = "1"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
# raw_value: a price or quantity goes to Wealthsimple as its exact decimal digits in
# the number position (`orders/gate.rs`, `Exact`), never as a float (brief 19, change 5).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# The HTTP server (docs/architecture.md, "Process and HTTP"). axum on tokio and
# hyper: typed extractors and responses per route, tower middleware for the gate,
# the limits and the panic catcher, streamed bodies for the event stream, and a
# graceful stop. It replaced tiny_http and a thread per request with hand-rolled
# routing, query parsing and chunked writes.
# fs, io-util: an import is written to disk as it arrives, never held whole (`http::model::import`)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
# the query string read as axum reads it (its own parser, already built for axum), so
# a refused request says the reason alone, not axum's wrapper around it
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "set-header", "timeout"] }
# streams for response bodies (the event stream, the sign-in frames)
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[[bin]]
name = "bagholder"
path = "src/main.rs"

# A developer's subcommands, never in a release build (release.yml, the Dockerfile
# and capacity.yml build without them; tests.yml holds the release archive's binary
# to carrying neither):
[features]
# `bagholder demo <folder>`: the made-up book the browser tests and screenshots run on
demo = ["bagholder-wealthsimple/demo"]
# `bagholder pull-broker <folder> [--replay <capture>]`: Wealthsimple pulled into a
# book from the command line, live or from a capture
pull-broker = []

[dev-dependencies]
# the book's test oracles (its names held to their fold), in tests only
bagholder-book = { path = "../book", features = ["oracles"] }
# the engine's test oracles (a continued match held to a whole one), in tests only
bagholder-engine = { path = "../engine", features = ["oracles"] }
# tests read the time zone rules built into jiff, never the machine's
bagholder-model = { path = "../model", features = ["pinned-tzdb"] }
# the stand-in Wealthsimple server, for the sync's own tests
bagholder-ws = { path = "../ws", features = ["standin"] }
# a data folder of its own for each test
tempfile = "3"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# the system's own calls for BAGHOLDER_EXIT_WITH: a process's exit woken by a pidfd (Linux) or a kqueue NOTE_EXIT (macOS)
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# a process handle's wait, for BAGHOLDER_EXIT_WITH on Windows; the registry, to remove the app id earlier versions registered for notifications;
# a job object that ends an agents' tunnel with its guard
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_JobObjects", "Win32_Security"] }
