[package]
name = "bagholder-server"
version.workspace = true
edition.workspace = true

[dependencies]
bagholder-model = { path = "../model" }
bagholder-store = { path = "../store" }
bagholder-market = { path = "../market" }
bagholder-ws = { path = "../ws" }
regex = "1"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# The standard library has no HTTP server. tiny_http is the smallest thing that
# is a real one: threads and sockets, no async runtime behind it.
tiny_http = "0.12"

[[bin]]
name = "bagholder"
path = "src/main.rs"
