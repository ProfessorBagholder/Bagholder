# Wealthsimple's own document, from its web app (release 0.3.668812, read 2026-09-24).
query FetchInternalTransfer($id: ID!) {
  internalTransfer: internal_transfer(id: $id) {
    id
    ...InternalTransfer
  }
}
fragment InternalTransfer on InternalTransfer {
  amount
  currency
  fxRate: fx_rate
  fxAdjustedAmount: fx_adjusted_amount
  reportedFxAdjustedAmount: reported_fx_adjusted_amount {
    amount
    currency
  }
  fxFeeRate: conversion_fee_rate
  isCancellable: is_cancellable
  status
  transferType: transfer_type
  source_account {
    id
    unifiedAccountType
  }
  tax_detail {
    id
    federal_tax_amount
    gross_amount
    net_amount
    document_url
  }
  annotation
  reason
}
