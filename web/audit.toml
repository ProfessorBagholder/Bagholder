# Advisories `npm audit` lets pass, each with why, and when it leaves
# (`bin/npm-audit.mjs`, in the job `audit`; the form of `rust/.cargo/audit.toml`).
[advisories]
ignore = [
    # deepmerge 4.3.1, reached only through @sveltejs/vite-plugin-svelte (^4.3.1, every
    # release to 7.3.1), which merges its own configuration objects with it while the
    # page is built. The shipped app carries no deepmerge, and nothing of a person's or
    # an agent's reaches it. No deepmerge release fixes it (4.3.1, 2023, is the newest).
    # Leaves with the release of deepmerge, or of the plugin, that drops the range
    # (2026-10-28).
    # mergeObject() allows prototype poisoning of returned objects (low).
    "GHSA-gcqx-w48m-w2h4",
]
