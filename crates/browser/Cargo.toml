[package]
name = "bagholder-browser"
version.workspace = true
edition.workspace = true

# Yahoo's statistics and SEDAR+ gate on a browser's TLS handshake, which
# neither OpenSSL nor the platform stack presents; the Python app reaches them
# through curl_cffi for the same reason. wreq carries a browser's handshake
# over BoringSSL. BoringSSL and the OpenSSL the market client links export the
# same symbols, so this is its own process: the market crate talks to it over
# a pipe, one request per line, and the session's cookies live here.
[dependencies]
wreq = { version = "=6.0.0-rc.31", features = ["cookies"] }
wreq-util = "=3.0.0-rc.14"
tokio = { version = "1", features = ["rt"] }
serde_json = { version = "1", features = ["preserve_order"] }
