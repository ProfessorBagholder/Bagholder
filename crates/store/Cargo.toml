[package]
name = "bagholder-store"
version.workspace = true
edition.workspace = true

[dependencies]
bagholder-model = { path = "../model" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# SQLite itself, built from source so a copy of the app carries its own and
# does not depend on what the machine happens to have.
rusqlite = { version = "0.32", features = ["bundled"] }
