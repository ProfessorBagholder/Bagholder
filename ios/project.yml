name: Bagholder
options:
  bundleIdPrefix: com.bagholder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Bagholder:
    type: application
    platform: iOS
    sources:
      - path: Bagholder
        excludes:
          - Info.plist
          - Bagholder.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagholder.app
        PRODUCT_NAME: Bagholder
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: Bagholder/Bagholder.entitlements
        INFOPLIST_FILE: Bagholder/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    resources:
      - path: ../ledger.html
      - path: ../favicon.png
    scheme:
      testTargets:
        - SpikeLoopback
  SpikeLoopback:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BagholderTests
    dependencies:
      - target: Bagholder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bagholder.app.SpikeLoopback
        PRODUCT_NAME: SpikeLoopback
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bagholder.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Bagholder"
        BUNDLE_LOADER: "$(TEST_HOST)"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  Bagholder:
    build:
      targets:
        Bagholder: all
        SpikeLoopback: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SpikeLoopback
  SpikeLoopback:
    build:
      targets:
        Bagholder: all
        SpikeLoopback: [test]
    test:
      config: Debug
      targets:
        - SpikeLoopback
